ules to usage."}, {"q": "Which statement about cloud economics is correct?", "o": ["Economic benefit depends on workload, usage patterns and service arrangement", "Cloud is never cheaper", "Cloud is always cheaper", "Cloud has no cost"], "a": 0, "w": "The notes say it's not automatically cheaper for every workload."}]}, {"title": "7. Cloud security", "summary": "Infrastructure security: network, host and application security. CIA triad: Confidentiality (authorised access only), Integrity (accuracy, no improper alteration), Availability (accessible when needed). Other terms: IAM, encryption, access control, authentication, trust, reputation, risk assessment. Threats: data loss, account hijacking, service-traffic disruption, vulnerable APIs.", "qs": [{"q": "The three infrastructure-security levels are:", "o": ["Public, private, hybrid", "Network, host and application security", "Physical, logical and cloud", "IaaS, PaaS, SaaS"], "a": 1, "w": "The guide lists network, host and application security."}, {"q": "CIA in the CIA triad stands for:", "o": ["Cloud, Internet, Application", "Control, Identity, Access", "Cost, Inventory, Audit", "Confidentiality, Integrity, Availability"], "a": 3, "w": "CIA = Confidentiality, Integrity, Availability."}, {"q": "Confidentiality means:", "o": ["Only authorised parties can access information", "Information is never changed", "Information is accessible when needed", "Information is public"], "a": 0, "w": "Confidentiality restricts access to authorised parties."}, {"q": "Integrity means:", "o": ["Information remains accurate and is not improperly altered", "Only authorised access", "Systems are accessible", "Information is encrypted"], "a": 0, "w": "Integrity = accuracy and no improper alteration."}, {"q": "Availability means:", "o": ["Access limited", "Data deleted", "Systems/data remain accessible when needed", "Data accurate"], "a": 2, "w": "Availability = accessible when needed."}, {"q": "IAM stands for:", "o": ["Information Assurance Matrix", "Internet Access Manager", "Integrated Application Module", "Identity and Access Management"], "a": 3, "w": "IAM manages who may access which resources."}, {"q": "Encryption protects data by:", "o": ["Making it unreadable without the appropriate key", "Copying it", "Compressing it only", "Deleting it"], "a": 0, "w": "This is the definition."}, {"q": "Authentication:", "o": ["Measures risk", "Records usage", "Verifies identity", "Limits actions by permissions"], "a": 2, "w": "Authentication verifies identity; access control limits actions."}, {"q": "Access control:", "o": ["Limits actions/resources according to permissions", "Verifies identity only", "Bills users", "Encrypts data"], "a": 0, "w": "Access control enforces permissions."}, {"q": "Risk assessment:", "o": ["Identifies and categorises risks to support appropriate controls", "Is encryption", "Is billing", "Removes all risks"], "a": 0, "w": "It supports choice of controls."}, {"q": "Which is a cloud threat mentioned in the guide?", "o": ["Vulnerable APIs", "Account hijacking", "Data loss", "All of the above"], "a": 3, "w": "Data loss, account hijacking, service-traffic disruption and vulnerable APIs are listed."}, {"q": "Trust and reputation:", "o": ["They are the same", "Both are protocols", "Trust = expectation an entity/service will behave as required; reputation = standing based on past behaviour/others' experience", "Trust = billing; reputation = encryption"], "a": 2, "w": "These are the stated definitions."}]}, {"title": "8. Cloud case studies and simulators", "summary": "Simulation enables repeatable, controllable pre-deployment evaluation. CloudSim: Java-based simulation of data centres, VMs, applications, users and network topology. CloudAnalyst: analysis of applications with geographically distributed users. GreenCloud: energy-aware data-centre simulation. Others: iCanCloud, GroudSim, DCSim. Platforms: OpenStack (open-source), Microsoft Azure, Amazon EC2.", "qs": [{"q": "Why use cloud simulation?", "o": ["To evaluate performance and test countermeasures before deployment in a repeatable environment", "To avoid all testing", "To bill customers", "To build physical data centres"], "a": 0, "w": "Simulation allows pre-deployment evaluation."}, {"q": "CloudSim is described as:", "o": ["A servo library", "A Java-based simulation framework for cloud environments", "A sensor", "A routing protocol"], "a": 1, "w": "CloudSim simulates data centres, VMs, apps and users."}, {"q": "CloudAnalyst focuses on:", "o": ["Energy only", "Wireless sensors", "Cloud application analysis with geographically distributed users and data-centre performance", "Servo control"], "a": 2, "w": "This is its stated focus."}, {"q": "GreenCloud focuses on:", "o": ["User geography", "Energy-aware cloud/data-centre simulation", "Routing", "Billing"], "a": 1, "w": "GreenCloud = energy-aware."}, {"q": "Which are other simulator names listed?", "o": ["Horizon, Nova", "iCanCloud, GroudSim and DCSim", "ONOS, Mininet-WiFi", "MQTT, CoAP"], "a": 1, "w": "These are the other simulators named."}, {"q": "OpenStack is:", "o": ["An open-source cloud platform", "A router", "A simulator", "A commercial-only cloud"], "a": 0, "w": "OpenStack is open-source."}, {"q": "Microsoft Azure in the guide is discussed in relation to:", "o": ["Only sensors", "Only simulation", "Only SaaS", "PaaS and IaaS"], "a": 3, "w": "The guide ties Azure to PaaS and IaaS."}, {"q": "Amazon EC2 is:", "o": ["An SDN controller", "A wireless protocol", "Virtual compute infrastructure/service", "A sensor"], "a": 2, "w": "EC2 provides virtual compute."}, {"q": "Open-source versus commercial cloud comparison is framed as:", "o": ["Cheaper versus expensive only", "Wired versus wireless", "Customisation/control versus managed services/support and provider-specific features", "Blue versus green"], "a": 2, "w": "This is the high-level comparison in the guide."}]}]}, {"title": "WEEK 9 — OpenStack, Sensor-Cloud and Fog Computing", "topics": [{"title": "1. Week 9 at a glance", "summary": "OpenStack = how to build and manage cloud infrastructure; sensor-cloud = how to offer sensing resources as a service using virtualization; fog computing = where to process data when decisions must be made close to IoT devices. These ideas are complementary, not interchangeable.", "qs": [{"q": "Which technology answers \"how to build and manage cloud infrastructure\"?", "o": ["Fog computing", "OpenStack", "RFID", "Sensor-cloud"], "a": 1, "w": "OpenStack builds and manages cloud infrastructure."}, {"q": "Which concept offers sensing resources as a service using virtualization?", "o": ["OpenStack", "NFC", "Sensor-cloud", "Fog"], "a": 2, "w": "Sensor-cloud virtualises sensing resources into services."}, {"q": "Which concept addresses where to process data when decisions must be made close to IoT devices?", "o": ["Fog computing", "Heat", "OpenStack", "Sensor-cloud"], "a": 0, "w": "Fog processes data near devices."}, {"q": "The basic IoT flow in the notes is:", "o": ["Application → cloud → sensor", "Actuation → sensing → storage", "Sensors/devices → communication → data handling/processing → inference or decision → service/actuation", "Cloud → network → device only"], "a": 2, "w": "This is the flow stated in the notes."}]}, {"title": "2. OpenStack: definition and components", "summary": "OpenStack is open-source software for creating and managing cloud infrastructure (private or public) using separate services for compute, images, networking, storage, identity, orchestration and metering. Horizon = dashboard/GUI; Keystone = identity (authentication/authorization); Nova = compute; Glance = VM images; Neutron = networking; Swift = object storage; Cinder = block storage; Heat = orchestration; Ceilometer = metering.", "qs": [{"q": "Horizon is OpenStack's:", "o": ["Dashboard / graphical user interface", "Compute service", "Image service", "Identity service"], "a": 0, "w": "Horizon = dashboard (human-facing GUI)."}, {"q": "Keystone provides:", "o": ["Identity — authentication and authorization", "Block storage", "Orchestration", "Object storage"], "a": 0, "w": "Memory cue: \"Who are you? What may you access?\""}, {"q": "Nova is responsible for:", "o": ["Networking", "Images", "Metering", "Compute — launching and managing instances"], "a": 3, "w": "Nova = compute/VM."}, {"q": "Glance provides:", "o": ["Orchestration", "Block storage", "Networking", "VM image service — registering and retrieving images"], "a": 3, "w": "Glance = image service."}, {"q": "Neutron provides:", "o": ["Networking — networks, routers, interfaces and connectivity", "Identity", "Images", "Compute"], "a": 0, "w": "Neutron = network."}, {"q": "Swift is:", "o": ["Block storage", "Object storage", "Orchestration", "Networking"], "a": 1, "w": "Swift = objects/files."}, {"q": "Cinder is:", "o": ["Object storage", "Block storage (attachable block volumes)", "Metering", "Identity"], "a": 1, "w": "Cinder = block storage."}, {"q": "Heat provides:", "o": ["Orchestration — coordinates resource deployment", "Images", "Metering", "Identity"], "a": 0, "w": "Heat = orchestration."}, {"q": "Ceilometer provides:", "o": ["Metering", "Networking", "Object storage", "Orchestration"], "a": 0, "w": "The exam traps list Ceilometer = metering."}, {"q": "Which pairing is correct?", "o": ["Nova — compute; Glance — images", "Horizon — identity; Keystone — dashboard", "Swift — block storage; Cinder — object storage", "Nova — images; Glance — compute"], "a": 0, "w": "Nova launches instances; Glance provides images; the other pairs are swapped."}, {"q": "Exam trap: Horizon versus Keystone.", "o": ["Horizon = identity; Keystone = dashboard", "Horizon = dashboard GUI; Keystone = identity/authentication", "They are the same", "Both are storage"], "a": 1, "w": "Horizon ≠ Keystone."}, {"q": "Why are OpenStack services separated?", "o": ["Launching a VM needs compute, an image, identity/access control, networking and sometimes storage", "Because VMs need no network", "To reduce features", "To avoid images"], "a": 0, "w": "Different functions are modular services."}]}, {"title": "3. OpenStack practical workflow and connectivity", "summary": "Workflow: create/import an SSH key pair → choose image, flavor, network → launch an instance (Nova) → configure network/router (Neutron) → set security-group rules → associate a floating IP if outside access is needed → test with ping/ICMP or SSH. Router connects networks; IP identifies an endpoint; security group controls allowed traffic; floating IP provides external reachability; key pair supports secure access.", "qs": [{"q": "In the workflow, which is created first?", "o": ["Router", "Floating IP", "Security group rules", "SSH key pair"], "a": 3, "w": "The workflow starts with creating/importing an SSH key pair."}, {"q": "Which service launches the instance in the workflow?", "o": ["Nova", "Swift", "Heat", "Cinder"], "a": 0, "w": "Nova launches instances."}, {"q": "A security group:", "o": ["Connects networks", "Stores images", "Controls allowed traffic", "Identifies an endpoint"], "a": 2, "w": "Security group = traffic rules."}, {"q": "A router in OpenStack:", "o": ["Connects networks", "Stores keys", "Identifies an interface", "Controls allowed traffic"], "a": 0, "w": "Router = connects networks."}, {"q": "A floating IP:", "o": ["Is a router", "Is a flavor", "Is a key pair", "Can provide external reachability in the demonstrated configuration"], "a": 3, "w": "A floating IP gives outside access."}, {"q": "A key pair supports:", "o": ["Secure instance access", "Routing", "Image storage", "Billing"], "a": 0, "w": "SSH key pairs enable secure access."}, {"q": "A VM is running but unreachable from outside. Which is a likely cause?", "o": ["Missing routing, floating IP or security-group rules", "Nova is not installed", "Too much storage", "Too many images"], "a": 0, "w": "A running VM is not necessarily reachable from outside."}, {"q": "How can connectivity be tested in the demonstration?", "o": ["Using RFID", "Using NFC", "Using servos", "Using ping/ICMP or SSH with suitable rules and credentials"], "a": 3, "w": "Ping or SSH tests reachability."}]}, {"title": "4. DevStack — course workflow", "summary": "The slides show a historical demonstration: install Git → clone DevStack → enter directory → configure local.conf with passwords and HOST_IP → run ./stack.sh; ./unstack.sh removes. Treat these as course-era commands, not a current installation guide; never put real passwords in shared notes.", "qs": [{"q": "Which script starts the DevStack installation in the course demo?", "o": ["./unstack.sh", "./stack.sh", "./clone.sh", "./run.sh"], "a": 1, "w": "./stack.sh runs the install."}, {"q": "Which script is named for removal?", "o": ["./stack.sh", "./stop.sh", "./unstack.sh", "./remove.sh"], "a": 2, "w": "./unstack.sh is the removal script."}, {"q": "The local.conf file in DevStack configures:", "o": ["Only icons", "Passwords and HOST_IP", "Only the dashboard", "Only fonts"], "a": 1, "w": "It stores passwords and HOST_IP settings."}, {"q": "How should the DevStack commands be treated?", "o": ["As course-era commands, not a current guide", "As a current installation guide", "As optional", "As illegal"], "a": 0, "w": "The notes say they are historical demonstration commands."}]}, {"title": "5. WSN and cloud basics", "summary": "A WSN consists of sensor nodes that observe and communicate; a sink collects data. Cloud computing provides on-demand compute/storage. Virtualization abstracts physical resources so they can be shared or accessed as virtual resources. Traditional WSNs are constrained by energy, processing, storage, range and fixed-purpose deployment.", "qs": [{"q": "Virtualization:", "o": ["Compresses sensor data", "Adds antennas", "Abstracts physical resources so they can be shared or accessed as virtual resources", "Removes resources"], "a": 2, "w": "This is the definition given."}, {"q": "A sink in a WSN:", "o": ["Is an actuator", "Is a router", "Is a central unit that collects data from sensor nodes", "Is a sensor"], "a": 2, "w": "The sink collects data."}, {"q": "Traditional WSN constraints include:", "o": ["Unlimited storage", "Energy, processing, storage, communication range and fixed-purpose deployment", "No constraints", "Unlimited energy"], "a": 1, "w": "These are the listed limitations."}]}, {"title": "6. Sensor-cloud", "summary": "Sensor-cloud integrates sensor networks with cloud computing and virtualization so sensing can be managed and offered as a service; users consume sensing without owning every physical sensor. Se-aaS = Sensors-as-a-Service / sensing-as-a-service. Actors: sensor owner (owns/deploys sensors) and sensor-cloud service provider (SCSP: manages and offers the service).", "qs": [{"q": "Sensor-cloud integrates:", "o": ["Only RFID tags", "Sensor networks with cloud computing and virtualization", "Only NFC", "Only batteries"], "a": 1, "w": "This is the definition."}, {"q": "Se-aaS stands for:", "o": ["Secure Edge as a Service", "Server Enhancement as a Service", "Software Engineering as a Service", "Sensors-as-a-Service"], "a": 3, "w": "Se-aaS = sensing-as-a-service."}, {"q": "The sensor owner:", "o": ["Owns/purchases and deploys physical sensor nodes", "Manages the sensing service", "Consumes the service", "Runs the cloud"], "a": 0, "w": "Sensor owner owns and deploys sensors."}, {"q": "SCSP stands for:", "o": ["Sensor-Cloud Service Provider", "Secure Cloud Sensing Protocol", "Sensor Control and Storage Platform", "Shared Cloud Server Pool"], "a": 0, "w": "SCSP = Sensor-cloud service provider."}, {"q": "The SCSP:", "o": ["Is the end user", "Owns all sensors", "Is a sensor", "Manages the sensing service and offers access to sensor resources"], "a": 3, "w": "SCSP manages/offers the service."}, {"q": "Exam trap: sensor-cloud is:", "o": ["Only uploading raw sensor data to a cloud", "A type of battery", "Not a service", "More than uploading raw data; it offers virtualized sensing as a service"], "a": 3, "w": "The notes say it is more than uploading raw data."}]}, {"title": "7. Physical versus virtual sensors and composition", "summary": "A physical sensor is an actual deployed device. A virtual sensor is a service-facing abstraction that can map to one or more physical sensors (not necessarily one-to-one). Composition chooses which physical sensors contribute to a virtual sensing service. CoV-I = homogeneous sensors within the same geographic region; CoV-II = heterogeneous sensors across multiple regions.", "qs": [{"q": "A virtual sensor:", "o": ["Is a service-facing abstraction that can map to one or more physical sensors", "Is a device", "Cannot map to anything", "Always maps one-to-one to a physical sensor"], "a": 0, "w": "Virtual sensors need not map one-to-one."}, {"q": "A physical sensor is:", "o": ["A billing term", "A cloud region", "An actual deployed device that measures a physical quantity", "A service abstraction"], "a": 2, "w": "This is the definition."}, {"q": "CoV-I composition uses:", "o": ["Only virtual sensors", "Homogeneous sensors within the same geographic region", "Only actuators", "Heterogeneous sensors in multiple regions"], "a": 1, "w": "CoV-I = homogeneous/same region."}, {"q": "CoV-II composition uses:", "o": ["Heterogeneous sensors across multiple regions", "Only mobile sensors", "Homogeneous sensors in one region", "No sensors"], "a": 0, "w": "CoV-II = heterogeneous/multiple regions."}, {"q": "Composition in sensor-cloud:", "o": ["Chooses which physical sensors contribute to a virtual sensing service", "Removes sensors", "Compresses the cloud", "Encrypts sensors"], "a": 0, "w": "It groups sensors into virtual services for applications."}]}, {"title": "8. Sensor-cloud caching and pricing", "summary": "Caching avoids repeatedly probing sensors when data have not changed enough to justify a fresh reading, reducing communication/energy and improving network lifetime. Internal cache (IC): inside the sensor-cloud, handles end-user requests and decides to serve cached data or re-cache. External cache (EC): separate server/hardware storing readings and refreshing at intervals. Pricing: pH = hardware/sensor-related; pI = infrastructure-related.", "qs": [{"q": "The purpose of caching in sensor-cloud is to:", "o": ["Avoid repeatedly probing sensors, saving communication/energy", "Increase probing", "Delete data", "Lower freshness always"], "a": 0, "w": "Caching reduces unnecessary sensor reads."}, {"q": "The Internal cache (IC) is:", "o": ["A router", "Inside the sensor-cloud, deciding whether to serve cached data or re-cache", "A sensor", "A separate server/hardware"], "a": 1, "w": "IC is within the sensor-cloud."}, {"q": "The External cache (EC) is:", "o": ["A virtual sensor", "A separate server/hardware that stores readings and refreshes at intervals", "Inside the cloud only", "A pricing model"], "a": 1, "w": "EC is external hardware."}, {"q": "In sensor-cloud pricing, pH represents:", "o": ["Power", "Hardware/sensor-related pricing component", "Infrastructure-related component", "Acidity"], "a": 1, "w": "pH = hardware."}, {"q": "In sensor-cloud pricing, pI represents:", "o": ["Interference", "Hardware component", "Infrastructure-related pricing component", "Internet protocol"], "a": 2, "w": "pI = infrastructure."}, {"q": "The pricing proposal balances the interests of:", "o": ["Only the SCSP", "SCSP, sensor owner and end user", "Only the user", "Only the owner"], "a": 1, "w": "All three parties are balanced."}, {"q": "The supplied notes provide a complete pricing equation.", "o": ["True for pH only", "True for pI only", "False; they do not, so do not invent one", "True"], "a": 2, "w": "The notes explicitly say no complete equation is provided."}]}, {"title": "9. Fog computing — definition, rationale and latency", "summary": "Fog computing extends cloud-like processing and temporary storage closer to IoT devices through an intermediate layer, so time-sensitive decisions avoid a distant cloud round trip. Cloud-only processing can cause delay and device energy use. Latency: L = T(device→cloud) + T(analysis) + T(cloud→device).", "qs": [{"q": "Fog computing:", "o": ["Replaces all sensors", "Is a modulation", "Is an OpenStack service", "Extends cloud-like processing and temporary storage closer to IoT devices through an intermediate layer"], "a": 3, "w": "This is the definition."}, {"q": "Why can sending all raw data to a distant cloud be a problem?", "o": ["It is faster always", "It removes latency", "It saves energy", "It can cause delay and consume device energy/bandwidth"], "a": 3, "w": "Distant round trips and communication energy are costs."}, {"q": "The cloud round-trip latency formula is:", "o": ["L = T(device→cloud) × T(analysis)", "L = T(analysis) − T(device→cloud)", "L = T(cloud→device) ÷ T(analysis)", "L = T(device→cloud) + T(analysis) + T(cloud→device)"], "a": 3, "w": "Sum all terms after converting to the same unit."}, {"q": "If device→cloud = 0.18 s, analysis = 0.04 s and cloud→device = 0.13 s, the latency is:", "o": ["0.35 s (350 ms)", "3.5 s", "0.31 s", "0.22 s"], "a": 0, "w": "0.18 + 0.04 + 0.13 = 0.35 s = 350 ms."}, {"q": "If device→cloud = 120 ms, analysis = 30 ms and cloud→device = 100 ms, latency L is:", "o": ["150 ms", "220 ms", "250 ms", "2.5 s"], "a": 2, "w": "120 + 30 + 100 = 250 ms."}, {"q": "Before adding latency terms you must:", "o": ["Multiply them", "Drop the units", "Ignore analysis", "Convert all terms to the same unit"], "a": 3, "w": "The notes say add after converting to the same unit."}]}, {"title": "10. Fog processing tiers", "summary": "Very time-sensitive data: processed at the nearest fog node (fraction of a second). Less time-sensitive: aggregate fog node (seconds to minutes). Summaries and long-term records go to the cloud.", "qs": [{"q": "Very time-sensitive data is processed at:", "o": ["The cloud only", "An external cache", "The nearest fog node", "The aggregate fog node"], "a": 2, "w": "Nearest fog node = fraction of a second."}, {"q": "Less time-sensitive data is processed at:", "o": ["The actuator", "Aggregate fog node", "The sensor", "Nearest fog node"], "a": 1, "w": "Aggregate fog node = seconds to minutes."}, {"q": "Summaries and long-term records are sent to:", "o": ["The nearest fog node only", "The sensor", "The cloud", "The relay"], "a": 2, "w": "Cloud holds long-term records."}, {"q": "The typical fog timing for very time-sensitive decisions is:", "o": ["Hours", "Weeks", "Days", "A fraction of a second"], "a": 3, "w": "Course timing for the nearest fog node."}]}, {"title": "11. Fog advantages, challenges and applications", "summary": "Advantages: faster response for safety-critical events, reduced bandwidth via local filtering/aggregation, privacy benefits, local security policies, support for mobile/remote/harsh environments. Challenges: distributed security, reliability/fault tolerance, additional power consumption, real-time analysis at scale, programming complexity, nodes moving/joining/leaving. Applications: real-time health/emergency, power-efficient systems, railway-track, oil/gas pipeline, windmill/turbine.", "qs": [{"q": "Which is a fog advantage?", "o": ["No local processing", "More raw data to cloud", "Faster response for safety-critical events", "Higher latency"], "a": 2, "w": "Local processing speeds critical responses."}, {"q": "Fog can reduce bandwidth use through:", "o": ["Local filtering and aggregation", "Removing devices", "Sending everything", "Increased polling"], "a": 0, "w": "Filtering/aggregation reduces transmission."}, {"q": "Which is a fog challenge listed?", "o": ["Distributed security management", "Reliability and fault tolerance", "Additional power consumption", "All of the above"], "a": 3, "w": "All are listed challenges."}, {"q": "Which is a fog application listed in the course?", "o": ["Railway-track monitoring", "Windmill/turbine analysis", "Oil/gas pipeline monitoring", "All of the above"], "a": 3, "w": "All are listed applications."}, {"q": "A potential privacy benefit of fog is:", "o": ["Data is public", "Sensitive data can remain local", "No privacy", "All data goes to cloud"], "a": 1, "w": "Keeping data local can help privacy."}]}, {"title": "12. Fog versus cloud versus sensor-cloud", "summary": "Cloud: on-demand compute and long-term storage; sensor-cloud: sensing resources as a service via virtualization; fog: near-device processing for timely response. Benefits: cloud — large-scale processing and history; sensor-cloud — access/composition of sensor resources; fog — low latency and less data transmission.", "qs": [{"q": "Main purpose of fog computing:", "o": ["Near-device processing for timely response", "Cloud building", "Long-term storage only", "Sensing resources as a service"], "a": 0, "w": "Fog = near-device processing."}, {"q": "Main purpose of sensor-cloud:", "o": ["Image storage", "Large-scale history", "Sensing resources as a service", "Low latency"], "a": 2, "w": "Sensor-cloud virtualizes/manages sensing."}, {"q": "Typical benefit of fog:", "o": ["Low latency and less data transmission", "Billing", "Large-scale history", "Composition of sensors"], "a": 0, "w": "This is fog's listed benefit."}, {"q": "Typical benefit of cloud:", "o": ["Low latency", "Sensor virtualization", "Local control", "Large-scale processing and history"], "a": 3, "w": "Cloud offers large-scale processing and history."}]}]}, {"title": "WEEK 10 — Smart Cities, Data Fusion, Smart Homes and Connected Vehicles", "topics": [{"title": "1. Smart cities: definition and need", "summary": "A smart city uses Information and Communication Technology (ICT) to make urban infrastructure more interactive, accessible and efficient; value comes from integrated services, not merely many devices. Needed because of rapid urban population growth, depletion of natural resources, and environmental/climate change.", "qs": [{"q": "A smart city uses:", "o": ["Only cameras", "ICT to make urban infrastructure more interactive, accessible and efficient", "Only more roads", "Only buildings"], "a": 1, "w": "This is the definition."}, {"q": "ICT stands for:", "o": ["Integrated Circuit Technology", "Information and Communication Technology", "Internet and Cable Technology", "Internal Control Terminal"], "a": 1, "w": "ICT = Information and Communication Technology."}, {"q": "A smart city's value comes from:", "o": ["Only energy use", "The number of devices alone", "Only taxes", "Integrated services, not simply from having many devices"], "a": 3, "w": "The notes emphasise integrated services."}, {"q": "Which is NOT listed as a reason smart cities are needed?", "o": ["Environmental and climate change", "Depletion of natural resources", "Decrease in internet usage", "Rapid urban population growth"], "a": 2, "w": "The three reasons are population growth, resource depletion and environmental changes."}]}, {"title": "2. Human-body analogy", "summary": "Skeleton = buildings, industries, people; skin = transportation and logistics; organs = hospitals, police, banks, schools; brain = embedded intelligence; nerves = digital telecommunication networks; sensory organs = sensors and tags; cognition = software.", "qs": [{"q": "In the body analogy, the \"brain\" of a smart city is:", "o": ["Telecom networks", "Transport", "Buildings", "Embedded intelligence"], "a": 3, "w": "Brain = embedded intelligence."}, {"q": "In the body analogy, \"nerves\" correspond to:", "o": ["Sensors", "Digital telecommunication networks", "Hospitals", "Software"], "a": 1, "w": "Nerves = digital telecom networks."}, {"q": "\"Sensory organs\" correspond to:", "o": ["Sensors and tags", "Roads", "Software", "Banks"], "a": 0, "w": "Sensors and tags sense the environment."}, {"q": "\"Skin\" corresponds to:", "o": ["Transportation and logistics", "Schools", "Buildings", "Software"], "a": 0, "w": "Skin = transportation and logistics."}, {"q": "\"Skeleton\" corresponds to:", "o": ["Hospitals", "Sensors", "Software", "Buildings, industries, people"], "a": 3, "w": "Skeleton = buildings, industries, people."}, {"q": "\"Organs\" correspond to:", "o": ["Tags", "Telecom", "Embedded intelligence", "Hospitals, police, banks, schools"], "a": 3, "w": "Organs = key institutions."}, {"q": "\"Cognition\" corresponds to:", "o": ["Brain", "Software", "Skin", "Nerves"], "a": 1, "w": "Cognition = software."}]}, {"title": "3. Six smart-city focus areas and applications", "summary": "Smart Economy (competitiveness), Smart Governance (citizen participation), Smart People (social and human capital), Smart Mobility (transport and ICT), Smart Environment (natural resources), Smart Living (quality of life). Applications: smart homes/health monitoring, smart parking, connected vehicles, pollution/calamity monitoring, smart energy, smart agriculture.", "qs": [{"q": "Smart Economy emphasises:", "o": ["Natural resources", "Competitiveness", "Citizen participation", "Quality of life"], "a": 1, "w": "Smart Economy → competitiveness."}, {"q": "Smart Governance emphasises:", "o": ["Transport", "Quality of life", "Competitiveness", "Citizen participation"], "a": 3, "w": "Governance → citizen participation."}, {"q": "Smart People emphasises:", "o": ["Competitiveness", "Resources", "Transport", "Social and human capital"], "a": 3, "w": "People → social/human capital."}, {"q": "Smart Mobility emphasises:", "o": ["Quality of life", "Transport and ICT", "Governance", "Natural resources"], "a": 1, "w": "Mobility → transport and ICT."}, {"q": "Smart Environment emphasises:", "o": ["Natural resources", "Social capital", "Citizen participation", "Competitiveness"], "a": 0, "w": "Environment → natural resources."}, {"q": "Smart Living emphasises:", "o": ["Transport", "Competitiveness", "Governance", "Quality of life"], "a": 3, "w": "Living → quality of life."}, {"q": "How many smart-city focus areas are listed?", "o": ["4", "5", "6", "7"], "a": 2, "w": "Economy, Governance, People, Mobility, Environment, Living = 6."}, {"q": "Which is a smart-city application listed?", "o": ["Smart parking", "Pollution/calamity monitoring", "Smart agriculture", "All of the above"], "a": 3, "w": "All are listed applications."}]}, {"title": "4. Smart-city data pipeline and challenges", "summary": "Pipeline: Collection → Transmission → Storage → Processing. Collection: sensors/mobile devices observe events; transmission: networks move observations; storage: local/remote/warehouse/cloud; processing: cleaning, analytics, prediction. Challenges: security/privacy, heterogeneity/interoperability, reliability, scale and mobility, legal/consent, big data, sensor choice/placement/energy/network architecture. Exam trap: collecting data ≠ fusing it; a sensor network is an enabling technology, not the service itself.", "qs": [{"q": "The correct order of the smart-city data pipeline is:", "o": ["Transmission → Collection → Processing → Storage", "Collection → Transmission → Storage → Processing", "Storage → Collection → Processing → Transmission", "Processing → Storage → Transmission → Collection"], "a": 1, "w": "This is the pipeline order in the notes."}, {"q": "Processing in the pipeline includes:", "o": ["Cleaning, analytics and prediction", "Only transmission", "Only storing", "Only sensing"], "a": 0, "w": "Processing turns data into useful results."}, {"q": "Storage in the pipeline can be:", "o": ["None", "Only local", "Local, remote, warehouse or cloud", "Only cloud"], "a": 2, "w": "All are listed."}, {"q": "Which is a smart-city challenge listed?", "o": ["Security and privacy", "Heterogeneity and interoperability", "Legal issues and informed consent", "All of the above"], "a": 3, "w": "All are listed."}, {"q": "Exam trap: a sensor network is:", "o": ["An enabling technology, not the service itself", "Not needed", "The smart-city service itself", "Always sufficient"], "a": 0, "w": "The notes say it's an enabling technology."}]}, {"title": "5. Data fusion: definition and motivation", "summary": "Data fusion combines information from multiple sources/sensors to produce a richer, more useful understanding, estimate or decision than isolated streams. Reasons: complementary sensors; improved basis for decisions; low-power/low-precision sensors can collectively help; fusion across platforms.", "qs": [{"q": "Data fusion is:", "o": ["Combining information from multiple sources/sensors to produce richer understanding or decisions", "Encrypting data", "Storing data", "Deleting duplicate data only"], "a": 0, "w": "This is the definition."}, {"q": "Why use data fusion?", "o": ["Different sensors provide complementary information", "Combined data can improve the basis for decisions", "Low-power/low-precision sensors may collectively give useful information", "All of the above"], "a": 3, "w": "All are listed reasons."}]}, {"title": "6. Data-fusion challenges", "summary": "Imperfection: inaccurate or uncertain measurements. Ambiguity: outliers or missing data. Conflict: sources disagree. Alignment: convert data into a common frame/representation. Trivial features: distinguish useful information from features adding little value.", "qs": [{"q": "Imperfection in data fusion means:", "o": ["Common frame conversion", "Sources disagree", "Inaccurate or uncertain measurements", "Missing frames"], "a": 2, "w": "Imperfection = inaccurate/uncertain data."}, {"q": "Ambiguity (as categorised in the guide) refers to:", "o": ["Common-frame conversion", "Sources disagreeing", "Outliers or missing data", "Trivial features"], "a": 2, "w": "Ambiguity = outliers/missing data."}, {"q": "Conflict means:", "o": ["Data are aligned", "Measurements are noisy", "Data are missing", "Different sources disagree"], "a": 3, "w": "Conflict = disagreement among sources."}, {"q": "Alignment involves:", "o": ["Encrypting data", "Converting data into a common frame or representation", "Deleting data", "Adding sensors"], "a": 1, "w": "Data from different sources must be put on a common basis."}, {"q": "Trivial features:", "o": ["Distinguishing useful information from features that add little value", "Aligning frames", "Combining decisions", "Fusing images only"], "a": 0, "w": "This is the stated challenge."}]}, {"title": "7. Fusion levels and method families", "summary": "Decision level: combine an ensemble of decisions. Feature level: combine extracted features before decision-making. Pixel level: combine information at the imaging-device/pixel level. Method families: probability-based (Bayesian, statistics, recursive), AI-based (ANN, ML, deep learning, CNN), evidence-based (belief functions, transferable belief models).", "qs": [{"q": "Decision-level fusion combines:", "o": ["Only features", "Raw pixels", "An ensemble of decisions", "Only sensors"], "a": 2, "w": "Memory cue: combine decisions."}, {"q": "Feature-level fusion combines:", "o": ["Pixels", "Final decisions", "Packets", "Extracted features before decision-making"], "a": 3, "w": "Memory cue: combine features."}, {"q": "Pixel-level fusion combines:", "o": ["Sensors", "Features", "Decisions", "Information at the imaging-device/pixel level (image representations)"], "a": 3, "w": "Memory cue: combine image representations."}, {"q": "Which is a probability-based fusion method?", "o": ["CNN", "Transferable belief models", "Belief functions", "Bayesian analysis"], "a": 3, "w": "Probability-based: Bayesian analysis, statistics, recursive methods."}, {"q": "Which is an AI-based fusion method?", "o": ["Convolutional neural networks (CNN)", "Belief functions", "Recursive statistics", "Bayesian analysis"], "a": 0, "w": "AI-based: ANN, ML, deep learning, CNN."}, {"q": "Evidence-based fusion uses:", "o": ["Bayesian only", "Pixels", "Belief functions and transferable belief models", "Neural networks"], "a": 2, "w": "These are the evidence-based methods."}, {"q": "In an autonomous-vehicle example, fusion may combine:", "o": ["Only GPS", "Only a camera", "Only ultrasonic", "LiDAR, ultrasonic sensors, cameras and GPS/satellite information"], "a": 3, "w": "The course mentions these sources for environmental awareness."}, {"q": "Why use AI in sensor-to-actuator systems?", "o": ["To avoid actuators", "To avoid data", "To remove sensors", "To combine information from multiple sources rather than act directly on one or two raw sensor values"], "a": 3, "w": "Intelligence fuses multiple sources before acting."}]}, {"title": "8. Smart parking", "summary": "Smart parking detects vacant spaces, guides drivers and potentially supports automatic charging, reducing search time, traffic, pollution, fuel use and cost. Functional stages: information collection → system deployment → service dissemination. Stationary sensing uses many fixed sensors; mobile sensing uses fewer sensors carried along routes.", "qs": [{"q": "The purpose of smart parking is to:", "o": ["Remove roads", "Block cars", "Detect vacant spaces and guide drivers", "Increase traffic"], "a": 2, "w": "Also reduces search time, traffic, pollution and fuel use."}, {"q": "The functional stages of smart parking are:", "o": ["Information collection → system deployment → service dissemination", "Service dissemination → collection → deployment", "Collection → dissemination → deployment", "Deployment → dissemination → collection"], "a": 0, "w": "This is the stated order."}, {"q": "Stationary sensing in smart parking uses:", "o": ["Only RFID", "Many fixed sensors detecting occupancy", "Only drones", "Few mobile sensors"], "a": 1, "w": "Stationary = many fixed sensors."}, {"q": "Mobile sensing in smart parking uses:", "o": ["Only cameras", "Many fixed sensors", "Fewer sensors carried along routes", "No sensors"], "a": 2, "w": "Mobile sensing uses fewer, moving sensors."}]}, {"title": "9. Energy management and energy harvesting", "summary": "Energy-efficiency approaches: lightweight communication protocols, scheduling, predictive models, cloud-based approaches, low-power transceivers, cognitive management. Ambient harvesting collects energy available in the environment (RF, wind, sunlight, heat, vibration); dedicated harvesting uses an intentionally placed source (e.g. a nearby solar panel).", "qs": [{"q": "Which is an energy-efficiency approach listed?", "o": ["Lightweight communication protocols", "Scheduling", "Low-power transceivers", "All of the above"], "a": 3, "w": "All are in the list."}, {"q": "Ambient energy harvesting:", "o": ["Uses cables", "Uses an intentionally placed source", "Collects energy already available in the surroundings (RF, wind, sunlight, heat, vibration)", "Uses a battery only"], "a": 2, "w": "Ambient = environmental energy."}, {"q": "Dedicated energy harvesting:", "o": ["Is wasteful", "Uses energy from the surroundings only", "Intentionally places an energy source near the IoT device (e.g. a nearby solar panel)", "Uses cables"], "a": 2, "w": "Dedicated = intentionally deployed source."}, {"q": "Exam trap: ambient versus dedicated?", "o": ["Both use cables", "Ambient = already available in surroundings; dedicated = intentionally deployed for the device", "They are the same", "Ambient = intentionally deployed; dedicated = already available"], "a": 1, "w": "This is the stated distinction."}]}, {"title": "10. Smart homes and Home Area Networks (HAN)", "summary": "A smart home integrates household devices and services for automation, security, safety, media, communication and remote access/control. A HAN is a network bounded to the home that connects household devices. Wired HAN can reuse existing wiring and may be low cost; wireless HAN is easier to install and supports mobility/flexible placement.", "qs": [{"q": "A HAN is:", "o": ["A network bounded to the home that connects household devices and systems", "A satellite link", "A city-wide backbone", "A cellular network"], "a": 0, "w": "This is the definition."}, {"q": "Wired HAN advantage:", "o": ["Mobility", "Flexible placement", "Easiest installation", "Can reuse existing wiring/infrastructure and may be low cost"], "a": 3, "w": "Wired HAN reuses wiring."}, {"q": "Wireless HAN advantage:", "o": ["Usually easier to install and supports mobility/flexible placement", "Reuses wiring", "Requires cables", "Uses power lines"], "a": 0, "w": "Wireless HAN is flexible."}, {"q": "A smart home integrates:", "o": ["Only fans", "Household devices and services for automation, security, safety, media, communication and remote access/control", "Only doors", "Only lights"], "a": 1, "w": "This is the definition."}]}, {"title": "11. HAN standards", "summary": "UPnP: application-layer/web-based discovery, zero configuration. DLNA: domestic media sharing. KNX: multiple media/technologies for home and building automation. LonWorks: associated with the Neuron chip. ZigBee: four layers; IEEE 802.15.4 provides PHY and MAC; ZigBee provides network and application layers. X-10: low-speed power-line control.", "qs": [{"q": "UPnP is associated with:", "o": ["Power-line", "Neuron chip", "Application-layer/web-based discovery and zero configuration", "Media sharing"], "a": 2, "w": "UPnP = discovery/zero-config."}, {"q": "DLNA is associated with:", "o": ["Neuron chip", "Power-line control", "Zero configuration", "Domestic media sharing"], "a": 3, "w": "DLNA = media sharing."}, {"q": "KNX is associated with:", "o": ["Power-line only", "Neuron chip", "Media sharing", "Multiple media/technologies for home and building automation"], "a": 3, "w": "KNX supports multiple media."}, {"q": "LonWorks is associated with:", "o": ["UPnP", "X-10", "The Neuron chip", "DLNA"], "a": 2, "w": "LonWorks ↔ Neuron chip."}, {"q": "X-10 is:", "o": ["Low-speed power-line control", "Media sharing", "Wireless audio", "High-speed fibre"], "a": 0, "w": "X-10 uses power lines at low speed."}, {"q": "In the ZigBee HAN stack, IEEE 802.15.4 provides:", "o": ["Only security", "Network and application layers", "PHY and MAC", "Only application"], "a": 2, "w": "ZigBee supplies network and application layers."}, {"q": "Exam trap: UPnP versus DLNA.", "o": ["UPnP = discovery/zero-config; DLNA = media", "Both = media", "Both = power-line", "UPnP = media; DLNA = discovery"], "a": 0, "w": "This is the stated distinction."}]}, {"title": "12. HAN architectures and initiatives", "summary": "DomoNet: central gateway, XML/web services, service-oriented architecture (SOA). Jini: Java/JVM-based distributed resource sharing, without a central node. HYDRA: middleware with device client/proxy. Amigo: ambient intelligence, interoperability, user-friendly interfaces and discovery.", "qs": [{"q": "DomoNet uses:", "o": ["A central gateway with XML/web services and SOA", "Ambient intelligence", "Neuron chip", "Java/JVM without a central node"], "a": 0, "w": "DomoNet = central gateway/SOA."}, {"q": "Jini is:", "o": ["Power-line", "XML only", "Central gateway", "Java/JVM-based distributed resource sharing, described as having no central node"], "a": 3, "w": "Jini = distributed Java architecture."}, {"q": "HYDRA is:", "o": ["Middleware with device client/proxy", "Neuron chip", "SOA", "Media sharing"], "a": 0, "w": "HYDRA = middleware with device client/proxy."}, {"q": "Amigo focuses on:", "o": ["Central gateway", "Power lines", "Neuron chips", "Ambient intelligence, interoperability, user-friendly interfaces and discovery"], "a": 3, "w": "These are Amigo's stated aims."}, {"q": "Exam trap: DomoNet versus Jini.", "o": ["Both = central gateway", "DomoNet = central gateway/SOA; Jini = Java/JVM distributed architecture", "DomoNet = Java/JVM distributed; Jini = central gateway/SOA", "Both = JVM"], "a": 1, "w": "This is the stated distinction."}]}, {"title": "13. Connected vehicles: communication types and vehicular cloud", "summary": "A stand-alone vehicle has sensors and embedded systems; a connected vehicle also exchanges information with other devices, vehicles, infrastructure or people. In-vehicle: devices within one vehicle; V2V: vehicle-to-vehicle; V2I: vehicle-to-infrastructure (e.g. roadside unit); V2P: vehicle-to-pedestrian/person. The vehicular cloud shares data with stakeholders.", "qs": [{"q": "V2V stands for:", "o": ["Vision-to-Vehicle", "Value-to-Vehicle", "Vehicle-to-Voice", "Vehicle-to-Vehicle"], "a": 3, "w": "V2V = vehicle-to-vehicle."}, {"q": "V2I refers to:", "o": ["Vehicle-to-Item", "Vehicle-to-Input", "Vehicle-to-Infrastructure (e.g. a roadside unit)", "Vehicle-to-Internet only"], "a": 2, "w": "V2I = vehicle-to-infrastructure."}, {"q": "V2P refers to:", "o": ["Vehicle-to-Port", "Vehicle-to-Power", "Vehicle-to-Protocol", "Vehicle-to-Pedestrian/person"], "a": 3, "w": "V2P = pedestrian/person."}, {"q": "In-vehicle communication is:", "o": ["Between vehicles", "With infrastructure", "Communication among devices within one vehicle", "With pedestrians"], "a": 2, "w": "In-vehicle = inside a single vehicle."}, {"q": "A connected vehicle differs from a stand-alone vehicle because it:", "o": ["Has no sensors", "Exchanges information with other devices, vehicles, infrastructure or people", "Has no embedded systems", "Cannot move"], "a": 1, "w": "Connectivity is the difference."}, {"q": "Which is a vehicular-cloud stakeholder named in the course?", "o": ["Law enforcement", "Automobile companies", "Cloud-service providers", "All of the above"], "a": 3, "w": "Academia, law enforcement, automobile companies, government, standardization groups and cloud providers are listed."}]}, {"title": "14. Connected-vehicle challenges and VANETs", "summary": "Challenges: security, privacy, scalability, reliability/QoS, global standards/interoperability. A VANET (Vehicular Ad-hoc Network) supports communication among vehicles and related roadside/network entities. Properties: highly dynamic topology, appearing/disappearing links, road-constrained mobility, large and changing numbers of vehicles, powerful vehicle devices but unstable links.", "qs": [{"q": "VANET stands for:", "o": ["Vehicle Access Node", "Visual Ad-hoc Net", "Vehicular Ad-hoc Network", "Variable Area Network"], "a": 2, "w": "VANET = Vehicular Ad-hoc Network."}, {"q": "A key VANET property is:", "o": ["Static topology", "Only wired links", "Highly dynamic topology because vehicles move", "No mobility"], "a": 2, "w": "Moving vehicles change the topology."}, {"q": "Mobility in VANETs is:", "o": ["Absent", "Constrained by roads", "Unconstrained", "Random in all directions"], "a": 1, "w": "Mobility is constrained by roads."}, {"q": "The privacy challenge in connected vehicles arises because:", "o": ["Roads are public", "There is no data", "Vehicles are silent", "Movement/location data can be exposed"], "a": 3, "w": "Location data exposure threatens privacy."}, {"q": "The security challenge in connected vehicles is that:", "o": ["There is no wireless", "Wireless messages may be attacked or altered", "No sensors", "Messages are perfect"], "a": 1, "w": "This is the stated security issue."}, {"q": "The scalability challenge arises because:", "o": ["Topology is fixed", "There are few vehicles", "Vehicles never move", "Vehicles continually enter/leave areas and traffic loads change"], "a": 3, "w": "Dynamic vehicle populations stress scalability."}]}, {"title": "15. Content-Centric Networking (CCN)", "summary": "CCN is a content-oriented alternative to endpoint/location-oriented communication; content is requested by a unique content name. FIB (Forwarding Information Base) forwards by content-name prefixes; CS (Content Store) caches content chunks. In VANET + CCN, caching helps dissemination but dynamic topology and unstable links remain challenges.", "qs": [{"q": "In CCN, content is requested by:", "o": ["Port number", "A unique content name", "IP address", "MAC address"], "a": 1, "w": "CCN is content-oriented."}, {"q": "FIB stands for:", "o": ["Forwarding Information Base", "File Interchange Block", "Fixed Interface Buffer", "Fast Internet Backbone"], "a": 0, "w": "FIB = Forwarding Information Base."}, {"q": "The FIB:", "o": ["Encrypts data", "Caches content", "Supports forwarding based on content-name prefixes", "Stores sensors"], "a": 2, "w": "FIB forwards using name prefixes."}, {"q": "The Content Store (CS):", "o": ["Encrypts traffic", "Names content", "Caches content chunks/data", "Forwards by prefix"], "a": 2, "w": "CS = cache."}, {"q": "Exam trap: FIB versus CS.", "o": ["Both cache", "FIB forwards; CS caches", "Both forward", "FIB caches; CS forwards"], "a": 1, "w": "The notes say FIB forwards; Content Store caches."}]}, {"title": "16. Connected-vehicle body-and-brain architecture", "summary": "Three layers in order: (1) Sense/execution layer — senses the environment and performs actions; (2) Network/transmission layer — communication bridge between sensing/execution and decision-making; (3) Decision layer — processes information and selects decisions/actions.", "qs": [{"q": "The first layer of the body-and-brain architecture is:", "o": ["Decision layer", "Sense/execution layer", "Application layer", "Network/transmission layer"], "a": 1, "w": "Order: sense/execution → network/transmission → decision."}, {"q": "The network/transmission layer is:", "o": ["Where sensing occurs", "Where decisions are made", "The communication bridge between sensing/execution and decision-making", "Where actions are executed"], "a": 2, "w": "It links the body (sensing/execution) with the brain (decision)."}, {"q": "The decision layer:", "o": ["Executes only", "Transmits only", "Senses", "Processes information and selects decisions/actions"], "a": 3, "w": "It is the \"brain\"."}]}, {"title": "17. Intelligent Connected Vehicles (ICVs)", "summary": "An ICV combines vehicle connectivity with intelligent processing and safety/transport applications. Course-slide facts: 75 MHz spectrum at 5850–5925 MHz, DSRC, IEEE 802.11p, IEEE 1609 family, SAE J2735/J2945 (not verified current regulatory guidance). IEEE 1609.4 is associated with WAVE multichannel operations. Phase 1: 2G/3G, infotainment, remote processing; Phase 2: 4G LTE/DSRC and ITS; Phase 3: cloud-connected vehicles.", "qs": [{"q": "The ICV spectrum allocation mentioned in const TOTAL = 709;
const KEY = "iot-mcq-progress-v1";
let prog = {};           // "w.t.q" -> chosen index
try { prog = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(prog)); } catch (e) {} }

const weekSel = document.getElementById("week"), out = document.getElementById("out"),
      search = document.getElementById("search"), stats = document.getElementById("stats"),
      toggleBtn = document.getElementById("toggle");
weekSel.innerHTML = '<option value="all">All weeks</option>' +
  DATA.map((w,i)=>`<option value="${i}">${esc(w.title.split(" — ")[0])} — ${esc(w.title.split(" — ")[1]||"")}</option>`).join("");
let showAll = false;

function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function render(){
  const wsel = weekSel.value, term = search.value.trim().toLowerCase();
  let html = "", shown = 0;
  DATA.forEach((w,wi)=>{
    if (wsel !== "all" && +wsel !== wi) return;
    let wh = "", n = 0;
    w.topics.forEach((t,ti)=>{
      let th = "";
      t.qs.forEach((q,qi)=>{
        if (term && !(q.q+" "+q.o.join(" ")+" "+t.title).toLowerCase().includes(term)) return;
        n++; shown++;
        const id = wi+"."+ti+"."+qi, ch = prog[id], done = ch !== undefined;
        th += `<div class="q${done?" done":""}" data-id="${id}"><p>Q${n}. ${esc(q.q)}</p>` +
          q.o.map((o,oi)=>{
            let cls = "";
            if (done || showAll){ if (oi===q.a) cls=" right"; else if (done && oi===ch) cls=" wrong"; }
            return `<button class="opt${cls}" data-o="${oi}"><b>${"ABCD"[oi]}.</b><span>${esc(o)}</span></button>`;
          }).join("") +
          `<div class="ans"><b>Correct Answer: ${"ABCD"[q.a]}</b> | <i>Reason: ${esc(q.w)}</i></div></div>`;
      });
      if (th) wh += `<h3>${esc(t.title)}</h3><div class="idea"><b>Key idea:</b> ${esc(t.summary)}</div>` + th;
    });
    if (wh) html += `<h2>${esc(w.title)}</h2>` + wh;
  });
  out.innerHTML = html || '<div class="empty">No questions match.</div>';
  out.classList.toggle("show", showAll);
  updateStats(shown);
}

function updateStats(shown){
  let attempted = 0, correct = 0;
  DATA.forEach((w,wi)=>w.topics.forEach((t,ti)=>t.qs.forEach((q,qi)=>{
    const c = prog[wi+"."+ti+"."+qi]; if (c!==undefined){ attempted++; if (c===q.a) correct++; }
  })));
  stats.textContent = `${shown} questions shown of ${TOTAL} | Attempted ${attempted} | Correct ${correct}` +
    (attempted ? ` (${Math.round(100*correct/attempted)}%)` : "");
}

out.addEventListener("click", e=>{
  const b = e.target.closest(".opt"); if (!b) return;
  const card = b.closest(".q"), id = card.dataset.id;
  if (prog[id] !== undefined) return;
  prog[id] = +b.dataset.o; save();
  const [wi,ti,qi] = id.split(".").map(Number), q = DATA[wi].topics[ti].qs[qi];
  card.classList.add("done");
  card.querySelectorAll(".opt").forEach((el,i)=>{
    if (i===q.a) el.classList.add("right"); else if (i===prog[id]) el.classList.add("wrong");
  });
  updateStats(document.querySelectorAll(".q").length);
});
weekSel.addEventListener("change", render);
search.addEventListener("input", render);
toggleBtn.addEventListener("click", ()=>{ showAll=!showAll; toggleBtn.textContent = showAll?"Hide unanswered answers":"Show all answers"; render(); });
document.getElementById("reset").addEventListener("click", ()=>{
  if (confirm("Clear your saved answers?")){ prog = {}; save(); render(); }
});
render();
</script>
</body>
