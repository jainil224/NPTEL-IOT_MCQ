<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IoT (NPTEL) Study Guide</title>
<style>
:root{--bg:#fff;--fg:#111;--mut:#5f6368;--line:#dadce0;--card:#f6f7f9;--ok:#137333;--okbg:#e6f4ea;--bad:#b3261e;--badbg:#fce8e6;--acc:#111;--acc2:#1a73e8;--warn:#8a5a00;--warnbg:#fff7e0;--notebg:#eef4ff}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--fg:#eee;--mut:#a0a4a8;--line:#333;--card:#1c1c1e;--ok:#81c995;--okbg:#14301d;--bad:#f28b82;--badbg:#3a1b19;--acc:#eee;--acc2:#8ab4f8;--warn:#fdd663;--warnbg:#2d2717;--notebg:#17202f}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
body > header{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:10px 20px;box-shadow:0 4px 20px -2px rgba(0,0,0,.04);transition:background .2s}
@media (prefers-color-scheme:dark){body > header{background:rgba(18,18,18,.86);box-shadow:0 4px 20px -2px rgba(0,0,0,.4)}}
.nptel-theory-card{border:1px solid var(--line);border-radius:12px;margin:0 0 16px;background:var(--bg);overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.nptel-theory-head{position:static;z-index:auto;padding:12px 18px;background:var(--card);border-bottom:1px solid var(--line);box-shadow:none}
.nptel-theory-head h3{margin:4px 0 0;font-size:1.05rem;line-height:1.4}
.nptel-theory-body{padding:16px 18px}
.nptel-theory-body h4{font-size:.92rem;text-transform:uppercase;letter-spacing:.04em;margin:12px 0 4px;color:var(--mut)}
.nptel-theory-body p{margin:0 0 12px;font-size:.95rem;line-height:1.6}
.nptel-theory-actions{margin-top:14px;border-top:1px solid var(--line);padding-top:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end}
.nptel-btn-practice{background:var(--acc2)!important;color:#fff!important;border-color:var(--acc2)!important;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:all .15s ease}
.nptel-btn-practice:hover{opacity:.92;transform:translateY(-1px);box-shadow:0 4px 12px rgba(26,115,232,.25)}
.toolbar{margin:0 0 14px}
.nptel-read-theory{font-size:.82rem;padding:3px 8px;border:1px solid var(--acc2);background:transparent;color:var(--acc2);border-radius:6px;cursor:pointer}
.nptel-read-theory:hover{background:var(--card)}
.theory-highlight{background:var(--warnbg)!important;border-radius:4px;padding:2px 4px}
.q-target-pulse{box-shadow:0 0 0 3px var(--acc2)!important;animation:pulseBorder 1.5s ease-out}
@keyframes pulseBorder{0%{box-shadow:0 0 0 4px var(--acc2)}70%{box-shadow:0 0 0 1px var(--acc2)}100%{box-shadow:none}}
.bar{max-width:1120px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
h1{font-size:1.08rem;font-weight:750;letter-spacing:-.015em;margin:0 auto 0 0;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
select,input[type=search],button{font:inherit;font-size:.88rem;padding:7px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--fg);transition:border-color .15s,box-shadow .15s,background .15s}
select{cursor:pointer;padding-right:24px}
button{cursor:pointer}button:hover{background:var(--card)}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
input[type=search]{min-width:180px;flex:1}
main{max-width:1120px;margin:0 auto;padding:20px;scroll-padding-top:150px}
.nwt-card,.nptel-theory-card,.q,.chapter,.week-card,.hero{scroll-margin-top:150px}
.theory-highlight{background:linear-gradient(transparent 62%,rgba(255,214,10,.32) 62%);border-left:3px solid #f5b700;padding:6px 10px;border-radius:6px;display:block;margin:8px 0;box-shadow:inset 0 0 0 1px rgba(245,183,0,.25);transition:background .3s ease}
@media (prefers-color-scheme:dark){.theory-highlight{background:linear-gradient(transparent 62%,rgba(255,214,10,.18) 62%);border-left-color:#f5b700;box-shadow:inset 0 0 0 1px rgba(245,183,0,.35)}}
.stats{color:var(--mut);font-size:.88rem;margin:2px 0 14px}
h2{font-size:1.35rem;margin:8px 0 6px;border-bottom:2px solid var(--fg);padding-bottom:5px}
h3{font-size:1.05rem;margin:24px 0 6px}
.tabs,.segmented-tabs{display:inline-flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.tab{border:0;border-radius:7px;padding:6px 14px;background:transparent;color:var(--mut);font-weight:550;font-size:.87rem;transition:all .16s ease}
.tab:hover{color:var(--fg);background:rgba(128,128,128,.08)}
.tab[aria-selected=true]{background:var(--bg);color:var(--fg);font-weight:650;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.subtabs-pill{display:inline-flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.subtabs-pill .tab[aria-selected=true]{background:var(--acc2);color:#fff;font-weight:650;box-shadow:0 2px 6px rgba(26,115,232,.3)}
.primary{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:650}
.primary:hover{background:var(--fg);opacity:.9}
.ghost{background:transparent}
.idea{border-left:3px solid var(--line);padding:4px 10px;color:var(--mut);font-style:italic;font-size:.88rem;margin-bottom:12px}
.hero{border:1px solid var(--line);border-radius:14px;padding:18px 18px 14px;margin:4px 0 16px;background:linear-gradient(180deg,var(--card),var(--bg))}
.hero h2{border:0;padding:0;margin:0 0 6px;font-size:1.5rem;line-height:1.25}
.hero .sub{color:var(--mut);font-size:.9rem;margin:0 0 10px}
.hero p{margin:0 0 12px}
.hero-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:.8rem;color:var(--mut);background:var(--bg);margin:2px 3px 2px 0}
.progress{font-size:.82rem;color:var(--mut);min-width:140px}
.pbar{height:6px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:5px}
.pbar > i{display:block;height:100%;background:var(--acc2);border-radius:999px}
.highlights{border:1px solid var(--line);border-left:5px solid var(--acc2);border-radius:10px;padding:12px 16px;margin:0 0 18px;background:var(--card)}
.highlights h3{margin:0 0 8px;font-size:1rem}
.highlights ul{margin:0;padding-left:20px}
.highlights li{margin:4px 0;font-size:.93rem}
.chapter{border:1px solid var(--line);border-radius:11px;margin:0 0 10px;background:var(--bg);overflow:hidden}
.chapter[open]{box-shadow:0 1px 4px rgba(0,0,0,.06)}
.chapter summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;gap:10px;align-items:center;background:var(--card)}
.chapter summary::-webkit-details-marker{display:none}
.chapter summary::before{content:"▸";color:var(--mut);transition:transform .15s;flex:0 0 auto}
.chapter[open] summary::before{transform:rotate(90deg)}
.chapter .ch-title{font-weight:700;flex:1;line-height:1.3}
.chapter .ch-meta{font-size:.76rem;color:var(--mut);white-space:nowrap}
.chapter.is-read .ch-title{color:var(--ok)}
.chapter-body{padding:2px 16px 14px}
.terms{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0 4px}
.term{font-size:.77rem;border:1px solid var(--line);border-radius:999px;padding:2px 8px;background:var(--card);color:var(--mut)}
.theory{font-size:.96rem}
.theory h3{font-size:1.02rem;margin:20px 0 5px;color:var(--fg)}
.theory h4{font-size:.96rem;margin:16px 0 4px}
.theory p{margin:0 0 10px}
.theory ul,.theory ol{margin:0 0 10px;padding-left:22px}
.theory li{margin:3px 0}
.theory strong{background:linear-gradient(transparent 58%,var(--warnbg) 58%);padding:0 1px;border-radius:2px}
.theory code{font-size:.88em;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:1px 4px}
.theory pre:not(.ascii-table){background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;font-size:.82rem}
.table-wrap{overflow-x:auto;margin:0 0 12px}
.theory table{border-collapse:collapse;font-size:.85rem;min-width:420px}
.theory th,.theory td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
.theory th{background:var(--card)}
.ascii-table{white-space:pre;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;font:12px/1.45 ui-monospace,SFMono-Regular,Consolas,Monaco,monospace;color:var(--fg);max-height:420px;margin:0 0 12px}
.callout{border-radius:8px;padding:9px 12px;margin:10px 0 12px;font-size:.9rem;border:1px solid var(--line)}
.callout.tip{background:var(--warnbg);border-left:4px solid var(--warn)}
.callout.note{background:var(--notebg);border-left:4px solid var(--acc2)}
.callout strong{background:none}
.soft-rule{border:0;border-top:1px dashed var(--line);margin:14px 0}
.read-btn{font-size:.82rem;padding:4px 10px;margin-top:10px}
.read-btn.is-read{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.chapter-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.cta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:20px 0;background:var(--card)}
.cta strong{font-size:1rem}
.cta p{margin:3px 0 0;color:var(--mut);font-size:.88rem}
.week-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin:14px 0}
.week-card{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--card);display:flex;flex-direction:column;gap:7px}
.week-card h3{margin:0;font-size:1rem;border:0;padding:0}
.week-card p{margin:0;font-size:.86rem;color:var(--mut)}
.week-card .wk-num{font-size:.75rem;color:var(--acc2);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.week-card .pbar{margin-top:0}
.week-card .row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:auto}
.theory-link{border:0;background:none;color:var(--acc2);padding:0;font-size:.82rem;text-align:left;font-weight:600}
.theory-link:hover{text-decoration:underline;background:none}
.topic-head{display:flex;gap:10px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.topic-head h3{margin:20px 0 6px}
.week-head{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-bottom:2px solid var(--fg);margin:22px 0 4px}
.week-head h2{border:0;margin:0 0 4px;padding:0}
.q{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 12px;background:var(--bg)}
.q p{font-weight:700;margin:0 0 8px}
.opt{display:flex;gap:8px;width:100%;text-align:left;margin:4px 0;padding:7px 10px;font-size:.93rem;border-radius:8px}
.opt b{min-width:1.3em}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.ans{display:none;margin-top:8px;padding:8px 10px;background:var(--card);border-left:3px solid var(--fg);border-radius:4px;font-size:.88rem}
.q.done .ans,.show .ans{display:block}
.multi-badge{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--notebg);color:var(--acc2);border:1px solid rgba(26,115,232,.3);letter-spacing:.02em;text-transform:uppercase}
.opt-box{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border:1.5px solid var(--line);border-radius:4px;margin-right:2px;font-size:12px;color:transparent;transition:all .15s ease;flex-shrink:0}
.opt.selected .opt-box{background:var(--acc2);border-color:var(--acc2);color:#fff}
.opt.selected{background:var(--card);border-color:var(--acc2)}
.msq-submit-row{margin-top:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.msq-submit-btn{background:var(--acc2);color:#fff;border:none;font-weight:600;font-size:.85rem;padding:6px 16px;border-radius:7px;cursor:pointer;transition:all .15s ease}
.msq-submit-btn:hover:not(:disabled){opacity:.9;box-shadow:0 2px 8px rgba(26,115,232,.35)}
.msq-submit-btn:disabled{opacity:.45;cursor:not-allowed}
.msq-hint{font-size:.82rem;color:var(--mut)}
.empty{color:var(--mut);padding:30px 0;text-align:center}
.muted{color:var(--mut)}
@media (max-width: 680px){
  body > header{padding:8px 10px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
  main{padding:10px 8px}
  .bar{display:grid;grid-template-columns:1fr auto;gap:6px 6px;align-items:center}
  h1{grid-column:1 / 2;font-size:.96rem;margin:0;line-height:1.2}
  #reset{grid-column:2 / 3;padding:4px 8px;font-size:.78rem;height:28px}
  #toggle{grid-column:1 / -1;padding:5px 8px;font-size:.8rem}
  .tabs{grid-column:1 / -1;width:100%;display:flex;padding:2px;gap:2px}
  .tabs .tab{flex:1;text-align:center;padding:5px 6px;font-size:.78rem;white-space:nowrap}
  #week,#nptel-week{grid-column:1 / -1;width:100%;padding:6px 8px;font-size:.82rem}
  #nptel-subtabs{grid-column:1 / -1;width:100%;display:flex!important;padding:2px;gap:2px}
  #nptel-subtabs[style*="display: none"],#nptel-subtabs[style*="display:none"]{display:none!important}
  #nptel-subtabs .tab{flex:1;text-align:center;padding:5px 4px;font-size:.78rem;white-space:nowrap}
  #search{grid-column:1 / -1;width:100%;padding:6px 10px;font-size:.84rem}
  .hero{padding:12px;border-radius:10px;margin-bottom:12px}
  .hero h2{font-size:1.15rem}
  .hero-row{flex-direction:column;align-items:flex-start}
  .nptel-theory-card{border-radius:10px;margin-bottom:12px}
  .nptel-theory-head{padding:10px 12px}
  .nptel-theory-head h3{font-size:.95rem}
  .nptel-theory-body{padding:10px 12px}
  .nptel-theory-body p{font-size:.88rem;line-height:1.55}
  .nptel-theory-actions{flex-direction:column;align-items:stretch;gap:6px}
  .nptel-theory-actions button{width:100%;text-align:center;justify-content:center;padding:8px 10px;font-size:.84rem}
  .topic-head{flex-direction:column;align-items:flex-start;gap:6px}
  .topic-head p{font-size:.92rem}
  .opt{padding:8px 10px;font-size:.87rem}
  .chapter summary{padding:10px 12px;font-size:.9rem}
  .chapter-body{padding:2px 12px 12px}
  .stats{font-size:.8rem;margin-bottom:8px}
}
@media print{
  body > header,.cta,.read-btn,.tabs,.chapter-actions,.theory-link{display:none!important}
  body{font-size:11pt}
  main{max-width:none;padding:0}
  .chapter{border:0;break-inside:avoid}
  .chapter summary{background:none;padding:0}
  .chapter summary::before{display:none}
  .chapter-body{display:block!important;padding:0 0 14px}
  .ascii-table{max-height:none;white-space:pre-wrap}
  .highlights{break-inside:avoid}
  a{color:inherit;text-decoration:none}
}
</style>
</head>
<body>
<header><div class="bar">
<h1>IoT (NPTEL) Study Guide</h1>
<div class="tabs" role="tablist" aria-label="Study mode">
<button class="tab" id="tab-theory" role="tab" aria-selected="true" data-mode="theory">Theory</button>
<button class="tab" id="tab-mcq" role="tab" aria-selected="false" data-mode="mcq">MCQs</button>
<button class="tab" id="tab-nptel" role="tab" aria-selected="false" data-mode="nptel">NPTEL Week Assessment</button>
</div>
<select id="week" aria-label="Week"></select>
<select id="nptel-week" aria-label="NPTEL Week" style="display:none"></select>
<div id="nptel-subtabs" class="subtabs-pill" style="display:none">
  <button class="tab" id="nptel-sub-theory" data-nptel-view="theory">NPTEL Theory</button>
  <button class="tab" id="nptel-sub-practice" data-nptel-view="practice">NPTEL MCQ Practice</button>
</div>
<input id="search" type="search" placeholder="Search theory…" aria-label="Search">
<button id="toggle" hidden>Show all answers</button>
<button id="reset">Reset</button>
</div></header>
<main>
<div class="stats" id="stats"></div>
<div id="out"></div>
</main>
<script>
const DATA = [{"title":"WEEK 1 — Introduction to IoT","topics":[{"title":"1. What is IoT?","summary":"The Internet of Things (IoT) is an internetwork of physical objects (\"things\") equipped with embedded electronics, sensing or actuation capability, processing, and communication. It extends connectivity from computers to objects such as lights, fans, machines, meters and vehicles.","qs":[{"q":"The Internet of Things is best described as:","o":["A single wireless protocol for sensors","An internetwork of physical objects with embedded electronics, sensing/actuation, processing and communication","A network made only of user-operated computers","A cloud storage service"],"a":1,"w":"The notes define IoT as an internetwork of physical \"things\" with embedded electronics, sensing or actuation, processing and communication."},{"q":"How does IoT extend the conventional Internet?","o":["By connecting objects such as lights, fans, machines, meters and vehicles, not just computers","By connecting only mobile phones","By replacing IP addressing with proprietary addressing","By removing the need for networks"],"a":0,"w":"The conventional Internet mainly connected computers and user-operated devices; IoT extends connectivity to everyday and industrial objects."},{"q":"In the temperature-sensor example, which element carries the reading from the controller to the application?","o":["The network","The transducer","The fan","The actuator"],"a":0,"w":"The sensor measures, a controller processes, a network carries the reading to an application, and a command can then switch on a fan or air conditioner."}]},{"title":"2. Why is IoT useful?","summary":"IoT supports monitoring, automation, coordination, operational insight, convenience and resource management.","qs":[{"q":"Which benefit means triggering an action automatically when a condition is met?","o":["Automation","Convenience","Monitoring","Coordination"],"a":0,"w":"The notes define automation as triggering an action when a condition is met."},{"q":"Analysing readings over time to identify trends or abnormal behaviour is called:","o":["Resource management","Monitoring","Operational insight","Coordination"],"a":2,"w":"Operational insight = analysing readings over time to spot trends or abnormal behaviour."},{"q":"Allowing multiple devices to share information and work together is:","o":["Automation","Convenience","Monitoring","Coordination"],"a":3,"w":"Coordination is listed as allowing multiple devices to share information and work together."},{"q":"Observing equipment or environmental conditions remotely is classified as:","o":["Coordination","Monitoring","Automation","Resource management"],"a":1,"w":"Monitoring is remote observation of equipment or environmental conditions."},{"q":"Supporting more informed use of energy, water and equipment is the benefit named:","o":["Coordination","Resource management","Convenience","Automation"],"a":1,"w":"Resource management supports more informed use of energy, water and equipment."}]},{"title":"3. Embedded systems","summary":"An embedded system is a computing system integrated into a larger product to perform a defined function, often with limited processing power, memory and energy compared with a general-purpose computer.","qs":[{"q":"An embedded system is best defined as:","o":["A general-purpose desktop computer","A cloud server farm","A wireless access point","A computing system integrated into a larger product to perform a defined function"],"a":3,"w":"The notes define it as a computing system built into a larger product for a defined function."},{"q":"Compared with a general-purpose computer, an embedded system often has:","o":["Limited processing power, memory and energy","No ability to communicate","Greater processing power","Unlimited memory"],"a":0,"w":"Embedded systems often have limited processing power, memory and energy."},{"q":"Which of the following is NOT listed as a function of embedded systems in IoT?","o":["Applying simple decision logic","Controlling actuators","Allocating global IPv6 prefixes to Internet service providers","Reading sensor values"],"a":2,"w":"The listed functions are: read sensor values, process measurements, apply simple decision logic, communicate data and control actuators."},{"q":"A sensor alone only measures a physical condition. What makes the measurement available to other systems?","o":["Networking","Resolution","Drift","Calibration"],"a":0,"w":"Embedded logic interprets the measurement and networking makes it available to other systems."}]},{"title":"4. Examples of IoT","summary":"IoT appears in smart homes, agriculture, industry, buildings/cities and inventory management.","qs":[{"q":"A soil/field sensor supporting irrigation decisions is an example from which area?","o":["Agriculture","Inventory","Industry","Smart home"],"a":0,"w":"The notes list soil/field sensors for irrigation decisions under agriculture."},{"q":"RFID tags and readers used to identify and track items belong to which area?","o":["Inventory","Smart home","Agriculture","Buildings/cities"],"a":0,"w":"RFID tags and readers are the inventory example (identify and track items)."},{"q":"Machine sensors used for equipment monitoring and maintenance are an example of:","o":["Smart home","Industry","Agriculture","Inventory"],"a":1,"w":"Machine sensors for monitoring and maintenance are the industry example."},{"q":"A connected light or thermostat with automatic control is an example of:","o":["Inventory","Smart home","Industry","Agriculture"],"a":1,"w":"Connected lights/thermostats are the smart-home example."}]},{"title":"5. IoT as a convergence of technologies","summary":"IoT is not one technology; a system may combine embedded systems, sensors and actuators, networking, cloud, data analytics, machine learning, electrical/mechanical engineering and energy harvesting.","qs":[{"q":"Which statement about IoT technology is correct?","o":["IoT requires only wired networking","IoT excludes cloud computing","IoT is a convergence of several technologies","IoT is a single technology based on one protocol"],"a":2,"w":"The notes state IoT is not one single technology; a system may combine many."},{"q":"Which combination is listed as part of the IoT technology mix?","o":["Only wireless links","Only machine-learning models","Sensors/actuators, cloud and backend services, and data analytics","Only microcontrollers"],"a":2,"w":"The convergence list includes sensors and actuators, cloud computing and backend services, and data storage and analytics, among others."},{"q":"Energy harvesting in IoT is mentioned as being used:","o":["Only for wired devices","In suitable deployments","In every deployment without exception","Never"],"a":1,"w":"The notes list \"energy harvesting in suitable deployments\"."}]},{"title":"6. Communication technologies mentioned in Week 1","summary":"Wi-Fi, cellular, Bluetooth/BLE, Ethernet, IEEE 802.15.4, ZigBee, DASH7 and Insteon are among the connectivity options; the best choice depends on range, bandwidth, energy, cost, environment and connectivity requirements.","qs":[{"q":"IEEE 802.15.4 is described as the foundation for:","o":["Low-rate wireless personal-area networking","High-speed wired LANs","Satellite links","Cellular voice"],"a":0,"w":"The notes call it the low-rate wireless personal-area networking foundation."},{"q":"Bluetooth Low Energy (BLE) is designed for:","o":["Low-energy use cases","High-power broadcasting","Long-range cellular coverage","Wired networking"],"a":0,"w":"BLE is the short-range wireless option designed for low-energy use cases."},{"q":"Which technology is described as wired networking?","o":["Ethernet","BLE","Cellular","Wi-Fi"],"a":0,"w":"Ethernet is the wired networking technology in the list."},{"q":"Which set contains examples of \"other approaches\" mentioned in the course material?","o":["HTTP, FTP, SMTP","ZigBee, DASH7, Insteon","TCP, UDP, ICMP","MQTT, CoAP, AMQP"],"a":1,"w":"ZigBee, DASH7 and Insteon are named as other connectivity approaches."},{"q":"Selecting an IoT communication technology depends on:","o":["Only the cost","Only the colour of the casing","Range, bandwidth, energy, cost, environment and connectivity requirements","Only the brand of the device"],"a":2,"w":"The notes say no technology is best for all applications; selection depends on these factors."}]},{"title":"7. Origin and scale","summary":"The slides refer to the ITU report \"The Internet of Things\" (2005) and quote historical forecasts of 20 billion, or 20–50 billion, connected devices by 2018.","qs":[{"q":"In which year was the ITU report \"The Internet of Things\" referenced in the slides published?","o":["1999","2005","2013","2018"],"a":1,"w":"The notes refer to the ITU report from 2005."},{"q":"How should the \"20–50 billion devices by 2018\" figures be treated?","o":["As current statistics","As the number of IPv6 addresses","As historical forecasts from the course material","As legally binding targets"],"a":2,"w":"The notes explicitly say to treat them as historical forecasts, not current statistics."}]},{"title":"8. Important terms","summary":"Key terms: IoT node, M2M, RFID, interoperability, backend service, analytics and energy harvesting.","qs":[{"q":"M2M stands for:","o":["Module-to-Module","Multi-to-Multi","Memory-to-Memory","Machine-to-Machine"],"a":3,"w":"M2M is machine-to-machine communication."},{"q":"RFID stands for:","o":["Radio-Frequency Identification","Remote Frequency Identification","Reduced Function Identification Device","Radio-Frequency Interface Device"],"a":0,"w":"RFID = Radio-Frequency Identification; it identifies tagged objects using radio communication."},{"q":"An IoT node is:","o":["A device or endpoint participating in an IoT network","A security policy","A routing protocol","A cloud database"],"a":0,"w":"The notes define a node as a device or endpoint in an IoT network."},{"q":"A backend service is software that:","o":["Only relays radio signals","Only displays dashboards","Receives, stores, processes or analyses data","Only measures temperature"],"a":2,"w":"Backend service = software that receives, stores, processes or analyses data."},{"q":"Energy harvesting means:","o":["Compressing data to save power","Obtaining usable energy from an environmental source","Draining a battery quickly","Turning devices off permanently"],"a":1,"w":"It is defined as obtaining usable energy from an environmental source."},{"q":"Analytics in IoT refers to:","o":["Wiring sensors","Assigning IP addresses","Processing data to find patterns or produce summaries/decision support","Encrypting packets"],"a":2,"w":"Analytics = processing data for patterns, summaries or decision support."}]},{"title":"9. Address crunch","summary":"The address crunch is the challenge of supporting a very large number of connected devices with unambiguous, scalable addressing. IPv4 has a smaller address space than IPv6, which uses 128-bit addresses.","qs":[{"q":"The \"address crunch\" refers to:","o":["A shortage of battery capacity","The cost of cloud storage","The challenge of supporting a huge number of devices with unambiguous, scalable addressing","A fault in Ethernet cables"],"a":2,"w":"The notes define it as the addressing challenge created by IoT scale."},{"q":"The length of an IPv6 address is:","o":["32 bits","48 bits","64 bits","128 bits"],"a":3,"w":"IPv6 uses 128-bit addresses."},{"q":"Which is NOT a reason IoT scale makes addressing difficult?","o":["Huge number of endpoints","Identifiers may be local or meaningful across networks","Devices connect intermittently or sleep","All devices have identical capabilities and standards"],"a":3,"w":"Devices have different capabilities and standards, which is part of the difficulty."},{"q":"Compared with IPv6, IPv4 has:","o":["An identical address space","A larger address space","A smaller address space","No address space"],"a":2,"w":"IPv4 has a smaller address space than IPv6."}]},{"title":"10. Connectivity diversity","summary":"Devices differ in communication needs (a sensor sending a few bytes versus a camera sending large data), so designers must pick suitable technologies and make them work together.","qs":[{"q":"Why must IoT designers choose different connectivity technologies for different devices?","o":["Because a camera and a small sensor have very different communication requirements","Because Ethernet is wireless","Because Wi-Fi cannot carry data","Because all devices send identical data volumes"],"a":0,"w":"A sensor sending a few bytes differs from a camera sending large amounts of data."},{"q":"Cellular connectivity in the course provides:","o":["Low-rate WPAN foundation","Connectivity through cellular coverage","Wired networking","Serial emulation"],"a":1,"w":"Cellular is described as connectivity through cellular coverage."},{"q":"Wi-Fi's general role in the course is:","o":["Wireless local connectivity","Low-energy PAN only","Passive identification","Wired local networking"],"a":0,"w":"Wi-Fi = wireless local connectivity."}]},{"title":"11. IoT LAN, WAN, node, gateway and proxy","summary":"IoT LAN = local network; IoT WAN = wider-area interconnection; node = endpoint; gateway = connects networks and forwards packets (IP layer); proxy = performs active application-layer functions.","qs":[{"q":"An IoT LAN is:","o":["A local network connecting nearby devices (room, building or site)","A cellular tower","A worldwide backbone","A cloud region"],"a":0,"w":"The LAN is the local network connecting nearby devices."},{"q":"An IoT WAN:","o":["Connects only two devices","Connects network segments over a wider geographical or organisational area and may link to the Internet","Is a type of sensor","Is limited to a single room"],"a":1,"w":"The notes define WAN as wider-area interconnection that may connect to the Internet."},{"q":"Which component connects a local IoT LAN to a wider network and forwards packets between networks?","o":["IoT gateway","Sensor","Actuator","IoT proxy"],"a":0,"w":"The gateway is router-like with IP-layer forwarding."},{"q":"Which component performs active application-layer functions between IoT nodes and other entities?","o":["IoT LAN","IoT WAN","IoT gateway","IoT proxy"],"a":3,"w":"The proxy performs application-layer functions."},{"q":"Which statement about gateway versus proxy is correct (exam trap)?","o":["Gateway is application-layer; proxy is IP-layer","They are identical","Both are sensors","Gateway mainly forwards packets between networks; proxy performs application-layer mediation"],"a":3,"w":"In the course model the gateway connects networks/forwards packets while the proxy handles application-layer functions."},{"q":"An IoT node can be:","o":["Only a router","A sensor, actuator or controller endpoint","Only a database","Only a cloud server"],"a":1,"w":"A node is an endpoint such as a sensor, actuator or controller."}]},{"title":"12. Address scope and local address reuse","summary":"An identifier can be unique inside one local network without being globally unique. Local addressing allows reuse in separate scopes while gateways connect to wider networks.","qs":[{"q":"The key question when dealing with addresses is:","o":["Within what scope must this address be unique?","How many sensors does it have?","What colour is the device?","Which vendor made it?"],"a":0,"w":"The notes say the important question is always the scope of uniqueness."},{"q":"An identifier that is unique only within one local network:","o":["Can be reused in a separate network scope","Must be IPv6","Cannot be used at all","Is unique globally by definition"],"a":0,"w":"Local addressing helps reuse identifiers across separate scopes."}]},{"title":"13. Interoperability","summary":"Interoperability is the ability of different components to exchange and correctly interpret information. It can fail even when the network connection works. Semantic interoperability concerns shared meaning.","qs":[{"q":"One device labels a value \"temp\" while another expects \"temperature\". This is an example of:","o":["A physical-layer fault","Interoperability failure even though the connection works","Address crunch","Sensor drift"],"a":1,"w":"Mismatched naming is a semantic/format problem despite a working link."},{"q":"One system reports Celsius while another assumes Fahrenheit. This highlights:","o":["A relay fault","Poor range","Lack of semantic interoperability","Low resolution"],"a":2,"w":"The meaning/units of the information are not understood consistently."},{"q":"Semantic interoperability concerns:","o":["Radio frequency selection","Whether bits are delivered","Battery life","Whether the meaning of exchanged information is understood consistently"],"a":3,"w":"It is about meaning, not merely delivery of bits."},{"q":"Connectivity versus interoperability: which statement is correct?","o":["Connectivity = ability to interpret information; interoperability = ability to exchange bits","Interoperability applies only to wired networks","They mean the same thing","Connectivity = ability to exchange bits; interoperability = ability to interpret and use information correctly"],"a":3,"w":"The comparison table distinguishes exchanging bits from correctly interpreting/using the information."}]},{"title":"14. Sensor, transducer and actuator","summary":"A sensor detects or measures a physical property; a transducer converts one form of energy/signal into another; an actuator moves or controls a mechanism to create a physical effect.","qs":[{"q":"A sensor:","o":["Detects or measures a physical property or state","Routes packets","Stores data","Moves a mechanism"],"a":0,"w":"Sensors measure/detect physical properties or states."},{"q":"A transducer:","o":["Forwards packets between networks","Hosts applications","Assigns addresses","Converts one form of energy or signal into another"],"a":3,"w":"Transducers convert energy/signal forms."},{"q":"An actuator:","o":["Only encrypts traffic","Only stores data","Moves or controls a mechanism to create a physical effect","Only measures temperature"],"a":2,"w":"Actuators perform physical actions."},{"q":"Sensor versus transducer: the terms emphasise:","o":["Analog versus digital only","Measurement versus conversion roles","Local versus global","Wired versus wireless"],"a":1,"w":"A sensor can also be a transducer, but the terms stress measurement vs conversion."}]},{"title":"15. Sensor characteristics","summary":"Accuracy = closeness to true value; precision = repeatability; resolution = smallest detectable change; sensitivity = output change per input change; range = min to max measurable; response time = speed of response; drift = gradual change in output over time; calibration = comparing/adjusting output against a known reference.","qs":[{"q":"Accuracy is:","o":["Speed of response","Agreement among repeated measurements","Smallest detectable change","Closeness of a measurement to the true/reference value"],"a":3,"w":"Accuracy = closeness to the true or reference value."},{"q":"Precision refers to:","o":["Closeness to true value","Gradual change over time","The interval of measurable values","Agreement (repeatability) among repeated measurements"],"a":3,"w":"Precision = repeatability of repeated measurements."},{"q":"Resolution is:","o":["Output change relative to input change","Slow change in output","The smallest detectable or representable change","The minimum-to-maximum interval"],"a":2,"w":"Resolution is the smallest step the sensor can detect/represent."},{"q":"Sensitivity is:","o":["The measurable interval","Smallest representable step","Output change relative to input change","How quickly it responds"],"a":2,"w":"Sensitivity describes the output/input response."},{"q":"The range of a sensor is:","o":["Its repeatability","The interval of values it can measure (minimum to maximum)","Its drift","Its response speed"],"a":1,"w":"Range = min to max measurable values."},{"q":"Response time describes:","o":["The smallest step","Closeness to the truth","The measurable interval","How quickly the sensor responds to a change"],"a":3,"w":"Response time = speed of response to a change."},{"q":"Drift is:","o":["Repeatability of readings","A sudden failure","The sensor's measurable interval","Gradual change in output over time under similar conditions"],"a":3,"w":"Drift is slow change in output over time."},{"q":"Calibration of a sensor means:","o":["Comparing and adjusting its output against a known reference","Increasing its range","Changing its network address","Adding an actuator"],"a":0,"w":"Calibration aligns sensor output with a reference so measurements are correct."},{"q":"Which statement is correct about resolution and accuracy?","o":["Higher resolution automatically means higher accuracy","Higher resolution never matters","Higher resolution does not automatically mean higher accuracy","Resolution and accuracy are the same"],"a":2,"w":"A sensor can show tiny increments yet still be biased away from the true value."}]},{"title":"16. Sensor examples: PIR and ultrasonic","summary":"A PIR (Passive Infrared) sensor detects motion by sensing changes in infrared energy. An ultrasonic sensor estimates distance using sound pulses: Distance = (speed of sound × round-trip time) ÷ 2.","qs":[{"q":"PIR stands for:","o":["Positional Infrared Reader","Power Interface Regulator","Passive Infrared","Programmable Input Relay"],"a":2,"w":"PIR = Passive Infrared."},{"q":"A PIR sensor is commonly used to detect:","o":["Soil moisture","Motion by sensing changes in infrared energy","Humidity","Distance by echo"],"a":1,"w":"PIR detects motion through infrared changes, often from people."},{"q":"An ultrasonic sensor estimates distance using:","o":["Sound pulses and the time taken for the echo to return","Magnetic fields","Infrared heat","Radio-frequency tags"],"a":0,"w":"It measures the echo's round-trip time of sound."},{"q":"In the ultrasonic distance formula, why is the product divided by 2?","o":["Because sound is slower in air","Because the sensor has two eyes","Because measured time covers the outgoing and returning journey","Because of drift"],"a":2,"w":"The round-trip time includes going to the object and back."},{"q":"If the speed of sound is 340 m/s and the echo's round-trip time is 0.01 s, the distance is:","o":["3.4 m","1.7 m","0.34 m","34 m"],"a":1,"w":"Distance = (340 × 0.01) ÷ 2 = 1.7 m."}]},{"title":"17. Measurement example (accuracy vs precision)","summary":"Readings 24.8, 24.9, 24.8 against a reference value of 30.0 are close to each other (good precision) but far from the reference (poor accuracy).","qs":[{"q":"A sensor reports 24.8, 24.9 and 24.8 when the reference value is 30.0. The sensor shows:","o":["Good accuracy, poor precision","Poor accuracy and poor precision","Good accuracy and good precision","Good precision, poor accuracy"],"a":3,"w":"The readings agree with each other (precise) but are far from 30.0 (inaccurate)."},{"q":"In the same example, why is precision considered good?","o":["Readings are close to the reference","The sensor responds fast","Readings are close to each other","The range is large"],"a":2,"w":"Precision is agreement among repeated measurements."}]},{"title":"18. Actuation","summary":"Actuation converts a control decision or signal into physical action. A system typically needs a control signal, an actuator/driver, an energy source and a physical mechanism.","qs":[{"q":"Actuation is:","o":["Converting a control decision or signal into physical action","Assigning an IP address","Storing data in the cloud","Measuring a physical value"],"a":0,"w":"The notes define actuation as converting a control signal into a physical action."},{"q":"Which is NOT one of the four typical needs of an actuating system?","o":["An actuator/driver","A sensor-calibration certificate","A control signal/command","An energy source"],"a":1,"w":"The four needs are control signal, actuator/driver, energy source and physical mechanism."},{"q":"In an actuation system, what supplies the power needed to perform the action?","o":["The application","The control signal","The energy source","The sensor"],"a":2,"w":"A control signal says what to do; the energy source supplies the power."}]},{"title":"19. Actuator types, relay and solenoid valve","summary":"Actuator types: electrical, mechanical, hydraulic (pressurised liquid), pneumatic (compressed gas/air), thermal (heat effects), magnetic (magnetic forces). A relay is an electrically controlled switch; a solenoid valve uses an electromagnetic solenoid to open/close a valve.","qs":[{"q":"Hydraulic actuators use:","o":["Heat effects","Pressurised liquid","Magnetic forces","Compressed air"],"a":1,"w":"Hydraulic = pressurised liquid."},{"q":"Pneumatic actuators use:","o":["Electrical energy only","Pressurised liquid","Magnetism","Compressed gas/air"],"a":3,"w":"Pneumatic = compressed gas or air."},{"q":"Which actuator type uses heat-related effects?","o":["Pneumatic","Hydraulic","Thermal","Magnetic"],"a":2,"w":"Thermal actuators use heat-related effects."},{"q":"Which is NOT an actuator type listed in the course?","o":["Magnetic","Optical-storage","Electrical","Mechanical"],"a":1,"w":"The six listed types are electrical, mechanical, hydraulic, pneumatic, thermal and magnetic."},{"q":"A relay is:","o":["A wireless gateway","An electrically controlled switch that lets a low-power circuit switch another circuit","An addressing protocol","A temperature sensor"],"a":1,"w":"A control signal energises a coil/switching mechanism to change contact state."},{"q":"A solenoid valve:","o":["Uses an electromagnetic solenoid to open or close a valve","Routes packets","Stores readings","Measures water level"],"a":0,"w":"In irrigation, the controller commands the valve, which controls water flow."}]},{"title":"20. Example: automatic irrigation","summary":"Field sensor measures soil moisture → controller reads it → control logic decides → command drives the valve → valve changes water flow → system reports to an application. Path: measurement → data → decision → command → physical action.","qs":[{"q":"In automatic irrigation, which step comes immediately after the controller reads the measurement?","o":["The field is plowed","Control logic decides whether irrigation is needed","The valve opens","The application is closed"],"a":1,"w":"The sequence is sensor, controller read, control logic decision, command, valve action."},{"q":"The complete path illustrated by the irrigation example is:","o":["Command → measurement → decision → data → action","Measurement → data → decision → command → physical action","Action → command → decision → data → measurement","Decision → data → measurement → action → command"],"a":1,"w":"This is the full sensing-to-actuation chain from the notes."},{"q":"In irrigation, the component that physically changes water flow is the:","o":["Soil moisture sensor","Valve/actuator","Dashboard","Gateway"],"a":1,"w":"The valve opens/closes to change water flow."}]},{"title":"21. IoT networking and end-to-end flow","summary":"Information path: physical environment → sensor → embedded controller → local network → gateway → wider network/backend → application. Command path runs back: application → network → controller/driver → actuator → physical action.","qs":[{"q":"Which is the correct typical information path?","o":["Application → sensor → gateway → environment","Environment → sensor → embedded controller → local network → gateway → backend → application","Gateway → sensor → application → environment","Sensor → application → gateway → controller"],"a":1,"w":"This is the conceptual model given in the notes."},{"q":"The command path for actuation is:","o":["Actuator → sensor → application","Sensor → gateway → application","Application/control logic → network → controller/driver → actuator → physical action","Gateway → actuator → sensor"],"a":2,"w":"Commands travel from application/control logic back toward the device and actuator."},{"q":"Does every IoT deployment need every block in the end-to-end diagram?","o":["Yes, always","Only deployments in agriculture","Only deployments using cellular","No, the diagram is a conceptual model"],"a":3,"w":"The notes say not every deployment needs every block."}]},{"title":"22. Components and their responsibilities","summary":"Sensor measures; embedded processor/controller processes and applies local logic; communication link carries data/commands; gateway connects local and wider networks; backend stores/processes/analyses; application presents info and issues commands; actuator creates a physical effect.","qs":[{"q":"The component that presents information and may let users issue commands is the:","o":["Communication link","Application","Sensor","Actuator"],"a":1,"w":"The application presents information and may allow users to issue commands."},{"q":"The embedded processor/controller:","o":["Reads and processes measurements and applies local logic","Only creates physical effects","Only stores history","Only forwards packets"],"a":0,"w":"This is the controller's responsibility in the notes."},{"q":"The backend may:","o":["Detect motion","Store, process or analyse incoming information","Move a valve","Measure temperature"],"a":1,"w":"Backend = store, process, analyse."}]},{"title":"23. Troubleshooting by following the data path","summary":"If a dashboard does not update, follow the path: sensor → device/controller → local link → gateway/wider network → backend/application. If the value is wrong, check units, field names and interpretation.","qs":[{"q":"A dashboard does not update. Which is the first check in the suggested troubleshooting order?","o":["The ISP billing record","The backend database schema","Whether the sensor is producing a sensible local reading","The application colour theme"],"a":2,"w":"Troubleshooting starts at the sensor and follows the data path."},{"q":"The dashboard shows a wrong value although connectivity works. What should be checked?","o":["Units, field names and interpretation","Only the cable length","Only the router power","Only the Wi-Fi password"],"a":0,"w":"Wrong values suggest interpretation problems, not just connectivity."},{"q":"A working sensor proves that the complete IoT system works.","o":["True only for wired systems","False; measurement, communication, interpretation, decision logic and actuation are separate stages","True","True only for ultrasonic sensors"],"a":1,"w":"The notes say each stage is separate and must be verified."}]},{"title":"24. Week 1 high-priority comparisons","summary":"Sensor vs actuator; sensor vs transducer; accuracy vs precision; resolution vs sensitivity; gateway vs proxy; LAN vs WAN; node vs gateway; connectivity vs interoperability.","qs":[{"q":"Sensor versus actuator:","o":["Sensor performs physical action; actuator measures","Sensor measures a condition; actuator performs physical action","Both forward packets","Both measure"],"a":1,"w":"Sensors measure input/conditions; actuators perform actions."},{"q":"Resolution versus sensitivity:","o":["Resolution = smallest detectable change; sensitivity = output change per input change","Both mean range","Resolution = output change per input change; sensitivity = smallest change","Both mean drift"],"a":0,"w":"This is the pair's difference in the notes."},{"q":"Node versus gateway:","o":["Node is an endpoint/device; gateway connects networks","Both are actuators","Both are sensors","Node connects networks; gateway is an endpoint"],"a":0,"w":"A node is an endpoint; a gateway connects networks."},{"q":"LAN versus WAN:","o":["LAN = wider-area; WAN = local","LAN = local network; WAN = wider-area interconnection","Both are wide-area","Both are local"],"a":1,"w":"Memory clue: LAN = local, WAN = wide."}]}]},{"title":"WEEK 2 — IoT Networking Protocols and Connectivity","topics":[{"title":"1. Protocol foundations and layers","summary":"A protocol is a set of rules that lets devices exchange information compatibly. Application/service: MQTT, SMQTT, CoAP, XMPP, AMQP. Physical/link: IEEE 802.15.4, ZigBee. IPv6 adaptation/routing: 6LoWPAN, LOADng, RPL.","qs":[{"q":"A protocol is:","o":["A type of sensor","A power source","A storage format","A set of rules that lets devices exchange information in a compatible way"],"a":3,"w":"The notes define a protocol as rules enabling compatible information exchange."},{"q":"Why does IoT use multiple protocols?","o":["Because IPv6 cannot be used","Because one protocol is illegal","Because devices differ in power, processing, bandwidth and reliability constraints","Because sensors cannot communicate"],"a":2,"w":"IoT devices have different constraints, so multiple protocols are used."},{"q":"Which group contains only application/service messaging protocols?","o":["ZigBee, CoAP, RPL","IEEE 802.15.4, ZigBee, RPL","6LoWPAN, RPL, LOADng","MQTT, SMQTT, CoAP, XMPP, AMQP"],"a":3,"w":"These five are the application/service protocols in the course."},{"q":"IEEE 802.15.4 primarily defines which layers?","o":["Network and session","Presentation only","Application and transport","PHY and MAC"],"a":3,"w":"802.15.4 provides physical (PHY) and medium access control (MAC) functions."},{"q":"ZigBee adds which functionality on top of 802.15.4?","o":["Nothing; ZigBee is identical to 802.15.4","Network and higher-layer functionality","Only battery management","Only physical-layer modulation"],"a":1,"w":"ZigBee uses 802.15.4 for layers 1 and 2 and adds network and higher layers."},{"q":"Which of the following are routing protocols in the course?","o":["ZigBee and RFID","CoAP and XMPP","MQTT and AMQP","LOADng and RPL"],"a":3,"w":"LOADng and RPL are the routing protocols."}]},{"title":"2. MQTT — definition and components","summary":"MQTT (Message Queue Telemetry Transport) is a lightweight publish-subscribe messaging protocol for remote connections and constrained devices. It was introduced by IBM in 1999 and standardised by OASIS in 2013. Components: publisher, broker, subscriber, topic.","qs":[{"q":"MQTT is a:","o":["Lightweight publish-subscribe messaging protocol","Heavy XML-based protocol","Routing protocol for LLNs","Wired link-layer standard"],"a":0,"w":"MQTT is lightweight and publish-subscribe, suited to constrained/remote devices."},{"q":"MQTT was introduced by IBM in which year?","o":["1999","2005","2013","2018"],"a":0,"w":"IBM introduced MQTT in 1999."},{"q":"Which organisation standardised MQTT in 2013?","o":["IEEE","ITU","OASIS","IETF"],"a":2,"w":"OASIS standardised MQTT in 2013."},{"q":"In MQTT, the broker:","o":["Produces messages only","Assigns IPv6 addresses","Measures temperature","Receives publications, matches topics against subscriptions and distributes messages"],"a":3,"w":"The broker decouples publishers from subscribers by matching topics."},{"q":"A topic in MQTT is:","o":["A type of broker","A named category/path used to classify messages","A routing table","A radio frequency"],"a":1,"w":"Topics classify messages and are matched with subscriptions."},{"q":"A subscriber in MQTT:","o":["Stores all messages permanently","Creates topics only","Subscribes to topics and receives matching messages","Routes IPv6 packets"],"a":2,"w":"Subscribers register interest in topics and receive matching messages."}]},{"title":"3. MQTT — how it works, methods and wildcard","summary":"Flow: publisher → broker/topic matching → subscriber(s). Core methods: CONNECT, DISCONNECT, SUBSCRIBE, UNSUBSCRIBE, PUBLISH. \"+\" is the single-level wildcard.","qs":[{"q":"Why is the MQTT broker said to \"decouple\" publishers and subscribers?","o":["They do not need to know each other directly","They must know each other's IP address","They use the same device","They never use the network"],"a":0,"w":"The broker sits between them, so direct knowledge is unnecessary."},{"q":"Which MQTT method registers interest in a topic?","o":["DISCONNECT","SUBSCRIBE","PUBLISH","CONNECT"],"a":1,"w":"SUBSCRIBE registers interest in a topic."},{"q":"Which MQTT method sends a message to a topic?","o":["PUBLISH","UNSUBSCRIBE","DISCONNECT","CONNECT"],"a":0,"w":"PUBLISH sends a message to a topic."},{"q":"How many core MQTT methods are listed in the guide?","o":["3","5","7","9"],"a":1,"w":"CONNECT, DISCONNECT, SUBSCRIBE, UNSUBSCRIBE, PUBLISH = 5."},{"q":"Which method cancels topic interest?","o":["PUBLISH","CONNECT","UNSUBSCRIBE","DISCONNECT"],"a":2,"w":"UNSUBSCRIBE cancels a subscription."},{"q":"In an MQTT topic filter, \"+\" is:","o":["A delimiter between brokers","A security flag","A multi-level wildcard","A single-level wildcard"],"a":3,"w":"The guide identifies + as the single-level wildcard."},{"q":"Which topic does the filter house/+/temperature match?","o":["house/kitchen/temperature","house/temperature","home/kitchen/temperature","house/kitchen/oven/temperature"],"a":0,"w":"\"+\" matches exactly one level between house/ and /temperature."},{"q":"The first step in MQTT operation is:","o":["Broker forwards message","Subscriber registers topic","A client connects to the broker","Publisher sends message"],"a":2,"w":"A client connects to the broker, then subscriptions and publications follow."}]},{"title":"4. SMQTT and MQTT strengths","summary":"SMQTT is described as a secure MQTT extension (security/encryption). MQTT strengths: lightweight, publish-subscribe, broker/topics central, decoupled endpoints, TCP/IP in the course framing. Exam clue: topic + broker + publisher/subscriber → MQTT.","qs":[{"q":"SMQTT is associated with:","o":["XML messaging","Faster UDP transport","Sensor calibration","Security/encryption added to MQTT"],"a":3,"w":"SMQTT is the secure MQTT extension in the notes."},{"q":"\"Topic + broker + publisher/subscriber\" is the exam clue for:","o":["XMPP","AMQP","CoAP","MQTT"],"a":3,"w":"These keywords identify MQTT."},{"q":"In the course framing, MQTT runs over:","o":["Bluetooth only","TCP/IP","ZigBee only","UDP"],"a":1,"w":"The notes state MQTT uses TCP/IP."}]},{"title":"5. CoAP — Constrained Application Protocol","summary":"CoAP is designed for constrained devices and networks, follows a lightweight REST-like request–response model and operates over UDP. Methods: GET, POST, PUT, DELETE.","qs":[{"q":"CoAP stands for:","o":["Common Application Protocol","Controlled Access Protocol","Connected Applications Platform","Constrained Application Protocol"],"a":3,"w":"CoAP = Constrained Application Protocol."},{"q":"CoAP operates over:","o":["TCP","Bluetooth","UDP","ZigBee only"],"a":2,"w":"The course describes CoAP as running over UDP."},{"q":"CoAP's communication model is:","o":["REST-like request–response","Queue-exchange binding","Publish–subscribe via a broker","Presence-based XML streaming"],"a":0,"w":"CoAP is lightweight and REST-like."},{"q":"Which CoAP method retrieves a resource?","o":["DELETE","PUT","GET","POST"],"a":2,"w":"GET retrieves a resource."},{"q":"Which CoAP method removes a resource?","o":["POST","DELETE","GET","PUT"],"a":1,"w":"DELETE removes a resource."},{"q":"Which CoAP method submits data or requests processing?","o":["DELETE","POST","GET","PUT"],"a":1,"w":"POST submits data/requests processing."},{"q":"PUT in CoAP is used to:","o":["Subscribe to a topic","Create/update or replace a resource representation","Remove a resource","Retrieve a resource"],"a":1,"w":"PUT creates/updates/replaces a resource representation."},{"q":"\"Lightweight REST-like protocol over UDP\" is the exam clue for:","o":["CoAP","MQTT","AMQP","XMPP"],"a":0,"w":"This phrase identifies CoAP."}]},{"title":"6. CoAP — message and response distinctions","summary":"CON = message expects an acknowledgement; NON = no acknowledgement required. Piggyback response = response combined with the acknowledgement; separate response = response sent separately from the acknowledgement.","qs":[{"q":"A Confirmable (CON) CoAP message:","o":["Expects an acknowledgement","Needs no acknowledgement","Uses TCP","Is always a DELETE"],"a":0,"w":"CON means the message expects an ACK."},{"q":"A Non-confirmable (NON) message:","o":["Is encrypted","Does not require acknowledgement","Must be acknowledged","Uses a broker"],"a":1,"w":"NON mode has no acknowledgement requirement."},{"q":"A piggyback response is one in which:","o":["A broker stores the response","There is no response","The response is combined with the acknowledgement","The response is sent separately later"],"a":2,"w":"Piggyback = response carried with the ACK."},{"q":"A separate response is:","o":["Sent over TCP","Sent separately from the acknowledgement","Combined with the acknowledgement","Never sent"],"a":1,"w":"The ACK and response are delivered separately."},{"q":"Exam trap: Confirmable/non-confirmable vs piggyback/separate. Which is correct?","o":["Both pairs describe acknowledgement behaviour","CON/NON concerns response delivery; piggyback/separate concerns acknowledgement","Both pairs describe response delivery","CON/NON concerns acknowledgement behaviour; piggyback/separate concerns how the response is delivered"],"a":3,"w":"The notes warn that these are different distinctions."}]},{"title":"7. XMPP — Extensible Messaging and Presence Protocol","summary":"XMPP is XML-based and associated with messaging, presence, service discovery and other services. Features: XML, presence, client–server, decentralised/federated communication, Jingle (multimedia signalling), multi-user chat, PubSub, service discovery.","qs":[{"q":"XMPP stands for:","o":["Extended Message Passing Protocol","Exchange Message Processing Platform","Extensible Messaging and Presence Protocol","Extensible Multimedia Packet Protocol"],"a":2,"w":"XMPP = Extensible Messaging and Presence Protocol."},{"q":"The message format used by XMPP is:","o":["Bit-packed headers","Binary frames","Plain CSV","XML"],"a":3,"w":"XMPP is XML-based."},{"q":"In XMPP, \"presence\" provides:","o":["Encryption keys","Information about availability/status","Sensor calibration","Routing tables"],"a":1,"w":"Presence = availability/status information."},{"q":"In the course material, Jingle is used for:","o":["Secure key exchange","Binary frame transfer","Route discovery","Multimedia session signalling"],"a":3,"w":"Jingle is multimedia session signalling in XMPP."},{"q":"Which is NOT an XMPP feature named in the guide?","o":["Multi-user chat","Service discovery","Exchanges, bindings and queues","Decentralised/federated communication"],"a":2,"w":"Exchanges/bindings/queues belong to AMQP."},{"q":"A limitation of XMPP in the notes is:","o":["It lacks service discovery","It cannot do presence","It only works over UDP","Text-based XML can create more overhead than a compact binary format"],"a":3,"w":"XML text (and Base64 if used) adds overhead."},{"q":"\"XML + presence + service discovery\" is the exam clue for:","o":["MQTT","CoAP","AMQP","XMPP"],"a":3,"w":"These keywords identify XMPP."}]},{"title":"8. AMQP — Advanced Message Queuing Protocol","summary":"AMQP is an open-standard, application-layer, binary messaging protocol providing reliable, guaranteed delivery, flexible routing and security over TCP. Components: producer, exchange, binding, queue, consumer, broker.","qs":[{"q":"AMQP is best described as:","o":["A link-layer wireless protocol","A text-based XML protocol over UDP","A REST-like protocol for sensors","An open-standard, application-layer binary messaging protocol with reliable delivery over TCP"],"a":3,"w":"This is the definition in the notes."},{"q":"In AMQP, the exchange:","o":["Consumes messages","Creates messages","Stores messages until consumers read them","Receives a message and routes it according to rules"],"a":3,"w":"Exchanges route messages by rules."},{"q":"In AMQP, a binding is:","o":["A frame type","A radio channel","A type of producer","A rule connecting an exchange to a queue"],"a":3,"w":"Bindings determine which queues receive routed messages."},{"q":"In AMQP, a queue:","o":["Routes messages","Stores messages until consumers receive them","Encrypts messages","Generates messages"],"a":1,"w":"Queues buffer messages for consumers."},{"q":"The AMQP message flow is:","o":["Consumer → queue → exchange → producer","Producer → exchange → (bindings) → queue → consumer","Queue → producer → consumer → exchange","Producer → queue → binding → exchange"],"a":1,"w":"Producer sends to exchange; bindings select queues; consumers retrieve."},{"q":"\"Binary messaging + exchange + binding + queue\" is the exam clue for:","o":["XMPP","MQTT","CoAP","AMQP"],"a":3,"w":"These are AMQP's signature concepts."}]},{"title":"9. AMQP — exchange types","summary":"Direct: exact routing-key match. Fan-out: all bound queues. Topic: routing-key patterns. Headers: message header attributes.","qs":[{"q":"Which AMQP exchange routes using an exact routing-key match?","o":["Topic","Headers","Direct","Fan-out"],"a":2,"w":"Direct = exact routing-key match."},{"q":"Which exchange sends the message to all queues bound to it?","o":["Topic","Direct","Fan-out","Headers"],"a":2,"w":"Fan-out broadcasts to all bound queues."},{"q":"Which exchange uses routing-key patterns?","o":["Direct","Topic","Headers","Fan-out"],"a":1,"w":"Topic exchanges use patterns."},{"q":"Which exchange uses message header attributes for routing?","o":["Headers","Topic","Fan-out","Direct"],"a":0,"w":"Headers exchange routes by header attributes."}]},{"title":"10. AMQP — delivery guarantees and frame types","summary":"At-most-once: delivered zero or one time (may be lost). At-least-once: delivered one or more times (duplicates may occur). Exactly-once: processed/delivered once (harder to achieve). Nine frame types: Open, Begin, Attach, Transfer, Flow, Disposition, Detach, End, Close.","qs":[{"q":"At-most-once delivery means a message is delivered:","o":["Exactly once without fail","Always twice","Zero or one time; it may be lost","One or more times"],"a":2,"w":"At-most-once may lose messages."},{"q":"At-least-once delivery means:","o":["Never delivered","Never duplicated","Delivered zero or one time","Delivered one or more times; duplicates may occur"],"a":3,"w":"Duplicates are allowed under at-least-once."},{"q":"Which statement is correct (exam trap)?","o":["Exactly-once is the easiest to implement","At-least-once guarantees no duplicates","At-most-once guarantees delivery","At-least-once does not mean \"no duplicates\""],"a":3,"w":"At-least-once permits duplicate delivery."},{"q":"The caution attached to exactly-once delivery is that it is:","o":["Harder to achieve and implement","Always duplicated","Always lossy","Not a guarantee at all"],"a":0,"w":"The notes say exactly-once is harder to achieve and implement."},{"q":"How many AMQP frame types does the guide list?","o":["5","7","9","12"],"a":2,"w":"Open, Begin, Attach, Transfer, Flow, Disposition, Detach, End, Close = 9."},{"q":"Which is NOT an AMQP frame type?","o":["Disposition","Transfer","Publish","Attach"],"a":2,"w":"PUBLISH is an MQTT method, not an AMQP frame."}]},{"title":"11. IEEE 802.15.4 — low-rate WPAN","summary":"IEEE 802.15.4 provides PHY and MAC foundations for low-rate Wireless Personal Area Networks (WPANs) for low-power, low-rate monitoring/control. Typical range 10–75 m; duty cycle below 1% (course values). Terms: CSMA-CA, DSSS, BPSK, O-QPSK, ISM.","qs":[{"q":"IEEE 802.15.4 provides which layers?","o":["Network and transport","Session and presentation","Application only","PHY and MAC"],"a":3,"w":"802.15.4 defines PHY and MAC for low-rate WPANs."},{"q":"WPAN stands for:","o":["Wireless Personal Area Network","Wired Personal Area Network","Wide Packet Area Network","Wireless Packet Access Node"],"a":0,"w":"WPAN = Wireless Personal Area Network."},{"q":"The typical 802.15.4 range quoted in the course guide is:","o":["1–2 m","10–75 m","100–200 km","1–5 km"],"a":1,"w":"The guide quotes 10–75 m (a revision value, not a guarantee)."},{"q":"The 802.15.4 duty cycle in the guide is:","o":["Below 1%","100%","Exactly 10%","Above 50%"],"a":0,"w":"The guide quotes a duty cycle below 1%."},{"q":"CSMA-CA stands for:","o":["Carrier Sense Multiple Access with Collision Avoidance","Carrier Signal Multiple Access with Collision Acknowledgement","Carrier Sensing Medium Access with Collision Avoidance","Channel Sense Modulated Access with Carrier Allocation"],"a":0,"w":"CSMA-CA = Carrier Sense Multiple Access with Collision Avoidance."},{"q":"In CSMA-CA, a device:","o":["Transmits immediately without sensing","Senses the channel before transmitting and uses a collision-avoidance procedure","Waits for a broker","Uses a fixed time slot only"],"a":1,"w":"It senses the channel and avoids collisions."},{"q":"DSSS stands for:","o":["Dynamic Slot Sharing Scheme","Distributed Spectrum Sensing System","Direct Sequence Spread Spectrum","Digital Sensor Signal Standard"],"a":2,"w":"DSSS = Direct Sequence Spread Spectrum."},{"q":"BPSK and O-QPSK are:","o":["Exchange types","Modulation techniques (Binary and Offset Quadrature Phase Shift Keying)","Routing protocols","Frame types"],"a":1,"w":"BPSK = Binary Phase Shift Keying; O-QPSK = Offset Quadrature Phase Shift Keying."},{"q":"ISM in \"ISM bands\" stands for:","o":["Integrated Security Module","Industrial, Scientific and Medical","International Spectrum Mode","Internet Sensor Management"],"a":1,"w":"ISM = Industrial, Scientific and Medical radio bands."}]},{"title":"12. IEEE 802.15.4 — FFD, RFD, frames and beacon modes","summary":"FFD = Full Function Device (supports full protocol, talks to all device types); RFD = Reduced Function Device (simpler, talks to an FFD). Frame types: beacon, data, acknowledgement, MAC command. Beacon-enabled uses periodic beacons with slotted CSMA-CA; non-beacon-enabled uses unslotted CSMA-CA.","qs":[{"q":"FFD stands for:","o":["Fully Fragmented Datagram","Fast Forwarding Device","Full Function Device","Fixed Frequency Device"],"a":2,"w":"FFD = Full Function Device."},{"q":"An RFD:","o":["Supports all device types","Is a simpler/lower-resource device that communicates with an FFD","Is the only coordinator","Is a type of router protocol"],"a":1,"w":"RFD = Reduced Function Device, communicating with an FFD."},{"q":"Which 802.15.4 frame supports synchronisation and association?","o":["Acknowledgement","Beacon","MAC command","Data"],"a":1,"w":"Beacon frames support synchronisation and association."},{"q":"Which frame carries user information?","o":["Data frame","Acknowledgement frame","Beacon frame","MAC command frame"],"a":0,"w":"Data frames carry user information."},{"q":"Which frame confirms reception?","o":["Acknowledgement","Data","MAC command","Beacon"],"a":0,"w":"The acknowledgement frame confirms reception."},{"q":"MAC command/control frames support:","o":["User payload","Routing","Encryption only","Control operations such as association/disassociation"],"a":3,"w":"They handle association/disassociation and control."},{"q":"Beacon-enabled 802.15.4 uses:","o":["Periodic beacons with slotted CSMA-CA","No medium access","TDMA only","Unslotted CSMA-CA"],"a":0,"w":"Beacon-enabled mode uses a beacon-managed superframe with slotted CSMA-CA."},{"q":"Non-beacon-enabled 802.15.4 uses:","o":["Unslotted CSMA-CA and contention-based access","Exchanges and bindings","Slotted CSMA-CA","Periodic beacons"],"a":0,"w":"It has no beacon-managed superframe and uses unslotted CSMA-CA."},{"q":"\"PHY/MAC + CSMA-CA + FFD/RFD\" is the exam clue for:","o":["IEEE 802.15.4","6LoWPAN","ZigBee","RPL"],"a":0,"w":"These are 802.15.4 keywords."}]},{"title":"13. ZigBee — relationship, components, roles","summary":"ZigBee uses IEEE 802.15.4 for layers 1–2 (PHY/MAC) and adds network and higher layers. ZDO = ZigBee Device Object; APS = Application Support Sublayer. Roles: Coordinator (ZC), Router (ZR), End Device (ZED).","qs":[{"q":"ZigBee uses IEEE 802.15.4 for:","o":["Routing only","Only the application layer","Layers 1 and 2 (PHY/MAC)","Layers 5–7"],"a":2,"w":"ZigBee builds network/higher layers on top of 802.15.4 PHY/MAC."},{"q":"ZDO is responsible for:","o":["Exchange routing","Frame checksums","Device management, security, policies and provisioning","Radio modulation"],"a":2,"w":"ZigBee Device Object handles device management, security, policies and provisioning."},{"q":"APS stands for:","o":["Automated Protocol Stack","Adaptive Packet Scheduler","Application Support Sublayer","Access Point Server"],"a":2,"w":"APS = Application Support Sublayer."},{"q":"In the course description, how many Coordinators does a ZigBee network have?","o":["Two","Unlimited","One per router","One"],"a":3,"w":"One coordinator per network, which forms the network and may act as trust centre."},{"q":"The ZigBee Coordinator:","o":["Is always battery-less","Only relays messages","Initiates/forms the network, acts as root, stores network information and may act as trust centre","Never stores information"],"a":2,"w":"This matches the course description of ZC."},{"q":"The ZigBee Router:","o":["Relays messages and can be part of the mesh backbone","Cannot relay messages","Is an end device","Forms the PHY"],"a":0,"w":"ZR relays messages for the mesh."},{"q":"A ZigBee End Device (ZED):","o":["Forms the network","Acts as trust centre","Relays all data","Communicates with its parent and does not relay other devices' data"],"a":3,"w":"End devices don't relay others' data."}]},{"title":"14. ZigBee — topologies, mesh reliability, AODV, applications","summary":"Topologies: star, cluster tree, mesh. A mesh is self-configuring and self-healing when alternate routes exist but does not guarantee delivery if all paths fail. ZigBee routing is associated with AODV (Ad Hoc On-Demand Distance Vector). Applications: home/building automation, remote control, smart energy, healthcare/fitness, LED lighting.","qs":[{"q":"In a ZigBee star topology, devices communicate:","o":["Only via cloud","Via RFID tags","Through a central coordinator","Directly with every other device"],"a":2,"w":"Star = central coordinator."},{"q":"Cluster tree topology is:","o":["A single point-to-point link","A broadcast bus","A flat peer-to-peer arrangement","A hierarchical parent/child arrangement"],"a":3,"w":"Cluster tree is hierarchical."},{"q":"In a mesh topology:","o":["Only the coordinator can talk","Only one path exists","Nodes can communicate directly or relay through other nodes; alternate routes may exist","Devices cannot relay"],"a":2,"w":"Mesh offers multiple possible routes."},{"q":"A ZigBee mesh:","o":["Cannot self-configure","Is self-healing when alternate routes exist but cannot guarantee delivery if all usable paths fail","Always guarantees delivery","Has no routers"],"a":1,"w":"The notes warn mesh does not guarantee delivery when all paths fail."},{"q":"ZigBee routing in the lecture is associated with:","o":["LOADng only","RPL","AODV","OSPF"],"a":2,"w":"AODV = Ad Hoc On-Demand Distance Vector."},{"q":"In AODV-style discovery, the first step is:","o":["The route is selected","A route request is broadcast to neighbours","A route error is reported","A route reply is sent"],"a":1,"w":"The route request is broadcast and relayed onward."},{"q":"Which is a ZigBee application listed in the guide?","o":["Smart energy monitoring","Wired telephony","Deep-sea acoustic networking","Satellite broadcasting"],"a":0,"w":"Smart energy monitoring, home/building automation, remote control, healthcare/fitness and LED lighting are listed."},{"q":"\"Coordinator + router + end device + mesh\" is the exam clue for:","o":["6LoWPAN","CoAP","ZigBee","AMQP"],"a":2,"w":"These are ZigBee keywords."}]},{"title":"15. 6LoWPAN — IPv6 over Low-Power WPAN","summary":"6LoWPAN adapts IPv6 for constrained low-power wireless links such as IEEE 802.15.4. Functions: header compression, packet adaptation/reformatting, fragmentation, support for IPv6-based IoT communication. Address lengths: IPv6 128 bits; extended link address 64 bits; short link address 16 bits.","qs":[{"q":"6LoWPAN stands for:","o":["IPv6 over Low-Power WiFi","IPv4 over Local Wired PANs","IPv6 over Long-range WANs","IPv6 over Low-Power Wireless Personal Area Networks"],"a":3,"w":"6LoWPAN = IPv6 over Low-Power WPANs."},{"q":"Why is 6LoWPAN needed?","o":["802.15.4 supports only IPv4","ZigBee cannot use IPv6","IPv6 is not routable","IPv6 headers can be too large for small link-layer frames"],"a":3,"w":"6LoWPAN adapts IPv6 packets to small frames."},{"q":"Which is NOT a main function of 6LoWPAN?","o":["Header compression","Exchange-to-queue binding","Fragmentation","Packet adaptation/reformatting"],"a":1,"w":"Binding is an AMQP concept."},{"q":"The IPv6 address length is:","o":["16 bits","64 bits","128 bits","32 bits"],"a":2,"w":"IPv6 = 128 bits."},{"q":"In the course guide, the extended link address is:","o":["32 bits","16 bits, PAN-specific","128 bits","64 bits, globally unique"],"a":3,"w":"Extended link address = 64 bits, globally unique."},{"q":"The short link address is:","o":["16 bits, PAN-specific and assigned by the coordinator","128 bits","8 bits","64 bits, globally unique"],"a":0,"w":"Short address = 16 bits assigned by the coordinator."}]},{"title":"16. 6LoWPAN — header types and fragmentation","summary":"Header types: Dispatch (identifies the type of header that follows), Mesh addressing (originator/final address and hops-left field decreasing per hop), Fragmentation (splits datagrams that do not fit one frame). First fragment carries datagram size and tag; later fragments carry an offset.","qs":[{"q":"How many 6LoWPAN header types does the guide list?","o":["2","3","4","5"],"a":1,"w":"Dispatch, Mesh addressing and Fragmentation = 3."},{"q":"The Dispatch header:","o":["Identifies the type of header that follows","Splits datagrams","Holds the payload","Carries hop count"],"a":0,"w":"Dispatch tells the receiver which header follows."},{"q":"The Mesh addressing header carries:","o":["Only presence data","Only the fragment offset","Originator/final address information and a \"hops left\" field","Only encryption keys"],"a":2,"w":"Hops left decreases at each hop."},{"q":"The Fragmentation header supports:","o":["Header compression only","Splitting datagrams that do not fit into one constrained frame","Routing table updates","Authentication"],"a":1,"w":"Fragmentation handles oversize datagrams."},{"q":"The first fragment of a datagram carries:","o":["Nothing but payload","Datagram-size and tag information","Only an offset","Only the checksum"],"a":1,"w":"First fragment carries size and tag; subsequent fragments include an offset."},{"q":"Subsequent fragments include an offset so that:","o":["The route is selected","The broker can match topics","Beacons are synchronised","Pieces can be placed correctly during reassembly"],"a":3,"w":"The offset aids reassembly."},{"q":"\"IPv6 over constrained WPAN + compression + fragmentation\" is the exam clue for:","o":["LOADng","6LoWPAN","RFID","RPL"],"a":1,"w":"These are 6LoWPAN keywords."}]},{"title":"17. LOADng routing","summary":"LOADng is a lightweight on-demand routing protocol derived from AODV and adapted for IoT. Messages: RREQ (Route Request), RREP (Route Reply), RERR (Route Error). It uses optimised flooding to reduce route-request overhead; the destination responds to the request.","qs":[{"q":"LOADng is derived from:","o":["RPL","ZigBee","AODV","MQTT"],"a":2,"w":"LOADng is derived from AODV and adapted for IoT."},{"q":"RREQ stands for:","o":["Route Reply","Route Request","Route Error","Resource Query"],"a":1,"w":"RREQ searches for a route to a destination."},{"q":"RREP is used to:","o":["Return route information toward the originator","Compress headers","Search for a route","Report a broken route"],"a":0,"w":"RREP = Route Reply."},{"q":"RERR is used to:","o":["Request a route","Return a route","Fragment a datagram","Report a broken route"],"a":3,"w":"RERR = Route Error."},{"q":"The purpose of optimised flooding in LOADng is to:","o":["Increase route-request overhead","Elect a coordinator","Reduce route-request overhead","Encrypt packets"],"a":2,"w":"It reduces overhead of route requests."},{"q":"How many route messages does LOADng use?","o":["2","3","4","5"],"a":1,"w":"RREQ, RREP, RERR = 3."}]},{"title":"18. RPL routing and LOADng versus RPL","summary":"RPL is a distance-vector IPv6 routing protocol for Low-Power and Lossy Networks (LLNs). It maintains topology using low-rate beaconing, which increases when inconsistencies/failures are detected; combines proactive topology maintenance with reactive handling; links may be asymmetric, so parent reachability should be verified.","qs":[{"q":"RPL stands for:","o":["Resource Protocol for LANs","Radio Path Locator","Routing Protocol for Low-Power and Lossy Networks","Reliable Packet Layer"],"a":2,"w":"RPL = Routing Protocol for Low-Power and Lossy Networks."},{"q":"RPL is classified as a:","o":["Distance-vector IPv6 routing protocol","Publish-subscribe protocol","Messaging protocol","Link-state IPv4 protocol"],"a":0,"w":"The course calls it a distance-vector IPv6 routing protocol for LLNs."},{"q":"RPL maintains network topology using:","o":["Low-rate beaconing","Exchange bindings","RFID readers","Frequent high-rate flooding"],"a":0,"w":"Low-rate beaconing, which can increase on inconsistencies."},{"q":"Why should parent reachability be verified in RPL?","o":["Because beacons are disabled","Because links may be asymmetric","Because parents are always unreachable","Because links are always symmetric"],"a":1,"w":"Asymmetric links mean a heard parent may not be reachable back."},{"q":"Which pairing is correct?","o":["RREQ/RREP/RERR → LOADng","Low-rate beaconing → LOADng","RREQ/RREP/RERR → RPL","Derived from AODV → RPL"],"a":0,"w":"RREQ/RREP/RERR are LOADng messages; RPL uses low-rate beaconing."},{"q":"How does LOADng handle failures versus RPL?","o":["Both use RERR only","Neither handles failures","LOADng uses beaconing; RPL uses RERR","LOADng uses RERR for broken routes; RPL uses beaconing/consistency mechanisms"],"a":3,"w":"This is the failure-handling row of the comparison table."},{"q":"\"Distance-vector IPv6 for LLNs\" is the exam clue for:","o":["ZigBee","LOADng","6LoWPAN","RPL"],"a":3,"w":"This describes RPL."}]},{"title":"19. RFID — Radio-Frequency Identification","summary":"RFID uses digitally encoded data in tags read by an RFID reader via radio communication, without optical scanning (unlike barcode/QR). A tag has an integrated circuit (IC), an antenna and protective material. AIDC = Automatic Identification and Data Capture.","qs":[{"q":"Unlike a barcode, RFID:","o":["Requires optical scanning","Cannot store data","Needs a printed code only","Does not rely on optical scanning"],"a":3,"w":"RFID reads tags through radio communication."},{"q":"The integrated circuit (IC) in an RFID tag:","o":["Stores identifying information and performs electronic functions","Only protects the tag","Only acts as antenna","Powers the reader"],"a":0,"w":"The IC stores identification data."},{"q":"The antenna in an RFID tag:","o":["Covers the tag","Stores the ID only","Forms the database","Supports communication between the tag and the outside world"],"a":3,"w":"The antenna enables tag–reader communication."},{"q":"Protective material in a tag:","o":["Stores IDs","Acts as reader","Encodes data","Covers/protects components"],"a":3,"w":"It protects the chip and antenna."},{"q":"AIDC stands for:","o":["Automatic Identification and Data Capture","Analog-to-Integrated Digital Conversion","Advanced IoT Device Communication","Automated Internet Data Control"],"a":0,"w":"AIDC = Automatic Identification and Data Capture."},{"q":"Which is an RFID application listed in the guide?","o":["Satellite navigation","Deep-sea routing","Access control for restricted areas","Compiler optimisation"],"a":2,"w":"Inventory, asset tracking, personnel attendance, access control and ID badges/smart cards are listed."},{"q":"The RFID working sequence ends with:","o":["The system identifying the item or using the ID to retrieve database information","The tag being destroyed","The reader switching off","A broker being queried"],"a":0,"w":"The system uses the ID to identify or fetch associated data."},{"q":"\
