e domain."}, {"q": "Which main selection cue goes with WirelessHART?", "o": ["Tap-to-pay", "Predictable industrial communication", "Audio streaming", "Home lighting only"], "a": 1, "w": "WirelessHART is chosen for predictable industrial communication."}]}, {"title": "4. Near Field Communication (NFC)", "summary": "NFC is a very short-range technology: 13.56 MHz, range under 20 cm, data rates 106/212/424 kbps, working by magnetic induction between nearby coils. Active devices generate their own RF field; passive tags use the reader's field. Modes: reader/writer, card emulation, peer-to-peer.", "qs": [{"q": "NFC operates at:", "o": ["2.4 GHz", "865.2 MHz", "13.56 MHz", "5.9 GHz"], "a": 2, "w": "The course specifies 13.56 MHz."}, {"q": "The NFC range is:", "o": ["Up to 100 m", "10–75 m", "Up to 1 km", "Under 20 cm"], "a": 3, "w": "NFC is very short-range, under 20 cm."}, {"q": "NFC data rates are:", "o": ["1600 kbps", "1, 2, 5 Mbps", "106, 212 or 424 kbps", "250 kbps only"], "a": 2, "w": "The course lists 106, 212 and 424 kbps."}, {"q": "The working principle of NFC is:", "o": ["Optical scanning", "Magnetic induction between nearby coils", "Infrared reflection", "Ultrasonic echoes"], "a": 1, "w": "NFC uses magnetic induction."}, {"q": "A passive NFC tag/device:", "o": ["Can use the reader's field/energy to respond", "Never communicates", "Needs a battery always", "Generates its own strong RF field"], "a": 0, "w": "Passive devices draw on the reader's field."}, {"q": "Active NFC devices:", "o": ["Generate their own RF field", "Are optical devices", "Rely entirely on the reader's energy", "Cannot communicate"], "a": 0, "w": "Active devices generate their own RF field."}, {"q": "Which NFC mode reads from or writes to a tag?", "o": ["Beacon mode", "Peer-to-peer mode", "Card emulation mode", "Reader/writer mode"], "a": 3, "w": "Reader/writer mode reads/writes tags."}, {"q": "In card emulation mode, an NFC device:", "o": ["Behaves like a contactless card", "Acts as router", "Exchanges info between two active devices", "Writes tags"], "a": 0, "w": "Card emulation = acts like a contactless card (e.g., tap-to-pay)."}, {"q": "Peer-to-peer NFC mode:", "o": ["Is used only with passive tags", "Emulates a card", "Uses piconets", "Allows two active devices to exchange information"], "a": 3, "w": "P2P = two active devices exchange information."}, {"q": "How many NFC operating modes are listed?", "o": ["2", "3", "4", "5"], "a": 1, "w": "Reader/writer, card emulation and peer-to-peer."}, {"q": "Units in NFC: which is correct?", "o": ["cm = frequency; kbps = range", "MHz = range; cm = data rate", "kbps = frequency; MHz = range", "MHz = frequency; kbps = data rate; cm = range"], "a": 3, "w": "The \"Remember\" note maps units to frequency, data rate and range."}]}, {"title": "5. Bluetooth connectivity", "summary": "Bluetooth supports short-range PAN and wireless cable replacement, in the 2.4–2.485 GHz band with 1600 hops per second. Connection: inquiry/discovery → paging → connected state. Stack terms: L2CAP, RFCOMM, SDP. Piconet = one master + up to seven active slaves; scatternet = linked piconets.", "qs": [{"q": "The Bluetooth band in the guide is:", "o": ["13.56 MHz", "865.2 MHz", "5850–5925 MHz", "2.4–2.485 GHz"], "a": 3, "w": "The guide places Bluetooth at 2.4–2.485 GHz."}, {"q": "Bluetooth hopping rate in the described system is:", "o": ["10 hops per second", "1600 hops per second", "106 hops per second", "15 hops per second"], "a": 1, "w": "The notes state 1600 hops per second."}, {"q": "Bluetooth range:", "o": ["Is always 100 m", "Depends on radio class and transmission power", "Is identical for all devices", "Is under 20 cm"], "a": 1, "w": "Do not assume every Bluetooth device has the same range."}, {"q": "In Bluetooth connection setup, inquiry/discovery:", "o": ["Exchanges data", "Finds nearby devices", "Ends the session", "Establishes contact with a discovered device"], "a": 1, "w": "Inquiry = discovery."}, {"q": "In Bluetooth connection setup, paging:", "o": ["Multiplexes data", "Emulates serial cables", "Establishes contact with a discovered device", "Finds nearby devices"], "a": 2, "w": "Paging = connection establishment."}, {"q": "The correct Bluetooth connection sequence is:", "o": ["Paging → inquiry → connected", "Inquiry → connected → paging", "Inquiry → paging → connected", "Connected → paging → inquiry"], "a": 2, "w": "Discover, page, then connected state."}, {"q": "L2CAP provides:", "o": ["Frequency hopping", "Serial-cable emulation", "Multiplexing and segmentation/reassembly of higher-layer data", "Service discovery"], "a": 2, "w": "L2CAP handles multiplexing and SAR."}, {"q": "RFCOMM provides:", "o": ["Multiplexing and SAR", "Service discovery", "Serial-cable emulation", "Piconet formation"], "a": 2, "w": "RFCOMM = serial-cable emulation."}, {"q": "SDP in the Bluetooth stack is:", "o": ["Serial Data Protocol", "Secure Device Pairing", "Service Discovery Protocol", "Signal Distribution Process"], "a": 2, "w": "SDP handles service discovery."}, {"q": "A piconet in the supplied model consists of:", "o": ["Eight masters", "Unlimited masters", "Two masters and one slave", "One master and up to seven active slaves"], "a": 3, "w": "One master and up to seven active slaves."}, {"q": "A scatternet is:", "o": ["A set of linked piconets using devices that participate across piconets", "A single piconet", "An NFC network", "A ZigBee mesh"], "a": 0, "w": "Scatternet links piconets."}, {"q": "Bluetooth power-saving/operating modes:", "o": ["Reduce activity when a device does not need to communicate continuously", "Increase activity continuously", "Fix the range", "Disable pairing"], "a": 0, "w": "They reduce activity during idle periods."}]}, {"title": "6. Z-Wave", "summary": "Z-Wave focuses on home automation and low-power smart-home devices, using region-dependent sub-GHz frequencies (865.2 MHz for India). GFSK is the modulation (Gaussian filter + FSK); Manchester is the encoding. Home ID identifies a network; Node ID identifies a device. A primary controller manages the network; source routing and healing paths provide routing and recovery.", "qs": [{"q": "Z-Wave is mainly associated with:", "o": ["Vehicle networks", "Industrial plant networks", "Home automation", "Underwater networks"], "a": 2, "w": "The notes associate Z-Wave with home automation."}, {"q": "The Z-Wave frequency listed for India is:", "o": ["13.56 MHz", "2.4 GHz", "865.2 MHz", "5.9 GHz"], "a": 2, "w": "The course lists 865.2 MHz for India."}, {"q": "GFSK stands for:", "o": ["Gated Frequency Switch Key", "General Frequency Shift Keying", "Generic Fast Shift Keying", "Gaussian Frequency Shift Keying"], "a": 3, "w": "GFSK = Gaussian FSK; a Gaussian filter smooths pulses before FSK."}, {"q": "Manchester in Z-Wave is:", "o": ["A frame type", "A modulation scheme", "A line/channel encoding", "A routing method"], "a": 2, "w": "Manchester is encoding; GFSK is modulation."}, {"q": "Home ID in Z-Wave identifies:", "o": ["A network", "A single node", "A controller type", "A frequency band"], "a": 0, "w": "Home ID = network identifier."}, {"q": "Node ID in Z-Wave identifies:", "o": ["The modulation", "A device/node within the network", "The network", "The region"], "a": 1, "w": "Node ID = device within a network; Home ID ≠ Node ID."}, {"q": "In Z-Wave source routing:", "o": ["Route information is selected at the source and included with the message", "A broker routes packets", "There is no routing", "Routes are decided by each hop independently"], "a": 0, "w": "The source selects the route and carries it in the message."}, {"q": "Healing paths in Z-Wave:", "o": ["Store sensor data", "Compress headers", "Use alternate routes when a route or node fails", "Disable devices"], "a": 2, "w": "Healing = alternate routes on failure."}, {"q": "The primary controller in Z-Wave helps:", "o": ["Measure humidity", "Modulate light", "Generate Gaussian filters", "Manage the network"], "a": 3, "w": "A primary controller manages the network."}]}, {"title": "7. ISA100.11a", "summary": "ISA100.11a is presented for industrial plant/complex networks, with physical/MAC foundations based on IEEE 802.15.4, frequency hopping, TDMA/QoS-related functions, security/key management, and support for integrating native and tunnelled/legacy protocols.", "qs": [{"q": "ISA100.11a is associated with:", "o": ["Personal audio", "Home lighting", "Contactless payment", "Industrial plant/complex networks"], "a": 3, "w": "Z-Wave = home; ISA100.11a = industrial."}, {"q": "ISA100.11a physical/MAC foundations are based on:", "o": ["IEEE 802.11p", "IEEE 802.15.4", "NFC", "IEEE 802.3"], "a": 1, "w": "The course describes 802.15.4-based foundations."}, {"q": "Which feature is associated with ISA100.11a?", "o": ["Optical scanning", "13.56 MHz induction", "Manchester-only encoding", "Frequency hopping, TDMA/QoS functions and security/key management"], "a": 3, "w": "These are listed in the guide."}, {"q": "ISA100.11a supports integration of:", "o": ["Only a single protocol", "Different protocol types, including native and tunnelled/legacy applications", "Only NFC tags", "Only Bluetooth devices"], "a": 1, "w": "It supports industrial architectures with mixed protocols."}]}, {"title": "8. Wireless Sensor Networks: node and network model", "summary": "A sensor node senses a phenomenon, processes the measurement, communicates it and operates under energy/hardware constraints. Single-hop: nodes send directly to the sink/gateway. Multi-hop: intermediate nodes relay. A sink node collects sensed data, often connected to a gateway or the Internet.", "qs": [{"q": "In single-hop communication:", "o": ["Intermediate nodes relay packets", "Nodes send directly to a sink/gateway", "Nodes only talk to tags", "No sink exists"], "a": 1, "w": "Single-hop = direct to sink."}, {"q": "In multi-hop communication:", "o": ["There is only one node", "Intermediate nodes relay packets to extend reach", "Nodes never relay", "Nodes talk only to RFID readers"], "a": 1, "w": "Multi-hop extends reach via relays."}, {"q": "A sink node is:", "o": ["A malicious node", "A faulty node", "A collection destination for sensed data", "A mobile node only"], "a": 2, "w": "The sink collects data, often connected to a gateway/Internet."}, {"q": "Sensor nodes generally:", "o": ["Cannot process data", "Operate under energy and hardware constraints", "Have unlimited energy", "Cannot communicate"], "a": 1, "w": "The notes emphasise energy and hardware constraints."}]}, {"title": "9. WSN topology, constraints, QoS and Sensor Web", "summary": "Topologies: star, tree, mesh. Deployments must consider scalability, energy, connectivity, reliability, delay and QoS (bandwidth, delay, jitter, packet-loss probability). Nodes may be stationary or mobile (mobility makes topology maintenance harder). The Sensor Web connects sensor networks, instruments, services, data resources and users.", "qs": [{"q": "Which are common ways to organise WSN links?", "o": ["Only point-to-point", "Ring, bus, star-of-stars only", "Star, tree and mesh", "Only bus"], "a": 2, "w": "Star, tree and mesh are listed."}, {"q": "Which is NOT a QoS dimension highlighted in the guide?", "o": ["Bandwidth", "Packet-loss probability", "Casing colour", "Jitter"], "a": 2, "w": "QoS dimensions: bandwidth, delay, jitter, packet-loss probability."}, {"q": "Why do mobile nodes complicate WSNs?", "o": ["They stop interference", "They make topology maintenance harder", "They remove the need for routing", "They increase battery life"], "a": 1, "w": "Mobility changes links and makes topology maintenance harder."}, {"q": "The Sensor Web is:", "o": ["A single WSN", "A Bluetooth stack", "A broader system connecting sensor networks, instruments, services, data resources and users", "A type of antenna"], "a": 2, "w": "It is broader than one WSN so observations can be discovered and used."}]}, {"title": "10. Node behaviour and failures", "summary": "Failed node: unable to perform its function. Selfish node: avoids forwarding because relaying consumes resources. Malicious node: intentionally disrupts or attacks operation. Temporary \"dumb\" behaviour: problems caused by environmental/temporary conditions, not automatically malicious.", "qs": [{"q": "A failed node is one that:", "o": ["Intentionally attacks the network", "Is unable to perform its intended function", "Avoids forwarding to save energy", "Is always a sink"], "a": 1, "w": "Failure = inability to perform the function."}, {"q": "A selfish node:", "o": ["Is a sink", "May avoid forwarding because relaying consumes its resources/energy", "Is a gateway", "Always attacks"], "a": 1, "w": "Selfishness is about conserving its own resources."}, {"q": "A malicious node:", "o": ["Intentionally disrupts or attacks network operation", "Is always mobile", "Is a temporary fault only", "Is merely tired"], "a": 0, "w": "Malicious = intentional disruption."}, {"q": "Temporary \"dumb\" behaviour should:", "o": ["Automatically be labelled malicious", "Not automatically be labelled malicious", "Always be labelled selfish", "Be ignored forever"], "a": 1, "w": "The lecture says environmental/temporary problems should not be assumed malicious."}, {"q": "Network management in WSNs includes:", "o": ["Only billing", "Only routing", "Only security", "Topology management, information/data management, cooperation and fault handling"], "a": 3, "w": "These four are listed."}]}, {"title": "11. WSN application cues", "summary": "Social sensing: people or their devices contribute observations. Mines/industrial environments: monitoring and safety. WBAN (Wireless Body Area Network): physiological sensors communicate through a local processing/coordinator unit for healthcare.", "qs": [{"q": "Social sensing involves:", "o": ["People or their devices contributing observations", "Only fixed industrial sensors", "Optical scanning only", "Underwater acoustics"], "a": 0, "w": "Social sensing uses human/device contributions."}, {"q": "WBAN stands for:", "o": ["Wireless Body Area Network", "Wireless Bluetooth Area Node", "Wide Band Access Node", "Wired Backbone Area Network"], "a": 0, "w": "WBAN = Wireless Body Area Network."}, {"q": "In a WBAN, physiological sensors communicate through:", "o": ["A cloud only", "A hydraulic actuator", "A satellite", "A local processing/coordinator unit"], "a": 3, "w": "They report via a local processing/coordinator unit for healthcare/body monitoring."}, {"q": "In mines and industrial environments, WSNs support:", "o": ["Gaming", "Image editing", "Monitoring and safety", "Marketing"], "a": 2, "w": "Sensing supports monitoring and safety there."}]}, {"title": "12. Week 3 quick-recall comparisons", "summary": "WirelessHART: TDMA + super-frames + hopping + blacklisting + mesh. NFC: 13.56 MHz, under 20 cm, magnetic induction, 3 modes. Bluetooth: inquiry → paging → connection; piconet vs scatternet. Z-Wave: home automation, Home ID/Node ID, GFSK, Manchester, source routing. ISA100.11a: industrial, hopping, QoS, security.", "qs": [{"q": "Which technology is associated with TDMA + super-frames + channel hopping + blacklisting + mesh?", "o": ["WirelessHART", "NFC", "Z-Wave", "Bluetooth"], "a": 0, "w": "These are WirelessHART's mechanisms."}, {"q": "\"13.56 MHz, under 20 cm, magnetic induction\" refers to:", "o": ["Bluetooth", "NFC", "Z-Wave", "ISA100.11a"], "a": 1, "w": "These are NFC's defining specs."}, {"q": "\"Home ID/Node ID, GFSK, Manchester, source routing\" refers to:", "o": ["Z-Wave", "WirelessHART", "Bluetooth", "NFC"], "a": 0, "w": "These are Z-Wave features."}, {"q": "Which pair is correct?", "o": ["GFSK = encoding; Manchester = modulation", "Inquiry = discovery; paging = connection establishment", "Inquiry = connection establishment; paging = discovery", "Piconet = linked piconets; scatternet = one network"], "a": 1, "w": "Exam traps from Week 3 clarify these distinctions."}]}]}, {"title": "WEEK 4 — Sensor-Network Applications, Coverage, Mobility, UAV and M2M", "topics": [{"title": "1. Target tracking", "summary": "A sensor network can detect and track a target using observations from multiple nodes. It may activate only relevant nodes or adjust duty cycles to conserve energy. Duty cycle is the fraction/pattern of time a node is active rather than asleep.", "qs": [{"q": "In target tracking, sensor networks use:", "o": ["A single node always", "Observations from multiple nodes to detect and track a target", "Only satellites", "Only RFID tags"], "a": 1, "w": "Multiple nodes' observations are combined for tracking."}, {"q": "Why may only relevant nodes be activated in tracking?", "o": ["To conserve energy", "To raise latency", "To disable the sink", "To increase interference"], "a": 0, "w": "Selective activation and duty-cycle adjustment save energy."}, {"q": "Duty cycle is:", "o": ["The data rate", "The fraction/pattern of time a node remains active rather than asleep", "The node's address", "The communication range"], "a": 1, "w": "This is the definition given in the notes."}, {"q": "How can event likelihood guide node activity?", "o": ["Only far nodes wake", "Nodes near a likely target may need to be awake more often", "Likelihood is irrelevant", "All nodes must sleep"], "a": 1, "w": "Nodes near the likely target need more activity."}]}, {"title": "2. Agriculture, WMSNs, nanonetworks and UWASNs", "summary": "Agriculture: distributed sensors monitor field conditions for irrigation/crop decisions. WMSNs extend sensing to multimedia (images/video) with larger data volumes. Nanonetworks involve communication among nanoscale devices. UWASNs commonly use acoustic links and face propagation delay, limited bandwidth, energy constraints and changing conditions.", "qs": [{"q": "Benefits of sensors in agriculture include:", "o": ["No energy use", "Localised observation and reduced need for manual inspection", "Unlimited range", "Removal of all farmers"], "a": 1, "w": "The notes list localised observation and reduced manual inspection."}, {"q": "Agricultural deployments must account for:", "o": ["Coverage, energy, communication reliability and environmental conditions", "Only colour", "Only fashion", "Only price"], "a": 0, "w": "These are the stated deployment considerations."}, {"q": "WMSN stands for:", "o": ["Wireless Multimedia Sensor Network", "Wireless Mobile Signal Network", "Wired Multimedia Storage Node", "Wide Mesh Sensor Node"], "a": 0, "w": "WMSN = Wireless Multimedia Sensor Network."}, {"q": "Compared with scalar sensing, WMSNs create:", "o": ["Smaller data volumes", "No extra demands", "No applications", "Larger data volumes and greater bandwidth, processing, storage and energy demands"], "a": 3, "w": "Images/video are heavy data."}, {"q": "A typical WMSN application is:", "o": ["Sound-free monitoring only", "Simple door switches", "Surveillance and monitoring where visual context matters", "Wired telephony"], "a": 2, "w": "Surveillance is listed."}, {"q": "Nanonetworks involve:", "o": ["Large planetary nodes", "Communication among nanoscale devices with distinctive constraints", "Only cellular towers", "Only Wi-Fi"], "a": 1, "w": "The exam focus is scale and communication challenges."}, {"q": "Underwater networks in the course commonly use which link type?", "o": ["Optical fibre", "Acoustic links", "NFC", "Infrared"], "a": 1, "w": "The course discusses underwater acoustic sensor networks."}, {"q": "Which is NOT a stated UWASN challenge?", "o": ["Propagation delay", "Energy constraints", "Limited bandwidth", "Abundant bandwidth"], "a": 3, "w": "UWASNs have limited bandwidth."}, {"q": "UWASN stands for:", "o": ["Unmanned Wide-Area Sensor Node", "Underwater Acoustic Sensor Network", "Universal Wireless Area Sensor Net", "Underground Wired Antenna System Network"], "a": 1, "w": "UWASN = Underwater Acoustic Sensor Network."}]}, {"title": "3. Coverage and connectivity", "summary": "Coverage: whether the required area, targets or points are sensed. Connectivity: whether nodes can communicate with each other or reach the sink. Coverage ≠ connectivity. Turning nodes off to save energy must not create coverage holes or disconnect the network.", "qs": [{"q": "Coverage in a WSN refers to:", "o": ["Data rate", "Whether the required area/targets/points are sensed", "Whether nodes can reach the sink", "Battery capacity"], "a": 1, "w": "Coverage = sensing completeness of area/targets."}, {"q": "Connectivity refers to:", "o": ["Whether the area is sensed", "Whether sensor nodes can communicate with each other or reach the sink", "Whether nodes are cheap", "Whether nodes are mobile"], "a": 1, "w": "Connectivity is about communication paths."}, {"q": "A network can cover an area but still fail to deliver readings if:", "o": ["Nodes are identical", "Coverage is perfect", "The sink is nearby", "Connectivity is broken"], "a": 3, "w": "Covered but disconnected nodes cannot deliver data."}, {"q": "Which statement is correct?", "o": ["Coverage = connectivity", "Connected nodes always cover everything", "Coverage is irrelevant", "Nodes can be connected yet leave parts of the area unsensed"], "a": 3, "w": "The notes say coverage ≠ connectivity."}, {"q": "Overlap between sensing regions can:", "o": ["Be harmful in every case", "Always reduce coverage", "Provide redundancy but waste energy if too many nodes stay active", "Never matter"], "a": 2, "w": "Redundancy helps reliability but costs energy."}, {"q": "When switching nodes off to save energy, one must ensure:", "o": ["All nodes are mobile", "The sink is switched off", "No coverage hole or disconnection is created", "Overlap is maximised"], "a": 2, "w": "Coverage and connectivity must be considered together."}, {"q": "Coverage planning weighs sensing completeness against:", "o": ["Paint colour", "Brand names", "IPv4 addresses", "Node count, overlap and energy use"], "a": 3, "w": "These trade-offs are stated."}]}, {"title": "4. OGDC", "summary": "Optimal Geographical Density Control (OGDC) manages which nodes remain active so that coverage and connectivity objectives are maintained with reduced energy use. Intuition: avoid keeping every node active when a smaller coordinated subset suffices.", "qs": [{"q": "OGDC stands for:", "o": ["Overlapping Group Data Clustering", "Open Gateway Data Collection", "Optimised Gradient Distance Control", "Optimal Geographical Density Control"], "a": 3, "w": "OGDC = Optimal Geographical Density Control."}, {"q": "The purpose of OGDC is to:", "o": ["Keep all nodes active", "Increase node count", "Maintain required coverage/connectivity with reduced energy by activating a coordinated subset", "Maximise overlap"], "a": 2, "w": "It conserves energy without sacrificing coverage/connectivity."}, {"q": "The central trade-off in OGDC is:", "o": ["Speed versus colour", "Energy conservation versus required coverage/connectivity", "Range versus voltage", "Cost versus brand"], "a": 1, "w": "Save energy without losing coverage/connectivity."}]}, {"title": "5. Stationary versus mobile WSNs", "summary": "In a stationary WSN, nodes are fixed or mostly fixed and topology is relatively stable. In a Mobile Wireless Sensor Network (MWSN), sensors, sinks or data carriers may move, so links and neighbourhoods change. Mobility can improve reach or bring data to a collection point, but makes routing, localisation, coverage and topology maintenance more difficult.", "qs": [{"q": "In a stationary WSN, the topology is:", "o": ["Undefined", "Constantly changing", "Relatively stable", "Always a mesh of moving nodes"], "a": 2, "w": "Nodes are fixed or mostly fixed, so topology is relatively stable."}, {"q": "MWSN stands for:", "o": ["Mobile Wide-area Sensor Net", "Mesh Wireless Signal Network", "Mobile Wireless Sensor Network", "Multi-hop Wired Sensor Node"], "a": 2, "w": "MWSN = Mobile Wireless Sensor Network."}, {"q": "In an MWSN, which elements may move?", "o": ["Only the sink", "Nothing; only the data moves", "Only the sensors", "Sensors, sinks or data carriers"], "a": 3, "w": "The notes say sensors, sinks or data carriers may move, so links and neighbourhoods change."}, {"q": "Which is a benefit of mobility in sensor networks?", "o": ["It can improve reach or bring data to a collection point", "It removes the need for routing", "It makes topology maintenance easier", "It eliminates energy use"], "a": 0, "w": "Mobility can extend reach or carry data to the sink."}, {"q": "Which of the following does mobility make MORE difficult?", "o": ["Routing", "Localisation", "Coverage and topology maintenance", "All of the above"], "a": 3, "w": "The notes list routing, localisation, coverage and topology maintenance."}]}, {"title": "6. Human-centric and participatory sensing", "summary": "Human-centric sensing: humans may be the sensing target, operator or source of data through personal devices. Participatory sensing: people voluntarily contribute data or observations, often using mobile devices. Consider data quality, participation, privacy and device/energy constraints.", "qs": [{"q": "In human-centric sensing, humans may be the:", "o": ["Only the sink", "Sensing target, operator or source of data via personal devices", "Only the network administrators", "Excluded from sensing"], "a": 1, "w": "This is the definition given for human-centric sensing."}, {"q": "Participatory sensing is when:", "o": ["Machines exchange data with no humans", "Sensors are buried underground", "UAVs fly automatically", "People voluntarily contribute data or observations, often with mobile devices"], "a": 3, "w": "Participation is voluntary and usually uses mobile devices."}, {"q": "Which factor must be considered when interpreting human-centric or participatory sensing data?", "o": ["Data quality", "Participation and privacy", "Device/energy constraints", "All of the above"], "a": 3, "w": "The notes list data quality, participation, privacy and device/energy constraints."}, {"q": "Exam trap: human-centric sensing versus M2M.", "o": ["Human-centric sensing intentionally involves humans; M2M aims for machine communication without a human in each exchange", "Both avoid humans entirely", "They are identical", "M2M requires humans in every exchange"], "a": 0, "w": "The notes state human-centric sensing ≠ M2M."}]}, {"title": "7. Data mules and Delay-Tolerant Networks (DTNs)", "summary": "A data mule physically moves through an area, collects data from sensor nodes and carries it to a gateway/sink. DTN (Delay-Tolerant Networking) supports communication when continuous end-to-end connectivity is unavailable: data is stored and forwarded when a suitable contact occurs. Useful in sparse, disconnected or mobile environments, but accepts delay.", "qs": [{"q": "A data mule:", "o": ["Is a type of actuator", "Only routes IPv6 packets", "Physically moves through an area, collects data from sensor nodes and carries it to a gateway/sink", "Is a fixed sink"], "a": 2, "w": "Mules carry data physically between sensors and the sink."}, {"q": "DTN stands for:", "o": ["Digital Transmission Node", "Delay-Tolerant Networking", "Distributed Topology Network", "Data Transfer Notation"], "a": 1, "w": "DTN = Delay-Tolerant Networking."}, {"q": "DTN supports communication when:", "o": ["No data is produced", "Continuous end-to-end connectivity is unavailable", "Connectivity is perfect", "Only wired links exist"], "a": 1, "w": "Data are stored and forwarded when a suitable contact occurs."}, {"q": "The DTN approach of storing data and forwarding it at a suitable contact is called:", "o": ["Flooding only", "Store-and-forward", "Broadcast storm", "Beaconing"], "a": 1, "w": "The notes describe data being stored and forwarded."}, {"q": "What is the cost of using DTN or data mules?", "o": ["They cannot work in sparse networks", "They need no storage", "They accept delay", "They require continuous connectivity"], "a": 2, "w": "They suit sparse/disconnected environments but accept delay."}]}, {"title": "8. UAV networks and FANETs", "summary": "UAV networks use aerial platforms for sensing, relaying, coverage or communication. Single-UAV systems are simple but limited; multi-UAV systems cover more area but are harder to coordinate. FANET = Flying Ad Hoc Network. UAVs can act as data mules or gateways between terrestrial WSNs/VANETs and infrastructure.", "qs": [{"q": "UAV stands for:", "o": ["Universal Antenna Vector", "Unified Access Variable", "Unmanned Aerial Vehicle", "Underwater Acoustic Vehicle"], "a": 2, "w": "UAV = Unmanned Aerial Vehicle."}, {"q": "FANET stands for:", "o": ["Fast Access Node Entry Technology", "Fixed Antenna Network", "Fibre Area Network", "Flying Ad Hoc Network"], "a": 3, "w": "FANET = Flying Ad Hoc Network (an ad hoc network formed by UAVs)."}, {"q": "A single-UAV system is:", "o": ["Always more capable than multi-UAV", "Immune to failure", "Simpler but can be limited by coverage, payload, energy or single-vehicle failure", "Free of constraints"], "a": 2, "w": "Single-UAV simplicity is offset by limits."}, {"q": "Multi-UAV systems:", "o": ["Are simpler to manage", "Can cooperate and cover larger areas, but coordination/topology management are more complex", "Cannot cooperate", "Have no topology"], "a": 1, "w": "Larger coverage with more complex coordination."}, {"q": "High UAV mobility causes:", "o": ["Static links", "Zero energy use", "Frequent change of links and network topology", "No routing need"], "a": 2, "w": "Mobility changes links and topology frequently."}, {"q": "Which is a challenge listed for UAV networks?", "o": ["Trajectory planning", "Link stability", "Fault tolerance", "All of the above"], "a": 3, "w": "Energy, trajectory planning, link stability, routing, coordination, fault tolerance and time-critical communication are all listed."}, {"q": "A UAV acting as a data mule:", "o": ["Is a sink on the ground", "Carries or relays data between terrestrial WSNs/VANETs and infrastructure", "Never communicates", "Only measures wind"], "a": 1, "w": "UAVs can act as data mules/gateways."}, {"q": "The lecture notes that layered gateway arrangements may be:", "o": ["Faster than direct relay", "Ideal for all cases", "Required by law", "Unsuitable for time-critical relaying in some cases"], "a": 3, "w": "Layered gateways can be unsuitable for time-critical relaying."}]}, {"title": "9. Machine-to-Machine (M2M) communication", "summary": "M2M is communication among machines/devices with minimal or no human intervention. Components: sensing/actuating devices, communication network, gateways, service platforms and applications. Design concerns: energy efficiency, fault tolerance, scalability, service integration and reliable delivery.", "qs": [{"q": "M2M communication involves:", "o": ["Constant human intervention", "Machines/devices communicating with minimal or no human intervention", "Only voice calls", "Only human-to-human chat"], "a": 1, "w": "This is the M2M definition."}, {"q": "Which is a typical component of an M2M ecosystem?", "o": ["Sensing/actuating devices", "Communication network and gateways", "Service platforms and applications", "All of the above"], "a": 3, "w": "All are listed M2M components."}, {"q": "Which is a design concern for M2M?", "o": ["Energy efficiency", "Fault tolerance", "Scalability and reliable data delivery", "All of the above"], "a": 3, "w": "These are listed concerns."}, {"q": "Exam trap: human-centric sensing vs M2M.", "o": ["They are identical", "M2M requires human operators", "Human-centric sensing is not the same as M2M, which minimises human intervention in the exchange", "Human-centric sensing has no humans"], "a": 2, "w": "The notes say human-centric sensing ≠ M2M."}]}, {"title": "10. Week 4 connections to remember", "summary": "Energy appears in tracking, OGDC, human-centric sensing, UAVs and M2M. Mobility changes links and makes topology maintenance harder. Data mules occur in mobile WSNs and UAV-based relaying. Coverage ≠ connectivity.", "qs": [{"q": "Mobility in sensor networks mainly:", "o": ["Changes links and makes topology maintenance harder", "Simplifies topology maintenance", "Eliminates energy use", "Removes sinks"], "a": 0, "w": "It's a recurring theme in Week 4."}, {"q": "Data mules occur in:", "o": ["Mobile WSNs and UAV-based relaying", "Only NFC", "Only RFID", "Only wired LANs"], "a": 0, "w": "The notes link data mules to mobile WSNs and UAV relaying."}, {"q": "Energy considerations appear in which of these Week 4 topics?", "o": ["Target tracking", "OGDC", "UAV and M2M", "All of the above"], "a": 3, "w": "Energy is a recurring concern across the week."}]}]}, {"title": "WEEK 5 — Interoperability, Arduino, Sensors and Actuators", "topics": [{"title": "1. Interoperability in IoT", "summary": "IoT systems are heterogeneous (different hardware, OS, protocols, data formats, interfaces). Interoperability means distinct systems can exchange information and use it meaningfully together. Heterogeneity is the underlying problem; interoperability is the capability needed to overcome it.", "qs": [{"q": "Why is interoperability needed in IoT?", "o": ["Because all devices are identical", "Because IoT systems are heterogeneous in hardware, OS, protocols, data formats and interfaces", "Because sensors are expensive", "Because networks never fail"], "a": 1, "w": "Heterogeneity creates the need for interoperability."}, {"q": "Interoperability means:", "o": ["Devices have identical colours", "Devices use the same battery", "Devices use the same vendor", "Distinct systems can exchange information and use it meaningfully together"], "a": 3, "w": "This is the definition given."}, {"q": "Exam cue: heterogeneity versus interoperability.", "o": ["Both are solutions", "Interoperability is the problem; heterogeneity is the solution", "Heterogeneity is the underlying problem; interoperability is the capability to overcome it", "Both are protocols"], "a": 2, "w": "The notes state this cue explicitly."}]}, {"title": "2. Types of interoperability and UMB", "summary": "User interoperability makes the overall system usable across differing services/devices. Device interoperability enables devices with different interfaces/protocols to communicate or cooperate. The Universal Middleware Bridge (UMB) is an approach to device interoperability using a middleware/bridge layer.", "qs": [{"q": "User interoperability concerns:", "o": ["Making the overall system usable across differing services/devices and addressing problems users face", "Only radio frequencies", "Only encryption", "Only IP addresses"], "a": 0, "w": "It focuses on the user experience."}, {"q": "Device interoperability concerns:", "o": ["Cloud pricing", "Colour schemes", "Billing", "Enabling devices with different interfaces/protocols to communicate or cooperate"], "a": 3, "w": "It is the technical interaction between devices."}, {"q": "UMB stands for:", "o": ["Unified Memory Bus", "User Messaging Broker", "Universal Middleware Bridge", "Ultra Mesh Backbone"], "a": 2, "w": "UMB = Universal Middleware Bridge."}, {"q": "UMB is presented as an approach to:", "o": ["Device interoperability", "Battery charging", "Cloud billing", "Sensor calibration"], "a": 0, "w": "A middleware/bridge layer mediates between incompatible device systems."}, {"q": "What does a middleware/bridge layer reduce?", "o": ["The need for every device to implement every other protocol directly", "The number of sensors", "The power supply", "The RAM of Arduino"], "a": 0, "w": "The bridge mediates between incompatible systems."}, {"q": "In scenario questions, the first thing to identify is whether the problem concerns:", "o": ["The price", "The user experience or the technical interaction between devices", "The country", "The device colour"], "a": 1, "w": "This distinguishes user vs device interoperability."}]}, {"title": "3. Arduino basics", "summary": "Arduino is an open-source programmable electronic board with a built-in microcontroller, supported by the Arduino IDE. It is inexpensive, suitable for prototyping, accepts analogue and digital inputs, provides outputs, and supports attached sensors and actuators.", "qs": [{"q": "Arduino is described as:", "o": ["A wireless protocol", "A cloud platform", "A proprietary operating system", "An open-source programmable electronic board with a built-in microcontroller"], "a": 3, "w": "This is the course definition."}, {"q": "Which is a stated feature of Arduino?", "o": ["Requires huge power", "Cannot accept inputs", "Runs full desktop OS", "Inexpensive, accessible and suitable for prototyping IoT devices"], "a": 3, "w": "Low cost and prototyping suitability are stated."}, {"q": "An Arduino can receive:", "o": ["No inputs", "Only digital inputs", "Both analogue and digital inputs", "Only analogue inputs"], "a": 2, "w": "It can receive analogue and digital inputs and provide outputs."}, {"q": "Arduino programs are written and uploaded using:", "o": ["FileZilla", "Matplotlib", "Mininet", "Arduino IDE"], "a": 3, "w": "The board is supported by the Arduino IDE."}]}, {"title": "4. Arduino sketch structure and core functions", "summary": "A sketch has setup() (runs once: configure pins/initialise) and loop() (repeats: read inputs and control outputs). Core functions: pinMode(), digitalWrite(), digitalRead(), analogRead(), delay(ms), and Serial functions.", "qs": [{"q": "Which function runs once at the start of an Arduino sketch?", "o": ["delay()", "setup()", "main()", "loop()"], "a": 1, "w": "setup() runs once for configuration."}, {"q": "Which function runs repeatedly?", "o": ["setup()", "begin()", "loop()", "pinMode()"], "a": 2, "w": "loop() repeats continuously."}, {"q": "pinMode(pin, OUTPUT) is used to:", "o": ["Read a pin", "Print to serial", "Configure a pin as input or output", "Delay execution"], "a": 2, "w": "pinMode configures a pin."}, {"q": "digitalWrite(pin, HIGH) does what?", "o": ["Sets a digital output to HIGH", "Pauses the program", "Reads a digital input", "Reads an analogue value"], "a": 0, "w": "digitalWrite sets a digital output state."}, {"q": "digitalRead(pin) is used to:", "o": ["Pause execution", "Configure the baud rate", "Read a digital input", "Write analogue values"], "a": 2, "w": "digitalRead reads a digital input."}, {"q": "analogRead(pin) reads:", "o": ["A text string", "A digital output", "A file", "An analogue input from an analogue input pin"], "a": 3, "w": "analogRead reads analogue pins."}, {"q": "delay(1000) pauses the program for:", "o": ["1000 seconds", "1 minute", "1000 microseconds", "1000 milliseconds (1 second)"], "a": 3, "w": "delay takes milliseconds."}, {"q": "Serial functions in Arduino are used to:", "o": ["Move servos", "Fragment packets", "Print information to the serial monitor", "Compress images"], "a": 2, "w": "Serial output goes to the serial monitor."}]}, {"title": "5. Blink logic", "summary": "Blink: configure the LED pin as OUTPUT in setup(); in loop(), set HIGH, delay, set LOW, delay. Since loop() repeats, the LED keeps blinking.", "qs": [{"q": "In the Blink program, the LED pin is configured as OUTPUT in:", "o": ["setup()", "loop()", "delay()", "main()"], "a": 0, "w": "Pin configuration belongs in setup()."}, {"q": "In Blink, the order inside loop() is:", "o": ["HIGH, delay, LOW, delay", "HIGH, HIGH, LOW, LOW", "LOW, HIGH, delay", "delay, delay, HIGH"], "a": 0, "w": "On, wait, off, wait."}, {"q": "Why does the LED continue to blink?", "o": ["delay() loops itself", "The LED has memory", "setup() repeats", "loop() repeats"], "a": 3, "w": "loop() runs repeatedly."}, {"q": "If both delay() calls in Blink are 500 ms, one full ON–OFF cycle lasts:", "o": ["500 ms", "250 ms", "2 s", "1000 ms"], "a": 3, "w": "500 ms ON + 500 ms OFF = 1000 ms."}]}, {"title": "6. Arduino programming concepts", "summary": "Operators (arithmetic, comparison, logical); control statements (if/else); loops (for, while); arrays (same-type values, index from 0); strings/characters; math library; random numbers (seeding affects sequence); interrupts (respond to an event without polling; ISRs should be short).", "qs": [{"q": "Which statement about arrays in C/C++ (Arduino) is correct?", "o": ["Indexing begins at 1", "Arrays cannot be indexed", "Arrays hold only strings", "Arrays store multiple values of the same declared type under one name; indexing begins at 0"], "a": 3, "w": "The notes state this explicitly."}, {"q": "For int a[3] = {10, 20, 30}; what is a[1]?", "o": ["10", "20", "Out of range", "30"], "a": 1, "w": "Indexing starts at 0, so a[1] is the second element."}, {"q": "Which control statements select actions based on conditions?", "o": ["pinMode and delay", "for and while", "if and else", "setup and loop"], "a": 2, "w": "if/else are control (branching) statements."}, {"q": "Which are loops in Arduino programming?", "o": ["setup, loop", "analogRead, digitalRead", "for, while", "if, else"], "a": 2, "w": "for and while repeat a block."}, {"q": "Operators in the notes include:", "o": ["Only logical", "Only bitwise", "Arithmetic, comparison and logical", "Only arithmetic"], "a": 2, "w": "These three types are named."}, {"q": "Seeding a random-number generator:", "o": ["Increases pin count", "Disables random numbers", "Affects the sequence generated", "Has no effect"], "a": 2, "w": "Seeding affects the sequence."}, {"q": "Interrupts allow the controller to:", "o": ["Ignore events", "Respond to an event without waiting for loop() to reach a polling check", "Increase delay", "Stop the board"], "a": 1, "w": "That is the purpose of interrupts."}, {"q": "Interrupt-service routines should be:", "o": ["Replaced by delay()", "Avoided always", "Kept short and handled carefully", "Long and complex"], "a": 2, "w": "The notes advise short ISRs."}]}, {"title": "7. Traffic-light example", "summary": "A traffic-control sketch applies pin configuration, digital outputs, delays and ordered control logic. In exam questions, trace the program sequentially and watch pin states and timing.", "qs": [{"q": "A traffic-light sketch mainly uses:", "o": ["Only servo motors", "Only analogue inputs", "Only Serial", "Pin configuration, digital outputs, delays and ordered logic"], "a": 3, "w": "These are the building blocks mentioned."}, {"q": "When answering a traffic-light tracing question, you should:", "o": ["Guess the output", "Skip setup()", "Ignore delays", "Trace sequentially, noting pin states and timing"], "a": 3, "w": "The notes advise sequential tracing."}]}, {"title": "8. Integrating sensors with Arduino", "summary": "The DHT family measures temperature and humidity. Integration: identify sensor pins, connect power/ground/data correctly, install the appropriate library, read values in a sketch. UNO vs Mega 2560: choose based on I/O needs. Sensor readings can fail; check the reading result.", "qs": [{"q": "The DHT sensor family measures:", "o": ["Temperature and humidity", "Pressure and pH", "Light and sound", "Distance and motion"], "a": 0, "w": "DHT = temperature and humidity."}, {"q": "A library in a sensor sketch:", "o": ["Is hardware", "Is the power supply", "Provides functions that simplify communication with a particular sensor", "Replaces the sensor"], "a": 2, "w": "Libraries simplify sensor communication."}, {"q": "Which sequence describes a typical sensor sketch?", "o": ["Include library, initialise sensor, request readings in loop", "Loop first, then setup", "Delay, then include library", "Request reading, include library, initialise sensor"], "a": 0, "w": "Include → initialise → read in main loop."}, {"q": "Why should code check the DHT reading result?", "o": ["Readings can fail or be invalid", "To increase delay", "To save pins", "Readings are always valid"], "a": 0, "w": "The notes warn against blindly treating every value as valid."}, {"q": "Board selection between Arduino UNO and Mega 2560 depends on:", "o": ["Required I/O and project needs", "Board colour", "Only the IDE version", "Only price"], "a": 0, "w": "Mega 2560 offers more I/O; choose per project needs."}, {"q": "Correct sensor integration requires connecting:", "o": ["Only ground", "Only power", "Only data", "Power, ground and data correctly"], "a": 3, "w": "All three connections must be correct."}]}, {"title": "9. Actuators and servo motor", "summary": "An actuator converts a control signal into physical action (motors, mechanisms that move, switch or regulate). A servo motor provides controlled angular positioning. The Arduino Servo library attaches a servo to a pin and commands a position. Troubleshooting should distinguish code/library problems from wiring/power problems.", "qs": [{"q": "An actuator:", "o": ["Converts a control signal into physical action", "Routes packets", "Measures a physical condition", "Stores data"], "a": 0, "w": "This is the actuator definition."}, {"q": "A servo motor provides:", "o": ["Controlled angular positioning", "Temperature sensing", "Wireless networking", "Data storage"], "a": 0, "w": "Servo = controlled angular position."}, {"q": "In a Servo sketch, a typical sequence is:", "o": ["Only delay", "Attach the servo to a pin, then write a desired angle", "Only digitalRead", "Write angle, then attach servo"], "a": 1, "w": "Initialise/attach first, then command position."}, {"q": "If a servo does not move, a good troubleshooting approach is to:", "o": ["Distinguish code/library problems from wiring or power problems", "Assume the code is wrong always", "Replace the Arduino immediately", "Ignore wiring"], "a": 0, "w": "Wiring and power matter as much as code."}]}, {"title": "10. Week 5 quick comparison", "summary": "Sensor measures; actuator acts; setup() runs once; loop() repeats; digitalWrite() sets a digital output; analogRead() reads an analogue input; a library is reusable code; interoperability = different systems exchange and use information meaningfully.", "qs": [{"q": "Which pairing is correct?", "o": ["setup() → once; loop() → repeats", "analogRead() → sets digital output; digitalWrite() → reads analogue", "setup() → repeats; loop() → once", "Sensor → acts physically; actuator → measures"], "a": 0, "w": "setup() runs once; loop() repeats."}, {"q": "A library is best described as:", "o": ["A network cable", "Reusable code that simplifies device/sensor control", "A building", "A power module"], "a": 1, "w": "Libraries provide reusable code interfaces."}]}]}, {"title": "WEEK 6 — Python Programming and Raspberry Pi", "topics": [{"title": "1. Python fundamentals", "summary": "Python is used for readable, practical programming with files, networking and Raspberry Pi IoT applications. Essentials: print(), indentation (defines blocks), data types (int, float, str, bool, collections), conditionals (if/elif/else), loops (for/while), functions (def, return), scope, modules (import), exceptions (try/except).", "qs": [{"q": "In Python, code blocks are defined by:", "o": ["begin/end keywords", "Semicolons", "Indentation", "Curly braces"], "a": 2, "w": "Indentation defines blocks; wrong indentation causes errors or changes logic."}, {"q": "Which function displays output in Python?", "o": ["write()", "print()", "show()", "echo()"], "a": 1, "w": "print() displays output."}, {"q": "Which keyword begins a function definition?", "o": ["def", "func", "function", "lambda only"], "a": 0, "w": "Functions are defined with def."}, {"q": "`return` in a function:", "o": ["Ends the program", "Prints a value", "Imports a module", "Sends a result back to the caller"], "a": 3, "w": "return sends a result back."}, {"q": "Which are Python conditionals?", "o": ["def, return", "for, while", "if, elif, else", "try, except"], "a": 2, "w": "Conditionals are if/elif/else."}, {"q": "Which are Python loops?", "o": ["def, import", "for, while", "if, else", "try, except"], "a": 1, "w": "for and while are loops."}, {"q": "What does `import` do?", "o": ["Deletes a variable", "Opens a socket", "Loads reusable code from a module", "Defines a function"], "a": 2, "w": "Modules are reusable code imported with import."}, {"q": "try/except is used for:", "o": ["Handling runtime errors more gracefully", "Looping", "Defining variables", "Importing"], "a": 0, "w": "Exception handling."}, {"q": "Local variables belong to:", "o": ["Every program", "A function/block context", "Module level", "The operating system"], "a": 1, "w": "Local scope is function/block level; globals are module-level."}, {"q": "What is the output of `for i in range(3): print(i)`?", "o": ["1 2 3", "0 1 2", "0 1 2 3", "3 2 1"], "a": 1, "w": "range(3) yields 0, 1, 2."}]}, {"title": "2. Code-reading tips and prime-number example", "summary": "Track variable values line by line; check indentation and loop boundaries; distinguish = (assignment) from == (comparison); check whether a function prints or returns. The prime-number example uses loops, conditions and divisibility tests.", "qs": [{"q": "In Python, `=` is used for:", "o": ["Loop", "Comparison", "Import", "Assignment"], "a": 3, "w": "= assigns; == compares."}, {"q": "`==` is used for:", "o": ["Importing", "Comparison", "Defining functions", "Assignment"], "a": 1, "w": "== tests equality."}, {"q": "A function that prints a value but has no return statement returns:", "o": ["0", "The printed value", "None", "An error always"], "a": 2, "w": "Printing is not returning; the function returns None by default."}, {"q": "A prime-number check mainly uses:", "o": ["Servo motors", "Sockets", "Loops, conditions and divisibility testing", "PIL"], "a": 2, "w": "These are the constructs of the prime example."}, {"q": "Which number is prime according to a divisibility test?", "o": ["9", "15", "21", "13"], "a": 3, "w": "13 is divisible only by 1 and itself."}]}, {"title": "3. Files and CSV", "summary": "open() opens a file (read/write modes); read methods retrieve content; write methods send content; close files when done; writing can replace or append depending on mode. CSV = Comma-Separated Values for tabular data (rows = records, fields separated by commas).", "qs": [{"q": "Which function opens a file in Python?", "o": ["file()", "open()", "read()", "load()"], "a": 1, "w": "open() opens files."}, {"q": "Why does file mode selection matter?", "o": ["Writing can replace or append content depending on the mode", "It has no effect", "It controls the CPU", "It changes file colour"], "a": 0, "w": "Mode determines read/write/append behaviour."}, {"q": "CSV stands for:", "o": ["Code Standard Version", "Character Sequence Variable", "Comma-Separated Values", "Computer Stored Values"], "a": 2, "w": "CSV = Comma-Separated Values."}, {"q": "In a CSV file, each row represents:", "o": ["A record", "A file", "A column", "A socket"], "a": 0, "w": "Rows are records; fields are separated by commas."}, {"q": "CSV is useful in IoT for storing:", "o": ["Network cables", "Sensor readings such as timestamps, temperature and humidity", "Images only", "Binary firmware"], "a": 1, "w": "It stores tabular sensor data."}, {"q": "It is good practice to:", "o": ["Leave files open", "Never close files", "Close files when finished (structured approaches help ensure this)", "Delete files after opening"], "a": 2, "w": "The notes advise closing files."}]}, {"title": "4. Images with PIL and sockets", "summary": "PIL/Pillow supports opening, processing and saving images. A socket is an endpoint for network communication, usually using an IP address and port. The client sends/requests data; the server waits for and handles communication. TCP is connection-oriented; UDP sends datagrams without the same reliable stream connection.", "qs": [{"q": "PIL/Pillow is used for:", "o": ["Plotting graphs", "Controlling servos", "Networking", "Opening, processing and saving images"], "a": 3, "w": "It is Python's imaging library."}, {"q": "A socket is:", "o": ["A type of sensor", "A file format", "An endpoint used by programs to communicate over a network", "A servo accessory"], "a": 2, "w": "This is the definition."}, {"q": "Socket communication commonly uses:", "o": ["A MAC address only", "An IP address and port", "A URL only", "A CSV file"], "a": 1, "w": "IP address and port identify the endpoint."}, {"q": "The server in a client–server socket program:", "o": ["Is a sensor", "Always initiates requests", "Waits for and handles client communication", "Does nothing"], "a": 2, "w": "Clients request; the server waits/handles."}, {"q": "TCP is:", "o": ["A modulation", "Connectionless", "Connection-oriented", "A link layer"], "a": 2, "w": "TCP is connection-oriented; UDP sends datagrams."}]}, {"title": "5. Raspberry Pi basics", "summary": "Raspberry Pi is a small single-board computer that runs an OS and general-purpose programs. It provides GPIO pins for electronics. Setup: prepare storage/OS, boot, connect peripherals/network, find IP, optionally access remotely. Raspberry Pi OS is the OS in the guide. Uses: sensors, camera, networking, automation, data processing.", "qs": [{"q": "Raspberry Pi is:", "o": ["A cloud service", "A small single-board computer that can run an OS", "A microcontroller without OS", "A wireless protocol"], "a": 1, "w": "It is a single-board computer."}, {"q": "GPIO stands for:", "o": ["Global Packet Interface Option", "Generic Peripheral IP Output", "General-Purpose Input/Output", "General Protocol Input Operator"], "a": 2, "w": "GPIO = General-Purpose Input/Output."}, {"q": "The Raspberry Pi OS is:", "o": ["An IDE for Arduino", "A sensor", "A relay", "The operating system setup described in the guide"], "a": 3, "w": "The guide uses Raspberry Pi OS."}, {"q": "Which is NOT a common Raspberry Pi use listed?", "o": ["Automation", "Fabricating silicon wafers", "Camera projects", "Sensor acquisition"], "a": 1, "w": "Sensor acquisition, camera, networking, automation and data processing are listed."}, {"q": "After booting a Raspberry Pi, a user finds its IP address to:", "o": ["Overclock it", "Charge it", "Access it over the network/remotely", "Format it"], "a": 2, "w": "The IP lets you access it remotely."}]}, {"title": "6. Arduino versus Raspberry Pi", "summary": "Arduino: microcontroller board running a sketch directly, suited to simple real-time control, limited resources. Raspberry Pi: single-board computer running an OS and applications, suited to networking, storage and richer software, with more compute and memory.", "qs": [{"q": "Arduino is a:", "o": ["Cloud service", "Single-board computer", "Microcontroller-based board", "Router"], "a": 2, "w": "Arduino = microcontroller board; Pi = single-board computer."}, {"q": "Which typically runs an operating system and applications?", "o": ["Neither", "Arduino", "Raspberry Pi", "Both always"], "a": 2, "w": "The Pi runs an OS; Arduino runs a sketch directly."}, {"q": "Which is a strong fit for simple real-time pin control?", "o": ["Raspberry Pi only", "Neither", "Cloud only", "Arduino"], "a": 3, "w": "Arduino suits simple real-time control."}, {"q": "Which has generally more compute and memory resources?", "o": ["Arduino", "Neither", "Raspberry Pi", "Equal"], "a": 2, "w": "The Pi has more resources."}]}, {"title": "7. Raspberry Pi projects: LED, FileZilla and PiCam", "summary": "Blink an LED: configure a GPIO pin as output, set high/low with delays, ensure correct wiring and library. FileZilla/FTP client transfers files. PiCam captures images from a camera attached to the Pi.", "qs": [{"q": "To blink an LED on a Raspberry Pi, the GPIO pin is first configured as:", "o": ["Serial", "Output", "Analogue", "Input"], "a": 1, "w": "Pin is set as output, then toggled high/low."}, {"q": "FileZilla in the lecture is used for:", "o": ["Transferring files (FTP client)", "Plotting", "Servo control", "Image capture"], "a": 0, "w": "FileZilla is an FTP client."}, {"q": "PiCam is used to:", "o": ["Transfer files", "Capture images with a camera attached to the Raspberry Pi", "Switch relays", "Measure temperature"], "a": 1, "w": "PiCam captures images."}, {"q": "A broad PiCam workflow is:", "o": ["Connect hardware, configure software/library, run capture command, save result", "Configure only", "Run capture, then connect hardware", "Save, connect, configure"], "a": 0, "w": "That is the stated order."}]}, {"title": "8. IoT implementation: auto-cooling system", "summary": "DHT measures temperature/humidity; Pi reads it; program compares with a threshold; a relay switches the fan/cooling device; the loop repeats. DHT = sensing, Pi program = decision, relay/fan = actuation. GPIO pins are not a substitute for a power driver for arbitrary loads.", "qs": [{"q": "In the auto-cooling system, the DHT sensor:", "o": ["Supplies temperature/humidity readings", "Switches the fan", "Makes the decision", "Powers the Pi"], "a": 0, "w": "DHT = sensing."}, {"q": "The decision step (threshold comparison) is performed by:", "o": ["The fan", "The program on the Raspberry Pi", "The relay", "The DHT"], "a": 1, "w": "The Pi program compares and decides."}, {"q": "The relay in the system:", "o": ["Is an electrically controlled switch letting a low-power control circuit switch the fan circuit", "Measures temperature", "Captures images", "Stores data"], "a": 0, "w": "Relay = low-power control switching another circuit."}, {"q": "If temperature rises above the threshold, the program should:", "o": ["Do nothing forever", "Switch the fan ON via the relay", "Switch the fan OFF", "Shut down the Pi"], "a": 1, "w": "Above threshold → cool."}, {"q": "Why does the loop repeat?", "o": ["So the response follows changing temperature", "Because of the relay", "To fill memory", "To waste power"], "a": 0, "w": "The loop keeps the response current."}, {"q": "Why is a GPIO pin alone not enough to power arbitrary loads?", "o": ["GPIO pins are not a substitute for a power driver", "GPIO never works", "GPIO is wireless", "GPIO is analogue only"], "a": 0, "w": "Hardware wiring and power requirements matter; use a relay/driver."}, {"q": "In the system, the three roles are:", "o": ["Pi = sensing; DHT = decision; fan = relay", "DHT = actuation; relay = sensing; Pi = fan", "All three are sensors", "DHT = sensing; Pi program = decision; relay/fan = actuation"], "a": 3, "w": "This is the exam-focus distinction."}]}]}, {"title": "WEEK 7 — Raspberry Pi Networking and Software-Defined Networking", "topics": [{"title": "1. Remote data logging with Raspberry Pi (client–server model)", "summary": "A sensor-reading program on a Raspberry Pi collects DHT data; a client sends measurements across the network to a server that receives and displays/stores them. A socket is the communication endpoint; IP address and port identify where communication is directed.", "qs": [{"q": "In remote data logging, the Raspberry Pi client:", "o": ["Only plots graphs", "Only stores files", "Collects DHT data and sends measurements to a server", "Only routes packets"], "a": 2, "w": "The client reads the sensor and sends data across the network."}, {"q": "The server in the data-logging setup:", "o": ["Is a relay", "Receives and displays/stores the measurements", "Controls the DHT sensor", "Measures temperature"], "a": 1, "w": "The server receives and displays/stores data."}, {"q": "What identifies where communication is directed in socket programming?", "o": ["IP address and port", "Colour code", "File name", "Sensor ID only"], "a": 0, "w": "IP address and port identify the destination endpoint."}]}, {"title": "2. TCP versus UDP", "summary": "TCP: connection-oriented, uses connection establishment and a reliable ordered byte stream; server uses bind(), listen(), accept(); client uses connect(). UDP: connectionless datagrams, no guaranteed delivery/order; uses sendto()/recvfrom(); lightweight and useful when loss is tolerable or handled by the application. The sensor-data example uses UDP datagrams.", "qs": [{"q": "TCP is:", "o": ["Connection-oriented with a reliable, ordered byte stream", "Connectionless", "A routing protocol", "Unreliable by design"], "a": 0, "w": "TCP establishes a connection and provides reliable ordered delivery."}, {"q": "UDP is:", "o": ["A security protocol", "Connection-oriented", "A guarantee of order", "Connectionless, sending individual datagrams"], "a": 3, "w": "UDP sends datagrams without a connection."}, {"q": "Which socket calls are typical for a TCP server?", "o": ["bind(), listen() and accept()", "sendto() and recvfrom() only", "setup() and loop()", "print() and open()"], "a": 0, "w": "TCP server pattern: bind → listen → accept."}, {"q": "Which calls are typical in the UDP datagram pattern?", "o": ["connect() only", "close() only", "sendto() and recvfrom()", "listen() and accept()"], "a": 2, "w": "UDP datagram sockets use sendto/recvfrom."}, {"q": "A TCP client establishes its connection using:", "o": ["listen()", "connect()", "recvfrom()", "accept()"], "a": 1, "w": "The client calls connect(); the server accept()s."}, {"q": "UDP is useful when:", "o": ["Order must be guaranteed", "Reliable ordered delivery is mandatory", "A connection must be established first", "The application can tolerate loss or handle it itself"], "a": 3, "w": "UDP is lightweight; reliability is not provided by UDP itself."}, {"q": "The sensor-data example in the guide uses:", "o": ["TCP streams only", "UDP datagrams", "NFC", "Bluetooth"], "a": 1, "w": "The guide's sensor-data example uses UDP."}, {"q": "To answer socket questions correctly, you should be able to identify:", "o": ["The brand of the board", "The Pi's RAM", "The colour of the cable", "Which side sends, which receives, and which operations belong to which protocol"], "a": 3, "w": "The notes advise identifying sender/receiver roles and protocol-specific operations."}]}, {"title": "3. Data splitting and live plotting", "summary": "Text readings may need parsing before plotting. Python's split() separates a string by a delimiter; values must then be converted from strings to numbers. Matplotlib plots readings over time; a monitoring server receives, parses, updates stored series and refreshes a live graph.", "qs": [{"q": "Python's split() is used to:", "o": ["Write a file", "Open a socket", "Plot a graph", "Separate a string into pieces based on a delimiter"], "a": 3, "w": "split() separates fields by a delimiter."}, {"q": "Why must values be converted after splitting?", "o": ["It is optional always", "Strings plot better", "Text such as \"25.4\" is a string until converted to a numeric type", "Conversion deletes data"], "a": 2, "w": "Plotting needs numeric values."}, {"q": "Matplotlib is used to:", "o": ["Open sockets", "Compile C code", "Plot temperature/humidity or other readings over time", "Switch relays"], "a": 2, "w": "Matplotlib creates plots."}, {"q": "A delimiter mismatch in split() can cause:", "o": ["Incorrect fields", "Secure transfer", "Faster plots", "Lower latency"], "a": 0, "w": "Wrong delimiters give wrong parsing."}, {"q": "Which step order matches a live-monitoring server?", "o": ["Parse, plot, receive", "Refresh, receive, plot", "Plot, receive, parse", "Receive, parse, update stored series, refresh graph"], "a": 3, "w": "Data is received, parsed, stored, then graphed."}]}, {"title": "4. Software-Defined Networking (SDN) — core idea and planes", "summary": "Traditional networking couples control decisions with forwarding devices. SDN separates the control plane from the data plane, making network behaviour programmable. Data plane: forwards packets per installed rules. Control plane: decides paths/rules. Application plane: network applications express policy via controller-facing interfaces.", "qs": [{"q": "SDN separates:", "o": ["The control plane from the data plane", "LAN from WAN", "Hardware from software only", "Wired from wireless"], "a": 0, "w": "This is the core SDN idea."}, {"q": "The data plane:", "o": ["Stores flow statistics only", "Makes decisions about paths", "Forwards packets according to installed rules", "Hosts applications"], "a": 2, "w": "Data plane = forwarding."}, {"q": "The control plane:", "o": ["Is an application", "Forwards packets", "Is hardware only", "Makes decisions about paths and forwarding rules"], "a": 3, "w": "Control plane = decision-making."}, {"q": "The application plane:", "o": ["Is a physical layer", "Stores packets", "Forwards packets", "Has network applications expressing policy/requirements through controller-facing interfaces"], "a": 3, "w": "It expresses policy through APIs."}, {"q": "Why does SDN make network behaviour programmable?", "o": ["IPv6 is used", "Control decisions are made in software separate from forwarding devices", "Packets are encrypted", "Switches are removed"], "a": 1, "w": "Software-based control gives programmability."}]}, {"title": "5. Controller, OpenFlow and why SDN", "summary": "A logically central controller manages forwarding policy (deployment can be distributed). OpenFlow is the protocol enabling communication between controller and switches. A switch matches packet fields against flow-table entries and applies actions. Benefits: programmability, centralised view, flexible traffic management. Challenges: controller placement, scalability, reliability, latency.", "qs": [{"q": "OpenFlow is:", "o": ["A cloud platform", "A programming language", "A protocol enabling communication between controller and forwarding devices/switches", "A wireless modulation"], "a": 2, "w": "OpenFlow connects controller and switches."}, {"q": "A switch using OpenFlow:", "o": ["Writes Python code", "Routes only IPv6", "Matches packet fields against flow-table entries and applies actions", "Plots data"], "a": 2, "w": "Flow tables hold match-action entries."}, {"q": "The SDN controller is described as:", "o": ["A switch", "Physically central only", "Logically central, although deployment can be distributed", "Absent"], "a": 2, "w": "Logically central; physically may be distributed."}, {"q": "Which is NOT a listed SDN benefit?", "o": ["Network experimentation", "Eliminating all latency", "More flexible traffic management", "Programmability and centralised policy view"], "a": 1, "w": "Latency is a challenge, not eliminated."}, {"q": "Which is a listed SDN challenge?", "o": ["Controller placement", "Scalability", "Reliability and latency", "All of the above"], "a": 3, "w": "All are listed challenges."}, {"q": "Exam trap: in SDN,", "o": ["The data plane still forwards packets; the controller manages policy/rules", "All forwarding happens in the controller", "Switches are not needed", "The controller forwards each packet"], "a": 0, "w": "SDN does not move packet forwarding into the controller."}, {"q": "Rule placement means:", "o": ["Naming topics", "Choosing sensor positions", "Deciding where forwarding/processing rules should be installed", "Selecting a file name"], "a": 2, "w": "This is the definition in the notes."}]}, {"title": "6. SDN Part II: APIs, controller placement and rule placement", "summary": "APIs let applications/controllers and devices interact. Controller placement affects latency, resilience, scalability and overhead; controllers may be centralised or distributed (simpler global control vs scalability/fault tolerance). Rules may be placed at access devices (reducing delay near users) or in the backbone (managing large aggregates and inter-network flows).", "qs": [{"q": "Controller placement affects:", "o": ["Latency, resilience, scalability and communication overhead", "Only price", "Only colour", "Nothing"], "a": 0, "w": "These are the stated effects."}, {"q": "The trade-off between centralised and distributed controllers is:", "o": ["Simpler global control versus scalability/fault tolerance", "Cost versus sound", "Colour versus speed", "Weight versus size"], "a": 0, "w": "Centralised is simpler; distributed scales and tolerates faults better."}, {"q": "Rule placement at access devices may:", "o": ["Reduce delay near users/devices", "Increase backbone size", "Disable APIs", "Remove the controller"], "a": 0, "w": "Decisions near the edge cut delay."}, {"q": "Backbone rule placement can:", "o": ["Serve only one device", "Stop forwarding", "Manage large traffic aggregates and inter-network flows", "Remove SDN"], "a": 2, "w": "The backbone sees aggregated traffic."}, {"q": "Controller placement versus rule placement:", "o": ["They are the same decision", "Both concern sensors", "Only one exists", "They are distinct design decisions"], "a": 3, "w": "The quick-recall list says they are distinct."}]}, {"title": "7. SDN applications and tools", "summary": "Interference management in software-defined wireless/mobile networks; traffic offloading (shifting traffic to another path); mice flows (small/short) versus elephant flows (large/high-volume); anomaly detection; Mininet-WiFi (wireless SDN emulation); ONOS (SDN controller platform).", "qs": [{"q": "Mice flows are:", "o": ["Encrypted flows", "Small/short flows", "Large, high-volume flows", "Wireless flows"], "a": 1, "w": "Mice = small; elephants = large."}, {"q": "Elephant flows are:", "o": ["Small and short", "Control messages", "Anomalies", "Large/high-volume flows"], "a": 3, "w": "Elephant flows are large."}, {"q": "Traffic offloading means:", "o": ["Compressing headers", "Stopping traffic", "Shifting traffic to another access/network path when beneficial", "Encrypting traffic"], "a": 2, "w": "Offloading moves traffic to another path."}, {"q": "Mininet-WiFi is used for:", "o": ["Cloud billing", "Servo control", "Experimentation/emulation of wireless SDN", "Plotting"], "a": 2, "w": "It is the wireless SDN emulator named in the guide."}, {"q": "ONOS is:", "o": ["A wireless standard", "A sensor", "An SDN controller platform", "A cloud simulator"], "a": 2, "w": "ONOS is the controller platform mentioned."}, {"q": "Anomaly detection in SDN:", "o": ["Is an application of plots", "Observes network behaviour and uses programmable policy to respond", "Replaces switches", "Increases link loss"], "a": 1, "w": "Programmable policy lets the network respond to anomalies."}, {"q": "Interference management in SDN applies to:", "o": ["Only cables", "Only printers", "Only wired LANs", "Software-defined wireless/mobile networks"], "a": 3, "w": "It is a listed application in wireless/mobile networks."}]}, {"title": "8. Week 7 quick recall", "summary": "Pi sensor → client/socket → server; TCP reliable stream vs UDP datagram; split() parses text; numeric conversion for plotting; Matplotlib visualises; SDN separates control and data planes; OpenFlow supports controller–switch interaction; mice = small, elephants = large.", "qs": [{"q": "Which pairing is correct?", "o": ["UDP — reliable ordered stream", "OpenFlow — controller–switch interaction", "Matplotlib — packet forwarding", "SDN — merges control and data planes"], "a": 1, "w": "OpenFlow handles controller-to-switch communication."}, {"q": "Which is correct?", "o": ["TCP — datagrams; UDP — connection", "Both are connectionless", "Both are connection-oriented", "TCP — reliable stream; UDP — datagrams"], "a": 3, "w": "TCP = connection-oriented stream; UDP = datagrams."}]}]}, {"title": "WEEK 8 — Advanced SDN and Cloud Computing", "topics": [{"title": "1. Recent advances of SDN in IoT", "summary": "SDN is applied to mobile/wireless and IoT networking to make traffic control programmable. Traditional wireless mobile networks face changing topology, interference and shifting traffic demand; SDN can manage interference and offload traffic. Rule placement may be at access devices or in the backbone depending on latency, scale and traffic. Data centres distinguish mice and elephant flows; anomaly detection looks for deviations; Mininet-WiFi and ONOS are named tools.", "qs": [{"q": "Challenges of traditional wireless mobile networks include:", "o": ["Only battery shape", "Changing topology, interference and shifting traffic demand", "Only licensing", "Only physical cable damage"], "a": 1, "w": "These are listed challenges SDN helps address."}, {"q": "SDN-based control can help with:", "o": ["Removing wireless links", "Replacing sensors", "Fixing hardware", "Managing interference and offloading traffic based on network conditions"], "a": 3, "w": "It enables programmable interference management and offloading."}, {"q": "The best location for rule placement depends on:", "o": ["Brand", "Latency, scale and kind of traffic", "Colour", "Weather"], "a": 1, "w": "These factors determine access vs backbone placement."}, {"q": "Network anomaly detection looks for:", "o": ["Cable lengths", "Normal traffic only", "Sensor drift", "Traffic or behaviour deviating from expected patterns"], "a": 3, "w": "Deviations signal anomalies."}]}, {"title": "2. Cloud computing fundamentals: why cloud for IoT", "summary": "IoT generates data from many heterogeneous devices and needs scalable storage, processing and analytics. Cloud computing offers shared resources provisioned as needed rather than requiring every organisation to own all infrastructure.", "qs": [{"q": "Why is cloud useful for IoT?", "o": ["It needs no network", "It replaces actuators", "It removes all sensors", "It offers scalable storage, processing and analytics on shared, on-demand resources"], "a": 3, "w": "IoT data volumes need scalable shared resources."}, {"q": "Cloud resources are provisioned:", "o": ["As needed rather than requiring organisations to own all infrastructure", "Only physically", "Only once per decade", "Never"], "a": 0, "w": "On-demand provisioning is a key idea."}]}, {"title": "3. Five essential NIST characteristics of cloud", "summary": "(1) On-demand self-service; (2) broad network access; (3) resource pooling; (4) rapid elasticity; (5) measured service.", "qs": [{"q": "Which NIST characteristic means users provision resources when needed?", "o": ["On-demand self-service", "Measured service", "Rapid elasticity", "Resource pooling"], "a": 0, "w": "On-demand self-service = users provision resources themselves when needed."}, {"q": "Broad network access means:", "o": ["Services are accessible over networks through standard mechanisms", "Only LAN access", "Only wired access", "No access"], "a": 0, "w": "Standard network mechanisms provide access."}, {"q": "Resource pooling means:", "o": ["Provider resources serve multiple customers using a shared pool", "Resources are discarded", "Each customer has a separate hardware", "Only one customer"], "a": 0, "w": "Pooling shares provider resources among customers."}, {"q": "Rapid elasticity means:", "o": ["Capacity is fixed", "Services are slow", "Only scaling up", "Capacity can scale up/down quickly"], "a": 3, "w": "Capacity changes quickly with demand."}, {"q": "Measured service means:", "o": ["Resource use is monitored and can be billed/controlled", "Resources are free", "Only size is measured", "There is no billing"], "a": 0, "w": "Usage is metered for billing/control."}, {"q": "How many essential NIST cloud characteristics are listed?", "o": ["3", "4", "5", "6"], "a": 2, "w": "Five characteristics are listed."}]}, {"title": "4. Cloud benefits and deployment models", "summary": "Benefits: reduced upfront capital expenditure, usage-based costing, faster deployment/time-to-market, flexible availability, easier scaling. Public cloud: services offered to multiple customers over shared provider infrastructure. Private cloud: infrastructure dedicated to one organisation (greater control).", "qs": [{"q": "Which is a benefit of cloud listed in the guide?", "o": ["No scaling", "Reduced upfront capital expenditure", "Fixed capacity", "Zero running cost always"], "a": 1, "w": "Reduced capital expenditure and usage-based costing are listed."}, {"q": "A public cloud:", "o": ["Is on-premises only", "Has no provider", "Offers services to multiple customers over shared provider infrastructure", "Serves one organisation only"], "a": 2, "w": "Public clouds are multi-customer shared infrastructure."}, {"q": "A private cloud:", "o": ["Is shared with all", "Is open to all", "Is infrastructure dedicated to one organisation, with greater control as a motivation", "Has no control"], "a": 2, "w": "Private = dedicated, control-oriented."}]}, {"title": "5. Service models: IaaS, PaaS, SaaS", "summary": "IaaS: virtual machines, storage, networking; users manage OS and applications. PaaS: platform/runtime so developers build/deploy apps without managing the OS/infrastructure. SaaS: complete application managed by the provider. Shortcut: IaaS = rent infrastructure; PaaS = managed development platform; SaaS = finished application.", "qs": [{"q": "IaaS stands for:", "o": ["Infrastructure as a Service", "Intelligence as a Service", "Internet as a Service", "Integration as a Service"], "a": 0, "w": "IaaS = Infrastructure as a Service."}, {"q": "In IaaS, the user manages:", "o": ["The servers and networking", "Only the application", "The OS and applications above the infrastructure layer", "Nothing"], "a": 2, "w": "Provider manages virtualisation/servers/storage/networking."}, {"q": "PaaS provides:", "o": ["Raw hardware only", "Only storage", "A platform/runtime so developers can build and deploy applications without managing the underlying OS/infrastructure", "A complete finished application"], "a": 2, "w": "This is the PaaS definition."}, {"q": "SaaS provides:", "o": ["Raw VMs", "Only a runtime", "A complete application with the provider managing the stack", "Only networking"], "a": 2, "w": "SaaS = finished application."}, {"q": "Shortcut: IaaS = ?", "o": ["Use a finished application", "Rent infrastructure", "Buy a server", "Use a managed development platform"], "a": 1, "w": "IaaS = rent infrastructure."}, {"q": "Shortcut: SaaS = ?", "o": ["Use a development platform", "Use a finished application", "Own a data centre", "Rent infrastructure"], "a": 1, "w": "SaaS = use a finished application."}, {"q": "Who manages the application and data in IaaS?", "o": ["Neither", "Both fully", "Provider", "User"], "a": 3, "w": "In IaaS the user manages applications, data, runtime, middleware and OS."}, {"q": "Who manages the runtime, middleware and OS in PaaS?", "o": ["User", "The end user", "Provider", "Neither"], "a": 2, "w": "PaaS shifts runtime/middleware/OS to the provider; user manages applications and data."}, {"q": "In SaaS, who manages the application layer?", "o": ["A third party", "Nobody", "The provider", "The user"], "a": 2, "w": "SaaS is provider-managed end to end."}, {"q": "Who manages virtualisation, servers, storage and networking in IaaS?", "o": ["User", "Provider", "End user", "Developer"], "a": 1, "w": "The provider manages these in IaaS, PaaS and SaaS."}, {"q": "A customer wanting the most control and administration would choose:", "o": ["None", "SaaS", "IaaS", "PaaS"], "a": 2, "w": "IaaS offers the most customer control."}, {"q": "SaaS commonly features:", "o": ["User-managed OS", "No scalability", "Single-tenancy only", "Scalable service architecture, multi-tenancy and configurability, but less control over underlying implementation"], "a": 3, "w": "These are listed SaaS traits."}]}, {"title": "6. Cloud service management: SLA, accounting, billing and economics", "summary": "Service management delivers customer outcomes while controlling cost and risk. SLA = Service Level Agreement specifying service expectations/quality commitments. Accounting records resource usage; billing combines usage with prices and rules. Cloud is not automatically cheaper for every workload.", "qs": [{"q": "SLA stands for:", "o": ["Security Layer Architecture", "Server Logic Application", "Service Level Agreement", "Scalable Load Allocation"], "a": 2, "w": "SLA = Service Level Agreement."}, {"q": "An SLA specifies:", "o": ["Service expectations and quality commitments", "Only price", "Network cable lengths", "Only hardware"], "a": 0, "w": "It covers non-functional requirements and quality/utility/warranty."}, {"q": "Accounting in cloud service management:", "o": ["Sets prices", "Combines usage with prices", "Encrypts data", "Records resource usage"], "a": 3, "w": "Accounting = recording usage."}, {"q": "Billing:", "o": ["Provides security", "Combines usage records with prices and billing rules", "Records usage only", "Stores images"], "a": 1, "w": "Billing applies prices/r
