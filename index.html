"Tag + chip + antenna + radio-frequency reader\" is the exam clue for:","o":["ZigBee","CoAP","AMQP","RFID"],"a":3,"w":"These are RFID keywords."}]},{"title":"20. High-priority comparison tables (application protocols and connectivity)","summary":"MQTT: publish–subscribe; CoAP: request–response over UDP; XMPP: XML messaging/presence; AMQP: binary with exchanges/queues; SMQTT: secure MQTT. IEEE 802.15.4: PHY/MAC; ZigBee: network/higher layers; 6LoWPAN: IPv6 adaptation; LOADng: on-demand routing; RPL: LLN routing.","qs":[{"q":"Which protocol–model pair is correct?","o":["CoAP — publish–subscribe via broker","MQTT — request–response over UDP","AMQP — binary messaging with exchanges and queues","XMPP — binary exchanges and queues"],"a":2,"w":"AMQP uses exchanges, bindings and queues in a binary protocol."},{"q":"Which pair is correct?","o":["ZigBee — PHY/MAC","6LoWPAN — on-demand routing","IEEE 802.15.4 — PHY/MAC for low-rate WPAN","RPL — IPv6 header compression"],"a":2,"w":"802.15.4 defines PHY/MAC."},{"q":"Which technology adapts IPv6 for low-power WPANs?","o":["RPL","LOADng","6LoWPAN","ZigBee"],"a":2,"w":"6LoWPAN performs IPv6 adaptation (compression, fragmentation)."}]},{"title":"21. Full forms (quick memorisation sheet)","summary":"Important acronyms: IoT, M2M, ITU, RFID, AIDC, MQTT, SMQTT, CoAP, XMPP, AMQP, IEEE, WPAN, 6LoWPAN, LOADng, RPL, AODV, MAC, PHY, CSMA-CA, DSSS, BPSK, O-QPSK, ZDO, APS, FFD, RFD, LLN, RREQ, RREP, RERR, PIR.","qs":[{"q":"LOADng stands for:","o":["Layered Object Addressing and Dispatching","Low-power Optimised Ad hoc Network Gateway","Long-range On-demand Addressing next generation","Lightweight On-demand Ad hoc Distance-vector routing protocol – next generation"],"a":3,"w":"LOADng = Lightweight On-demand Ad hoc Distance-vector routing protocol – next generation."},{"q":"AODV stands for:","o":["Automatic On-demand Distance Vector","Advanced Optimised Data Vector","Ad Hoc On-Demand Distance Vector","Adaptive Open Distance Vector"],"a":2,"w":"AODV = Ad Hoc On-Demand Distance Vector."},{"q":"LLN stands for:","o":["Long-range LAN","Low-Latency Node","Low-Power and Lossy Network","Local Link Network"],"a":2,"w":"LLN = Low-Power and Lossy Network."},{"q":"AMQP stands for:","o":["Automated Message Query Protocol","Application Message Quality Protocol","Advanced Message Queuing Protocol","Advanced Multicast Queue Packet"],"a":2,"w":"AMQP = Advanced Message Queuing Protocol."},{"q":"IEEE stands for:","o":["Institute of Embedded and Electronic Equipment","Institute of Electrical and Electronics Engineers","International Electronics and Engineering Entity","Internet Engineering and Electrical Establishment"],"a":1,"w":"IEEE = Institute of Electrical and Electronics Engineers."},{"q":"MAC in IEEE 802.15.4 stands for:","o":["Message Authentication Chain","Machine Access Code","Medium Access Control","Multi-Area Controller"],"a":2,"w":"MAC = Medium Access Control."}]},{"title":"22. Numbers and lists to remember (Week 2)","summary":"IPv6 128 bits; 6LoWPAN extended address 64 bits; short address 16 bits; 802.15.4 range 10–75 m; duty cycle below 1%; AMQP frames 9; MQTT methods 5; LOADng messages 3; 6LoWPAN headers 3; ZigBee roles 3; ITU report 2005.","qs":[{"q":"Match correctly: number of ZigBee device roles = ?","o":["2","3","4","5"],"a":1,"w":"Coordinator, Router and End Device = 3."},{"q":"Which number is correctly matched?","o":["AMQP frame types = 9","LOADng route messages = 5","MQTT core methods = 9","6LoWPAN header types = 5"],"a":0,"w":"AMQP lists 9 frame types; MQTT 5 methods; LOADng 3 messages; 6LoWPAN 3 headers."}]}]},{"title":"WEEK 3 — Connectivity Technologies and Sensor Networks","topics":[{"title":"1. HART basics","summary":"HART (Highway Addressable Remote Transducer) is a hybrid analog-digital industrial automation protocol that bridges traditional 4–20 mA wiring with smart field-device communication. Wired HART lacks a network layer, whereas WirelessHART includes mesh networking and routing.","qs":[{"q":"HART stands for:","o":["Highway Addressable Remote Transducer","Highway Automated Routing Technology","High Availability Real-Time","Hybrid Analog Radio Transmission"],"a":0,"w":"HART = Highway Addressable Remote Transducer."},{"q":"HART is best described as a:","o":["Consumer audio protocol","Satellite link","Purely digital home-automation protocol","Hybrid analog-digital industrial protocol bridging 4–20 mA wiring and smart field devices"],"a":3,"w":"The notes describe it as hybrid analog-digital bridging 4–20 mA with smart device communication."},{"q":"What is the key distinction between wired HART and WirelessHART?","o":["Wired HART has mesh routing; WirelessHART does not","Wired HART lacks a network layer; WirelessHART includes mesh networking and routing","Both include mesh routing","Both lack a network layer"],"a":1,"w":"This is the key distinction stated in the supplied material."},{"q":"HART/WirelessHART are presented in the context of:","o":["Industrial field devices and the Industrial IoT (IIoT)","Social media apps","Smart toys","Consumer wearables"],"a":0,"w":"The course frames them for industrial field devices and IIoT."}]},{"title":"2. WirelessHART mechanisms","summary":"WirelessHART: 2.4 GHz ISM band, 15 channels, radio basis derived from IEEE 802.15.4; TDMA with a super-frame of 10 ms timeslots; channel hopping; channel blacklisting; mesh routing; a network manager coordinates schedules and routes.","qs":[{"q":"WirelessHART operates in the:","o":["Sub-GHz 865 MHz band","5.9 GHz band","13.56 MHz band","2.4 GHz ISM band"],"a":3,"w":"The slides place WirelessHART in the 2.4 GHz ISM band."},{"q":"How many channels does the guide describe for WirelessHART?","o":["15","8","79","3"],"a":0,"w":"The slides describe 15 channels."},{"q":"WirelessHART's radio basis is derived from:","o":["NFC","Bluetooth","IEEE 802.15.4","Ethernet"],"a":2,"w":"Its radio basis is derived from IEEE 802.15.4."},{"q":"TDMA in WirelessHART means:","o":["Devices use one fixed channel","Devices transmit in assigned time slots","Devices use CSMA","Devices compete at arbitrary times"],"a":1,"w":"TDMA = scheduled access in assigned slots."},{"q":"A super-frame in WirelessHART:","o":["Removes noisy channels","Groups time slots into a repeating schedule","Encrypts packets","Is a type of antenna"],"a":1,"w":"It groups timeslots (10 ms each in the guide) into a repeating schedule."},{"q":"The timeslot duration described in the guide is:","o":["10 ms","100 µs","1 s","1 min"],"a":0,"w":"The guide describes 10 ms timeslots."},{"q":"Channel hopping:","o":["Changes the channel used for successive transmissions to improve resilience to interference","Is the same as blacklisting","Removes persistently affected channels","Fixes one channel forever"],"a":0,"w":"Hopping changes the channel between transmissions."},{"q":"Channel blacklisting:","o":["Adds new nodes","Is the same as TDMA","Removes channels that are persistently affected by interference","Changes channel every transmission"],"a":2,"w":"Blacklisting excludes bad channels; do not confuse with hopping."},{"q":"The WirelessHART network manager:","o":["Coordinates the network including communication schedules and routes","Acts as a field sensor","Only stores sensor data","Is not part of the network"],"a":0,"w":"The manager coordinates schedules and routes."},{"q":"Mesh routing in WirelessHART lets nodes:","o":["Only transmit directly to the gateway","Avoid transmission","Forward packets for other nodes, extending reach and offering alternate paths","Use wired links only"],"a":2,"w":"Nodes forward packets for others, creating alternate paths."}]},{"title":"3. WirelessHART versus ZigBee (as framed in the course)","summary":"WirelessHART emphasises industrial field devices/IIoT with TDMA scheduled access and per-message channel hopping; ZigBee is commonly presented as consumer-oriented IoT with CSMA-family contention-based access (tree topology is discussed in the comparison).","qs":[{"q":"The medium-access approach of WirelessHART is:","o":["Polling by a broker","TDMA scheduled slots","CSMA contention","ALOHA"],"a":1,"w":"WirelessHART uses TDMA; ZigBee is CSMA-family."},{"q":"The medium-access approach framed for ZigBee in this comparison is:","o":["Token passing","FDMA only","CSMA-family contention-based access","TDMA scheduled slots"],"a":2,"w":"ZigBee is contention-based (CSMA-family)."},{"q":"Exam trap: TDMA versus CSMA.","o":["Both are contention-based","Both are scheduled","TDMA is scheduled access; CSMA is contention-based","TDMA is contention-based; CSMA is scheduled"],"a":2,"w":"The notes state TDMA = scheduled; CSMA = contention."},{"q":"Which statement about \"primary emphasis\" is correct?","o":["It indicates the main selection cue, not an exclusive use-case","A technology can be used only in its emphasised domain","It forbids other uses","It is a legal restriction"],"a":0,"w":"The notes say primary emphasis does not mean the technology can only be used in one domain."},{"q":"Which main selection cue goes with WirelessHART?","o":["Tap-to-pay","Predictable industrial communication","Audio streaming","Home lighting only"],"a":1,"w":"WirelessHART is chosen for predictable industrial communication."}]},{"title":"4. Near Field Communication (NFC)","summary":"NFC is a very short-range technology: 13.56 MHz, range under 20 cm, data rates 106/212/424 kbps, working by magnetic induction between nearby coils. Active devices generate their own RF field; passive tags use the reader's field. Modes: reader/writer, card emulation, peer-to-peer.","qs":[{"q":"NFC operates at:","o":["2.4 GHz","865.2 MHz","13.56 MHz","5.9 GHz"],"a":2,"w":"The course specifies 13.56 MHz."},{"q":"The NFC range is:","o":["Up to 100 m","10–75 m","Up to 1 km","Under 20 cm"],"a":3,"w":"NFC is very short-range, under 20 cm."},{"q":"NFC data rates are:","o":["1600 kbps","1, 2, 5 Mbps","106, 212 or 424 kbps","250 kbps only"],"a":2,"w":"The course lists 106, 212 and 424 kbps."},{"q":"The working principle of NFC is:","o":["Optical scanning","Magnetic induction between nearby coils","Infrared reflection","Ultrasonic echoes"],"a":1,"w":"NFC uses magnetic induction."},{"q":"A passive NFC tag/device:","o":["Can use the reader's field/energy to respond","Never communicates","Needs a battery always","Generates its own strong RF field"],"a":0,"w":"Passive devices draw on the reader's field."},{"q":"Active NFC devices:","o":["Generate their own RF field","Are optical devices","Rely entirely on the reader's energy","Cannot communicate"],"a":0,"w":"Active devices generate their own RF field."},{"q":"Which NFC mode reads from or writes to a tag?","o":["Beacon mode","Peer-to-peer mode","Card emulation mode","Reader/writer mode"],"a":3,"w":"Reader/writer mode reads/writes tags."},{"q":"In card emulation mode, an NFC device:","o":["Behaves like a contactless card","Acts as router","Exchanges info between two active devices","Writes tags"],"a":0,"w":"Card emulation = acts like a contactless card (e.g., tap-to-pay)."},{"q":"Peer-to-peer NFC mode:","o":["Is used only with passive tags","Emulates a card","Uses piconets","Allows two active devices to exchange information"],"a":3,"w":"P2P = two active devices exchange information."},{"q":"How many NFC operating modes are listed?","o":["2","3","4","5"],"a":1,"w":"Reader/writer, card emulation and peer-to-peer."},{"q":"Units in NFC: which is correct?","o":["cm = frequency; kbps = range","MHz = range; cm = data rate","kbps = frequency; MHz = range","MHz = frequency; kbps = data rate; cm = range"],"a":3,"w":"The \"Remember\" note maps units to frequency, data rate and range."}]},{"title":"5. Bluetooth connectivity","summary":"Bluetooth supports short-range PAN and wireless cable replacement, in the 2.4–2.485 GHz band with 1600 hops per second. Connection: inquiry/discovery → paging → connected state. Stack terms: L2CAP, RFCOMM, SDP. Piconet = one master + up to seven active slaves; scatternet = linked piconets.","qs":[{"q":"The Bluetooth band in the guide is:","o":["13.56 MHz","865.2 MHz","5850–5925 MHz","2.4–2.485 GHz"],"a":3,"w":"The guide places Bluetooth at 2.4–2.485 GHz."},{"q":"Bluetooth hopping rate in the described system is:","o":["10 hops per second","1600 hops per second","106 hops per second","15 hops per second"],"a":1,"w":"The notes state 1600 hops per second."},{"q":"Bluetooth range:","o":["Is always 100 m","Depends on radio class and transmission power","Is identical for all devices","Is under 20 cm"],"a":1,"w":"Do not assume every Bluetooth device has the same range."},{"q":"In Bluetooth connection setup, inquiry/discovery:","o":["Exchanges data","Finds nearby devices","Ends the session","Establishes contact with a discovered device"],"a":1,"w":"Inquiry = discovery."},{"q":"In Bluetooth connection setup, paging:","o":["Multiplexes data","Emulates serial cables","Establishes contact with a discovered device","Finds nearby devices"],"a":2,"w":"Paging = connection establishment."},{"q":"The correct Bluetooth connection sequence is:","o":["Paging → inquiry → connected","Inquiry → connected → paging","Inquiry → paging → connected","Connected → paging → inquiry"],"a":2,"w":"Discover, page, then connected state."},{"q":"L2CAP provides:","o":["Frequency hopping","Serial-cable emulation","Multiplexing and segmentation/reassembly of higher-layer data","Service discovery"],"a":2,"w":"L2CAP handles multiplexing and SAR."},{"q":"RFCOMM provides:","o":["Multiplexing and SAR","Service discovery","Serial-cable emulation","Piconet formation"],"a":2,"w":"RFCOMM = serial-cable emulation."},{"q":"SDP in the Bluetooth stack is:","o":["Serial Data Protocol","Secure Device Pairing","Service Discovery Protocol","Signal Distribution Process"],"a":2,"w":"SDP handles service discovery."},{"q":"A piconet in the supplied model consists of:","o":["Eight masters","Unlimited masters","Two masters and one slave","One master and up to seven active slaves"],"a":3,"w":"One master and up to seven active slaves."},{"q":"A scatternet is:","o":["A set of linked piconets using devices that participate across piconets","A single piconet","An NFC network","A ZigBee mesh"],"a":0,"w":"Scatternet links piconets."},{"q":"Bluetooth power-saving/operating modes:","o":["Reduce activity when a device does not need to communicate continuously","Increase activity continuously","Fix the range","Disable pairing"],"a":0,"w":"They reduce activity during idle periods."}]},{"title":"6. Z-Wave","summary":"Z-Wave focuses on home automation and low-power smart-home devices, using region-dependent sub-GHz frequencies (865.2 MHz for India). GFSK is the modulation (Gaussian filter + FSK); Manchester is the encoding. Home ID identifies a network; Node ID identifies a device. A primary controller manages the network; source routing and healing paths provide routing and recovery.","qs":[{"q":"Z-Wave is mainly associated with:","o":["Vehicle networks","Industrial plant networks","Home automation","Underwater networks"],"a":2,"w":"The notes associate Z-Wave with home automation."},{"q":"The Z-Wave frequency listed for India is:","o":["13.56 MHz","2.4 GHz","865.2 MHz","5.9 GHz"],"a":2,"w":"The course lists 865.2 MHz for India."},{"q":"GFSK stands for:","o":["Gated Frequency Switch Key","General Frequency Shift Keying","Generic Fast Shift Keying","Gaussian Frequency Shift Keying"],"a":3,"w":"GFSK = Gaussian FSK; a Gaussian filter smooths pulses before FSK."},{"q":"Manchester in Z-Wave is:","o":["A frame type","A modulation scheme","A line/channel encoding","A routing method"],"a":2,"w":"Manchester is encoding; GFSK is modulation."},{"q":"Home ID in Z-Wave identifies:","o":["A network","A single node","A controller type","A frequency band"],"a":0,"w":"Home ID = network identifier."},{"q":"Node ID in Z-Wave identifies:","o":["The modulation","A device/node within the network","The network","The region"],"a":1,"w":"Node ID = device within a network; Home ID ≠ Node ID."},{"q":"In Z-Wave source routing:","o":["Route information is selected at the source and included with the message","A broker routes packets","There is no routing","Routes are decided by each hop independently"],"a":0,"w":"The source selects the route and carries it in the message."},{"q":"Healing paths in Z-Wave:","o":["Store sensor data","Compress headers","Use alternate routes when a route or node fails","Disable devices"],"a":2,"w":"Healing = alternate routes on failure."},{"q":"The primary controller in Z-Wave helps:","o":["Measure humidity","Modulate light","Generate Gaussian filters","Manage the network"],"a":3,"w":"A primary controller manages the network."}]},{"title":"7. ISA100.11a","summary":"ISA100.11a is presented for industrial plant/complex networks, with physical/MAC foundations based on IEEE 802.15.4, frequency hopping, TDMA/QoS-related functions, security/key management, and support for integrating native and tunnelled/legacy protocols.","qs":[{"q":"ISA100.11a is associated with:","o":["Personal audio","Home lighting","Contactless payment","Industrial plant/complex networks"],"a":3,"w":"Z-Wave = home; ISA100.11a = industrial."},{"q":"ISA100.11a physical/MAC foundations are based on:","o":["IEEE 802.11p","IEEE 802.15.4","NFC","IEEE 802.3"],"a":1,"w":"The course describes 802.15.4-based foundations."},{"q":"Which feature is associated with ISA100.11a?","o":["Optical scanning","13.56 MHz induction","Manchester-only encoding","Frequency hopping, TDMA/QoS functions and security/key management"],"a":3,"w":"These are listed in the guide."},{"q":"ISA100.11a supports integration of:","o":["Only a single protocol","Different protocol types, including native and tunnelled/legacy applications","Only NFC tags","Only Bluetooth devices"],"a":1,"w":"It supports industrial architectures with mixed protocols."}]},{"title":"8. Wireless Sensor Networks: node and network model","summary":"A sensor node senses a phenomenon, processes the measurement, communicates it and operates under energy/hardware constraints. Single-hop: nodes send directly to the sink/gateway. Multi-hop: intermediate nodes relay. A sink node collects sensed data, often connected to a gateway or the Internet.","qs":[{"q":"In single-hop communication:","o":["Intermediate nodes relay packets","Nodes send directly to a sink/gateway","Nodes only talk to tags","No sink exists"],"a":1,"w":"Single-hop = direct to sink."},{"q":"In multi-hop communication:","o":["There is only one node","Intermediate nodes relay packets to extend reach","Nodes never relay","Nodes talk only to RFID readers"],"a":1,"w":"Multi-hop extends reach via relays."},{"q":"A sink node is:","o":["A malicious node","A faulty node","A collection destination for sensed data","A mobile node only"],"a":2,"w":"The sink collects data, often connected to a gateway/Internet."},{"q":"Sensor nodes generally:","o":["Cannot process data","Operate under energy and hardware constraints","Have unlimited energy","Cannot communicate"],"a":1,"w":"The notes emphasise energy and hardware constraints."}]},{"title":"9. WSN topology, constraints, QoS and Sensor Web","summary":"Topologies: star, tree, mesh. Deployments must consider scalability, energy, connectivity, reliability, delay and QoS (bandwidth, delay, jitter, packet-loss probability). Nodes may be stationary or mobile (mobility makes topology maintenance harder). The Sensor Web connects sensor networks, instruments, services, data resources and users.","qs":[{"q":"Which are common ways to organise WSN links?","o":["Only point-to-point","Ring, bus, star-of-stars only","Star, tree and mesh","Only bus"],"a":2,"w":"Star, tree and mesh are listed."},{"q":"Which is NOT a QoS dimension highlighted in the guide?","o":["Bandwidth","Packet-loss probability","Casing colour","Jitter"],"a":2,"w":"QoS dimensions: bandwidth, delay, jitter, packet-loss probability."},{"q":"Why do mobile nodes complicate WSNs?","o":["They stop interference","They make topology maintenance harder","They remove the need for routing","They increase battery life"],"a":1,"w":"Mobility changes links and makes topology maintenance harder."},{"q":"The Sensor Web is:","o":["A single WSN","A Bluetooth stack","A broader system connecting sensor networks, instruments, services, data resources and users","A type of antenna"],"a":2,"w":"It is broader than one WSN so observations can be discovered and used."}]},{"title":"10. Node behaviour and failures","summary":"Failed node: unable to perform its function. Selfish node: avoids forwarding because relaying consumes resources. Malicious node: intentionally disrupts or attacks operation. Temporary \"dumb\" behaviour: problems caused by environmental/temporary conditions, not automatically malicious.","qs":[{"q":"A failed node is one that:","o":["Intentionally attacks the network","Is unable to perform its intended function","Avoids forwarding to save energy","Is always a sink"],"a":1,"w":"Failure = inability to perform the function."},{"q":"A selfish node:","o":["Is a sink","May avoid forwarding because relaying consumes its resources/energy","Is a gateway","Always attacks"],"a":1,"w":"Selfishness is about conserving its own resources."},{"q":"A malicious node:","o":["Intentionally disrupts or attacks network operation","Is always mobile","Is a temporary fault only","Is merely tired"],"a":0,"w":"Malicious = intentional disruption."},{"q":"Temporary \"dumb\" behaviour should:","o":["Automatically be labelled malicious","Not automatically be labelled malicious","Always be labelled selfish","Be ignored forever"],"a":1,"w":"The lecture says environmental/temporary problems should not be assumed malicious."},{"q":"Network management in WSNs includes:","o":["Only billing","Only routing","Only security","Topology management, information/data management, cooperation and fault handling"],"a":3,"w":"These four are listed."}]},{"title":"11. WSN application cues","summary":"Social sensing: people or their devices contribute observations. Mines/industrial environments: monitoring and safety. WBAN (Wireless Body Area Network): physiological sensors communicate through a local processing/coordinator unit for healthcare.","qs":[{"q":"Social sensing involves:","o":["People or their devices contributing observations","Only fixed industrial sensors","Optical scanning only","Underwater acoustics"],"a":0,"w":"Social sensing uses human/device contributions."},{"q":"WBAN stands for:","o":["Wireless Body Area Network","Wireless Bluetooth Area Node","Wide Band Access Node","Wired Backbone Area Network"],"a":0,"w":"WBAN = Wireless Body Area Network."},{"q":"In a WBAN, physiological sensors communicate through:","o":["A cloud only","A hydraulic actuator","A satellite","A local processing/coordinator unit"],"a":3,"w":"They report via a local processing/coordinator unit for healthcare/body monitoring."},{"q":"In mines and industrial environments, WSNs support:","o":["Gaming","Image editing","Monitoring and safety","Marketing"],"a":2,"w":"Sensing supports monitoring and safety there."}]},{"title":"12. Week 3 quick-recall comparisons","summary":"WirelessHART: TDMA + super-frames + hopping + blacklisting + mesh. NFC: 13.56 MHz, under 20 cm, magnetic induction, 3 modes. Bluetooth: inquiry → paging → connection; piconet vs scatternet. Z-Wave: home automation, Home ID/Node ID, GFSK, Manchester, source routing. ISA100.11a: industrial, hopping, QoS, security.","qs":[{"q":"Which technology is associated with TDMA + super-frames + channel hopping + blacklisting + mesh?","o":["WirelessHART","NFC","Z-Wave","Bluetooth"],"a":0,"w":"These are WirelessHART's mechanisms."},{"q":"\"13.56 MHz, under 20 cm, magnetic induction\" refers to:","o":["Bluetooth","NFC","Z-Wave","ISA100.11a"],"a":1,"w":"These are NFC's defining specs."},{"q":"\"Home ID/Node ID, GFSK, Manchester, source routing\" refers to:","o":["Z-Wave","WirelessHART","Bluetooth","NFC"],"a":0,"w":"These are Z-Wave features."},{"q":"Which pair is correct?","o":["GFSK = encoding; Manchester = modulation","Inquiry = discovery; paging = connection establishment","Inquiry = connection establishment; paging = discovery","Piconet = linked piconets; scatternet = one network"],"a":1,"w":"Exam traps from Week 3 clarify these distinctions."}]}]},{"title":"WEEK 4 — Sensor-Network Applications, Coverage, Mobility, UAV and M2M","topics":[{"title":"1. Target tracking","summary":"A sensor network can detect and track a target using observations from multiple nodes. It may activate only relevant nodes or adjust duty cycles to conserve energy. Duty cycle is the fraction/pattern of time a node is active rather than asleep.","qs":[{"q":"In target tracking, sensor networks use:","o":["A single node always","Observations from multiple nodes to detect and track a target","Only satellites","Only RFID tags"],"a":1,"w":"Multiple nodes' observations are combined for tracking."},{"q":"Why may only relevant nodes be activated in tracking?","o":["To conserve energy","To raise latency","To disable the sink","To increase interference"],"a":0,"w":"Selective activation and duty-cycle adjustment save energy."},{"q":"Duty cycle is:","o":["The data rate","The fraction/pattern of time a node remains active rather than asleep","The node's address","The communication range"],"a":1,"w":"This is the definition given in the notes."},{"q":"How can event likelihood guide node activity?","o":["Only far nodes wake","Nodes near a likely target may need to be awake more often","Likelihood is irrelevant","All nodes must sleep"],"a":1,"w":"Nodes near the likely target need more activity."}]},{"title":"2. Agriculture, WMSNs, nanonetworks and UWASNs","summary":"Agriculture: distributed sensors monitor field conditions for irrigation/crop decisions. WMSNs extend sensing to multimedia (images/video) with larger data volumes. Nanonetworks involve communication among nanoscale devices. UWASNs commonly use acoustic links and face propagation delay, limited bandwidth, energy constraints and changing conditions.","qs":[{"q":"Benefits of sensors in agriculture include:","o":["No energy use","Localised observation and reduced need for manual inspection","Unlimited range","Removal of all farmers"],"a":1,"w":"The notes list localised observation and reduced manual inspection."},{"q":"Agricultural deployments must account for:","o":["Coverage, energy, communication reliability and environmental conditions","Only colour","Only fashion","Only price"],"a":0,"w":"These are the stated deployment considerations."},{"q":"WMSN stands for:","o":["Wireless Multimedia Sensor Network","Wireless Mobile Signal Network","Wired Multimedia Storage Node","Wide Mesh Sensor Node"],"a":0,"w":"WMSN = Wireless Multimedia Sensor Network."},{"q":"Compared with scalar sensing, WMSNs create:","o":["Smaller data volumes","No extra demands","No applications","Larger data volumes and greater bandwidth, processing, storage and energy demands"],"a":3,"w":"Images/video are heavy data."},{"q":"A typical WMSN application is:","o":["Sound-free monitoring only","Simple door switches","Surveillance and monitoring where visual context matters","Wired telephony"],"a":2,"w":"Surveillance is listed."},{"q":"Nanonetworks involve:","o":["Large planetary nodes","Communication among nanoscale devices with distinctive constraints","Only cellular towers","Only Wi-Fi"],"a":1,"w":"The exam focus is scale and communication challenges."},{"q":"Underwater networks in the course commonly use which link type?","o":["Optical fibre","Acoustic links","NFC","Infrared"],"a":1,"w":"The course discusses underwater acoustic sensor networks."},{"q":"Which is NOT a stated UWASN challenge?","o":["Propagation delay","Energy constraints","Limited bandwidth","Abundant bandwidth"],"a":3,"w":"UWASNs have limited bandwidth."},{"q":"UWASN stands for:","o":["Unmanned Wide-Area Sensor Node","Underwater Acoustic Sensor Network","Universal Wireless Area Sensor Net","Underground Wired Antenna System Network"],"a":1,"w":"UWASN = Underwater Acoustic Sensor Network."}]},{"title":"3. Coverage and connectivity","summary":"Coverage: whether the required area, targets or points are sensed. Connectivity: whether nodes can communicate with each other or reach the sink. Coverage ≠ connectivity. Turning nodes off to save energy must not create coverage holes or disconnect the network.","qs":[{"q":"Coverage in a WSN refers to:","o":["Data rate","Whether the required area/targets/points are sensed","Whether nodes can reach the sink","Battery capacity"],"a":1,"w":"Coverage = sensing completeness of area/targets."},{"q":"Connectivity refers to:","o":["Whether the area is sensed","Whether sensor nodes can communicate with each other or reach the sink","Whether nodes are cheap","Whether nodes are mobile"],"a":1,"w":"Connectivity is about communication paths."},{"q":"A network can cover an area but still fail to deliver readings if:","o":["Nodes are identical","Coverage is perfect","The sink is nearby","Connectivity is broken"],"a":3,"w":"Covered but disconnected nodes cannot deliver data."},{"q":"Which statement is correct?","o":["Coverage = connectivity","Connected nodes always cover everything","Coverage is irrelevant","Nodes can be connected yet leave parts of the area unsensed"],"a":3,"w":"The notes say coverage ≠ connectivity."},{"q":"Overlap between sensing regions can:","o":["Be harmful in every case","Always reduce coverage","Provide redundancy but waste energy if too many nodes stay active","Never matter"],"a":2,"w":"Redundancy helps reliability but costs energy."},{"q":"When switching nodes off to save energy, one must ensure:","o":["All nodes are mobile","The sink is switched off","No coverage hole or disconnection is created","Overlap is maximised"],"a":2,"w":"Coverage and connectivity must be considered together."},{"q":"Coverage planning weighs sensing completeness against:","o":["Paint colour","Brand names","IPv4 addresses","Node count, overlap and energy use"],"a":3,"w":"These trade-offs are stated."}]},{"title":"4. OGDC","summary":"Optimal Geographical Density Control (OGDC) manages which nodes remain active so that coverage and connectivity objectives are maintained with reduced energy use. Intuition: avoid keeping every node active when a smaller coordinated subset suffices.","qs":[{"q":"OGDC stands for:","o":["Overlapping Group Data Clustering","Open Gateway Data Collection","Optimised Gradient Distance Control","Optimal Geographical Density Control"],"a":3,"w":"OGDC = Optimal Geographical Density Control."},{"q":"The purpose of OGDC is to:","o":["Keep all nodes active","Increase node count","Maintain required coverage/connectivity with reduced energy by activating a coordinated subset","Maximise overlap"],"a":2,"w":"It conserves energy without sacrificing coverage/connectivity."},{"q":"The central trade-off in OGDC is:","o":["Speed versus colour","Energy conservation versus required coverage/connectivity","Range versus voltage","Cost versus brand"],"a":1,"w":"Save energy without losing coverage/connectivity."}]},{"title":"5. Stationary versus mobile WSNs","summary":"In a stationary WSN, nodes are fixed or mostly fixed and topology is relatively stable. In a Mobile Wireless Sensor Network (MWSN), sensors, sinks or data carriers may move, so links and neighbourhoods change. Mobility can improve reach or bring data to a collection point, but makes routing, localisation, coverage and topology maintenance more difficult.","qs":[{"q":"In a stationary WSN, the topology is:","o":["Undefined","Constantly changing","Relatively stable","Always a mesh of moving nodes"],"a":2,"w":"Nodes are fixed or mostly fixed, so topology is relatively stable."},{"q":"MWSN stands for:","o":["Mobile Wide-area Sensor Net","Mesh Wireless Signal Network","Mobile Wireless Sensor Network","Multi-hop Wired Sensor Node"],"a":2,"w":"MWSN = Mobile Wireless Sensor Network."},{"q":"In an MWSN, which elements may move?","o":["Only the sink","Nothing; only the data moves","Only the sensors","Sensors, sinks or data carriers"],"a":3,"w":"The notes say sensors, sinks or data carriers may move, so links and neighbourhoods change."},{"q":"Which is a benefit of mobility in sensor networks?","o":["It can improve reach or bring data to a collection point","It removes the need for routing","It makes topology maintenance easier","It eliminates energy use"],"a":0,"w":"Mobility can extend reach or carry data to the sink."},{"q":"Which of the following does mobility make MORE difficult?","o":["Routing","Localisation","Coverage and topology maintenance","All of the above"],"a":3,"w":"The notes list routing, localisation, coverage and topology maintenance."}]},{"title":"6. Human-centric and participatory sensing","summary":"Human-centric sensing: humans may be the sensing target, operator or source of data through personal devices. Participatory sensing: people voluntarily contribute data or observations, often using mobile devices. Consider data quality, participation, privacy and device/energy constraints.","qs":[{"q":"In human-centric sensing, humans may be the:","o":["Only the sink","Sensing target, operator or source of data via personal devices","Only the network administrators","Excluded from sensing"],"a":1,"w":"This is the definition given for human-centric sensing."},{"q":"Participatory sensing is when:","o":["Machines exchange data with no humans","Sensors are buried underground","UAVs fly automatically","People voluntarily contribute data or observations, often with mobile devices"],"a":3,"w":"Participation is voluntary and usually uses mobile devices."},{"q":"Which factor must be considered when interpreting human-centric or participatory sensing data?","o":["Data quality","Participation and privacy","Device/energy constraints","All of the above"],"a":3,"w":"The notes list data quality, participation, privacy and device/energy constraints."},{"q":"Exam trap: human-centric sensing versus M2M.","o":["Human-centric sensing intentionally involves humans; M2M aims for machine communication without a human in each exchange","Both avoid humans entirely","They are identical","M2M requires humans in every exchange"],"a":0,"w":"The notes state human-centric sensing ≠ M2M."}]},{"title":"7. Data mules and Delay-Tolerant Networks (DTNs)","summary":"A data mule physically moves through an area, collects data from sensor nodes and carries it to a gateway/sink. DTN (Delay-Tolerant Networking) supports communication when continuous end-to-end connectivity is unavailable: data is stored and forwarded when a suitable contact occurs. Useful in sparse, disconnected or mobile environments, but accepts delay.","qs":[{"q":"A data mule:","o":["Is a type of actuator","Only routes IPv6 packets","Physically moves through an area, collects data from sensor nodes and carries it to a gateway/sink","Is a fixed sink"],"a":2,"w":"Mules carry data physically between sensors and the sink."},{"q":"DTN stands for:","o":["Digital Transmission Node","Delay-Tolerant Networking","Distributed Topology Network","Data Transfer Notation"],"a":1,"w":"DTN = Delay-Tolerant Networking."},{"q":"DTN supports communication when:","o":["No data is produced","Continuous end-to-end connectivity is unavailable","Connectivity is perfect","Only wired links exist"],"a":1,"w":"Data are stored and forwarded when a suitable contact occurs."},{"q":"The DTN approach of storing data and forwarding it at a suitable contact is called:","o":["Flooding only","Store-and-forward","Broadcast storm","Beaconing"],"a":1,"w":"The notes describe data being stored and forwarded."},{"q":"What is the cost of using DTN or data mules?","o":["They cannot work in sparse networks","They need no storage","They accept delay","They require continuous connectivity"],"a":2,"w":"They suit sparse/disconnected environments but accept delay."}]},{"title":"8. UAV networks and FANETs","summary":"UAV networks use aerial platforms for sensing, relaying, coverage or communication. Single-UAV systems are simple but limited; multi-UAV systems cover more area but are harder to coordinate. FANET = Flying Ad Hoc Network. UAVs can act as data mules or gateways between terrestrial WSNs/VANETs and infrastructure.","qs":[{"q":"UAV stands for:","o":["Universal Antenna Vector","Unified Access Variable","Unmanned Aerial Vehicle","Underwater Acoustic Vehicle"],"a":2,"w":"UAV = Unmanned Aerial Vehicle."},{"q":"FANET stands for:","o":["Fast Access Node Entry Technology","Fixed Antenna Network","Fibre Area Network","Flying Ad Hoc Network"],"a":3,"w":"FANET = Flying Ad Hoc Network (an ad hoc network formed by UAVs)."},{"q":"A single-UAV system is:","o":["Always more capable than multi-UAV","Immune to failure","Simpler but can be limited by coverage, payload, energy or single-vehicle failure","Free of constraints"],"a":2,"w":"Single-UAV simplicity is offset by limits."},{"q":"Multi-UAV systems:","o":["Are simpler to manage","Can cooperate and cover larger areas, but coordination/topology management are more complex","Cannot cooperate","Have no topology"],"a":1,"w":"Larger coverage with more complex coordination."},{"q":"High UAV mobility causes:","o":["Static links","Zero energy use","Frequent change of links and network topology","No routing need"],"a":2,"w":"Mobility changes links and topology frequently."},{"q":"Which is a challenge listed for UAV networks?","o":["Trajectory planning","Link stability","Fault tolerance","All of the above"],"a":3,"w":"Energy, trajectory planning, link stability, routing, coordination, fault tolerance and time-critical communication are all listed."},{"q":"A UAV acting as a data mule:","o":["Is a sink on the ground","Carries or relays data between terrestrial WSNs/VANETs and infrastructure","Never communicates","Only measures wind"],"a":1,"w":"UAVs can act as data mules/gateways."},{"q":"The lecture notes that layered gateway arrangements may be:","o":["Faster than direct relay","Ideal for all cases","Required by law","Unsuitable for time-critical relaying in some cases"],"a":3,"w":"Layered gateways can be unsuitable for time-critical relaying."}]},{"title":"9. Machine-to-Machine (M2M) communication","summary":"M2M is communication among machines/devices with minimal or no human intervention. Components: sensing/actuating devices, communication network, gateways, service platforms and applications. Design concerns: energy efficiency, fault tolerance, scalability, service integration and reliable delivery.","qs":[{"q":"M2M communication involves:","o":["Constant human intervention","Machines/devices communicating with minimal or no human intervention","Only voice calls","Only human-to-human chat"],"a":1,"w":"This is the M2M definition."},{"q":"Which is a typical component of an M2M ecosystem?","o":["Sensing/actuating devices","Communication network and gateways","Service platforms and applications","All of the above"],"a":3,"w":"All are listed M2M components."},{"q":"Which is a design concern for M2M?","o":["Energy efficiency","Fault tolerance","Scalability and reliable data delivery","All of the above"],"a":3,"w":"These are listed concerns."},{"q":"Exam trap: human-centric sensing vs M2M.","o":["They are identical","M2M requires human operators","Human-centric sensing is not the same as M2M, which minimises human intervention in the exchange","Human-centric sensing has no humans"],"a":2,"w":"The notes say human-centric sensing ≠ M2M."}]},{"title":"10. Week 4 connections to remember","summary":"Energy appears in tracking, OGDC, human-centric sensing, UAVs and M2M. Mobility changes links and makes topology maintenance harder. Data mules occur in mobile WSNs and UAV-based relaying. Coverage ≠ connectivity.","qs":[{"q":"Mobility in sensor networks mainly:","o":["Changes links and makes topology maintenance harder","Simplifies topology maintenance","Eliminates energy use","Removes sinks"],"a":0,"w":"It's a recurring theme in Week 4."},{"q":"Data mules occur in:","o":["Mobile WSNs and UAV-based relaying","Only NFC","Only RFID","Only wired LANs"],"a":0,"w":"The notes link data mules to mobile WSNs and UAV relaying."},{"q":"Energy considerations appear in which of these Week 4 topics?","o":["Target tracking","OGDC","UAV and M2M","All of the above"],"a":3,"w":"Energy is a recurring concern across the week."}]},{"title":"Stationary vs Mobile WSN","summary":"In a stationary WSN, nodes are fixed or mostly fixed and the topology is relatively stable. In a Mobile Wireless Sensor Network (MWSN), sensors, sinks or data carriers may move, so links and neighbourhoods change.","qs":[{"q":"In a stationary WSN, the network topology is generally:","o":["Highly dynamic at all times","Created only by data mules","Relatively stable","Undefined until a sink moves"],"a":2,"w":"Nodes are fixed or mostly fixed, so the topology is relatively stable."},{"q":"In a Mobile Wireless Sensor Network (MWSN), which elements may move?","o":["Sensors, sinks or data carriers","Only the sink","Only the cloud servers","Only the base-station antenna mast"],"a":0,"w":"Notes state that sensors, sinks or data carriers may move, changing links and neighbourhoods."},{"q":"Which is a potential benefit of mobility in a WSN?","o":["A guaranteed permanently stable topology","Simpler localisation","No need for any routing","Improved reach or bringing data to a collection point"],"a":3,"w":"Mobility can improve reach or bring data to a collection point."},{"q":"Which set of functions becomes MORE difficult because of mobility?","o":["Only choosing the colour of the casing","Routing, localisation, coverage and topology maintenance","Only selecting connector types","Only writing the sensor datasheet"],"a":1,"w":"The notes list routing, localisation, coverage and topology maintenance as harder under mobility."}]},{"title":"Human-Centric and Participatory Sensing","summary":"Human-centric sensing: humans may be the sensing target, the operator or the source of data via personal devices. Participatory sensing: people voluntarily contribute data or observations, often using mobile devices.","qs":[{"q":"Which term describes systems in which humans may be the sensing target, operator or data source through personal devices?","o":["Machine-to-machine sensing","Human-centric sensing","Stationary WSN sensing","Delay-tolerant relaying"],"a":1,"w":"This is the definition of human-centric sensing."},{"q":"In participatory sensing, data are contributed by:","o":["Only fixed sensors with no human involvement","Only UAVs acting as gateways","Only cloud simulators","People who voluntarily share observations, often via mobile devices"],"a":3,"w":"Participatory sensing relies on voluntary human contribution."},{"q":"Which set of factors must be considered when interpreting human-centric / participatory sensing systems?","o":["Data quality, participation, privacy and device/energy constraints","Only bit-lengths and IP address classes","Only OpenFlow table size","Only servo torque ratings"],"a":0,"w":"The notes list data quality, participation, privacy and device/energy constraints."},{"q":"Which statement about participatory sensing is correct?","o":["Participation is always forced by the gateway","It never raises privacy concerns","Participation is voluntary and data quality can vary","It cannot use mobile devices"],"a":2,"w":"Voluntary participation brings data-quality and privacy considerations."}]},{"title":"Data Mules and Delay-Tolerant Networks (DTNs)","summary":"A data mule physically moves through an area, collects data from sensor nodes and carries it to a gateway/sink. A Delay-Tolerant Network (DTN) supports communication without continuous end-to-end connectivity by storing and forwarding data when a suitable contact occurs.","qs":[{"q":"What does a data mule do?","o":["Permanently routes data through a fixed multi-hop tree","Encrypts all packets at the sink","Converts analogue signals to digital signals","Physically moves, collects data from sensors and carries it to a gateway/sink"],"a":3,"w":"A data mule is a mobile data carrier that ferries data to a gateway/sink."},{"q":"How does a DTN deliver data when continuous end-to-end connectivity is unavailable?","o":["Store-and-forward when a suitable contact occurs","It drops all data until the link is permanent","It requires a persistent end-to-end TCP stream","It only works in fully connected networks"],"a":0,"w":"Data can be stored and forwarded at suitable contact opportunities."},{"q":"DTNs are most useful in which kinds of environments?","o":["Dense, always-connected wired LANs","Environments requiring zero delay","Sparse, disconnected or mobile environments","Only inside a single microcontroller"],"a":2,"w":"The notes say DTNs are useful in sparse, disconnected or mobile environments."},{"q":"What is the key trade-off of using a DTN / data mule?","o":["It accepts delay","It requires continuous connectivity","It guarantees real-time delivery","It removes the need for a gateway/sink"],"a":0,"w":"The notes explicitly state that DTN accepts delay."}]},{"title":"Exam Trap: Human-Centric Sensing vs M2M","summary":"Human-centric sensing intentionally involves humans in the sensing process. M2M communication aims for machine-to-machine exchange without a human needing to participate in each exchange.","qs":[{"q":"Which statement correctly distinguishes human-centric sensing from M2M?","o":["They are identical terms","M2M requires humans in every exchange; human-centric sensing does not involve humans","Human-centric sensing involves humans in the sensing process; M2M needs no human in each exchange","Human-centric sensing is only for UAVs; M2M is only for Arduino"],"a":2,"w":"Human-centric = humans intentionally involved; M2M = minimal or no human intervention."}]},{"title":"UAV Networks, Single vs Multi-UAV and FANET (Lecture 19)","summary":"A UAV (Unmanned Aerial Vehicle) network uses aerial platforms for sensing, relaying, coverage or communication. A FANET (Flying Ad Hoc Network) is an ad hoc network formed by UAVs.","qs":[{"q":"Which is a limitation of a single-UAV system?","o":["It is too complex to coordinate with other UAVs","It needs a complex multi-UAV topology manager","Limited coverage, payload, energy, or failure of that one vehicle","It always has larger coverage than multi-UAV"],"a":2,"w":"Single-UAV systems are simpler but limited by coverage, payload, energy or single-vehicle failure."},{"q":"Compared with single-UAV systems, multi-UAV systems:","o":["Can cooperate and cover larger areas but need more complex coordination and topology management","Are always simpler and never need coordination","Cover smaller areas","Have no topology changes"],"a":0,"w":"Multi-UAV systems cover more but add coordination/topology complexity."},{"q":"Why does the topology of a FANET change frequently?","o":["UAVs are fixed to the ground","The IP address length changes","Sensors have no radios","High mobility of the UAVs changes links"],"a":3,"w":"High mobility changes links and network topology frequently."},{"q":"Which is NOT listed among UAV/FANET challenges in the notes?","o":["Trajectory planning","Servo-motor gear ratio","Link stability","Fault tolerance and time-critical communication"],"a":1,"w":"Listed challenges: energy/power, trajectory planning, link stability, routing, coordination, fault tolerance, time-critical communication."},{"q":"UAVs can serve which roles between terrestrial networks and infrastructure?","o":["Only passive sensors on the ground","Data mules or gateways between WSNs/VANETs and infrastructure","Only DHT sensors","Only DNS servers"],"a":1,"w":"The notes state UAVs can act as data mules or gateways."},{"q":"What does the lecture note about layered gateway arrangements?","o":["They always guarantee minimum delay","They are required for every FANET","They replace the need for routing","They may be unsuitable for time-critical relaying in some cases"],"a":3,"w":"Layered gateway arrangements may be unsuitable for time-critical relaying."}]},{"title":"Machine-to-Machine (M2M) Communication (Lecture 20)","summary":"M2M is communication among machines/devices with minimal or no human intervention in the exchange. A typical M2M ecosystem includes sensing/actuating devices, a communication network, gateways, service platforms and applications.","qs":[{"q":"M2M communication is best described as communication:","o":["Among machines/devices with minimal or no human intervention","That always needs a human to approve each message","Only between humans and phones","Only between UAVs and clouds"],"a":0,"w":"M2M aims for exchange without a human per exchange."},{"q":"In M2M, low-power constrained nodes versus more capable/mobile nodes differ in:","o":["Nothing; they are identical","Only the colour of their casing","Only the brand of the gateway","Energy, processing and connectivity needs"],"a":3,"w":"Devices differ in capability, hence different energy, processing and connectivity needs."},{"q":"Which set lists M2M design concerns?","o":["Only font rendering and colour depth","Energy efficiency, fault tolerance, scalability, service integration, reliable data delivery","Only audio codecs","Only keyboard layout"],"a":1,"w":"These are the design concerns named in the notes."}]},{"title":"Week 4 Connections to Remember","summary":"Energy appears in tracking, OGDC, human-centric sensing, UAVs and M2M. Mobility changes links and makes topology maintenance harder. Data mules occur in mobile WSNs and UAV-based relaying. Coverage ≠ connectivity; human-centric sensing ≠ M2M.","qs":[{"q":"Which concern recurs across tracking, OGDC, human-centric sensing, UAVs and M2M?","o":["Energy","Font size","Pixel resolution","Page layout"],"a":0,"w":"The notes state energy appears in all of these topics."},{"q":"Data mules occur in which two contexts according to the notes?","o":["Only stationary WSNs and cloud billing","Only SDN and OpenFlow","Mobile WSNs and UAV-based relaying","Only Arduino and Raspberry Pi"],"a":2,"w":"Data mules appear in mobile WSNs and UAV-based relaying."},{"q":"Which pair is correctly stated as NOT equivalent?","o":["Coverage and connectivity","Sensor and sensing","Node and device","Packet and datagram"],"a":0,"w":"The notes remind that coverage ≠ connectivity."}]}]},{"title":"WEEK 5 — Interoperability, Arduino, Sensors and Actuators","topics":[{"title":"1. Interoperability in IoT","summary":"IoT systems are heterogeneous (different hardware, OS, protocols, data formats, interfaces). Interoperability means distinct systems can exchange information and use it meaningfully together. Heterogeneity is the underlying problem; interoperability is the capability needed to overcome it.","qs":[{"q":"Why is interoperability needed in IoT?","o":["Because all devices are identical","Because IoT systems are heterogeneous in hardware, OS, protocols, data formats and interfaces","Because sensors are expensive","Because networks never fail"],"a":1,"w":"Heterogeneity creates the need for interoperability."},{"q":"Interoperability means:","o":["Devices have identical colours","Devices use the same battery","Devices use the same vendor","Distinct systems can exchange information and use it meaningfully together"],"a":3,"w":"This is the definition given."},{"q":"Exam cue: heterogeneity versus interoperability.","o":["Both are solutions","Interoperability is the problem; heterogeneity is the solution","Heterogeneity is the underlying problem; interoperability is the capability to overcome it","Both are protocols"],"a":2,"w":"The notes state this cue explicitly."}]},{"title":"2. Types of interoperability and UMB","summary":"User interoperability makes the overall system usable across differing services/devices. Device interoperability enables devices with different interfaces/protocols to communicate or cooperate. The Universal Middleware Bridge (UMB) is an approach to device interoperability using a middleware/bridge layer.","qs":[{"q":"User interoperability concerns:","o":["Making the overall system usable across differing services/devices and ing system"],"a":1,"w":"Local scope is function/block level; globals are module-level."},{"q":"What is the output of `for i in range(3): print(i)`?","o":["1 2 3","0 1 2","0 1 2 3","3 2 1"],"a":1,"w":"range(3) yields 0, 1, 2."}]},{"title":"2. Code-reading tips and prime-number example","summary":"Track variable values line by line; check indentation and loop boundaries; distinguish = (assignment) from == (comparison); check whether a function prints or returns. The prime-number example uses loops, conditions and divisibility tests.","qs":[{"q":"In Python, `=` is used for:","o":["Loop","Comparison","Import","Assignment"],"a":3,"w":"= assigns; == compares."},{"q":"`==` is used for:","o":["Importing","Comparison","Defining functions","Assignment"],"a":1,"w":"== tests equality."},{"q":"A function that prints a value but has no return statement returns:","o":["0","The printed value","None","An error always"],"a":2,"w":"Printing is not returning; the function returns None by default."},{"q":"A prime-number check mainly uses:","o":["Servo motors","Sockets","Loops, conditions and divisibility testing","PIL"],"a":2,"w":"These are the constructs of the prime example."},{"q":"Which number is prime according to a divisibility test?","o":["9","15","21","13"],"a":3,"w":"13 is divisible only by 1 and itself."}]},{"title":"3. Files and CSV","summary":"open() opens a file (read/write modes); read methods retrieve content; write methods send content; close files when done; writing can replace or append depending on mode. CSV = Comma-Separated Values for tabular data (rows = records, fields separated by commas).","qs":[{"q":"Which function opens a file in Python?","o":["file()","open()","read()","load()"],"a":1,"w":"open() opens files."},{"q":"Why does file mode selection matter?","o":["Writing can replace or append content depending on the mode","It has no effect","It controls the CPU","It changes file colour"],"a":0,"w":"Mode determines read/write/append behaviour."},{"q":"CSV stands for:","o":["Code Standard Version","Character Sequence Variable","Comma-Separated Values","Computer Stored Values"],"a":2,"w":"CSV = Comma-Separated Values."},{"q":"In a CSV file, each row represents:","o":["A record","A file","A column","A socket"],"a":0,"w":"Rows are records; fields are separated by commas."},{"q":"CSV is useful in IoT for storing:","o":["Network cables","Sensor readings such as timestamps, temperature and humidity","Images only","Binary firmware"],"a":1,"w":"It stores tabular sensor data."},{"q":"It is good practice to:","o":["Leave files open","Never close files","Close files when finished (structured approaches help ensure this)","Delete files after opening"],"a":2,"w":"The notes advise closing files."}]},{"title":"4. Images with PIL and sockets","summary":"PIL/Pillow supports opening, processing and saving images. A socket is an endpoint for network communication, usually using an IP address and port. The client sends/requests data; the server waits for and handles communication. TCP is connection-oriented; UDP sends datagrams without the same reliable stream connection.","qs":[{"q":"PIL/Pillow is used for:","o":["Plotting graphs","Controlling servos","Networking","Opening, processing and saving images"],"a":3,"w":"It is Python's imaging library."},{"q":"A socket is:","o":["A type of sensor","A file format","An endpoint used by programs to communicate over a network","A servo accessory"],"a":2,"w":"This is the definition."},{"q":"Socket communication commonly uses:","o":["A MAC address only","An IP address and port","A URL only","A CSV file"],"a":1,"w":"IP address and port identify the endpoint."},{"q":"The server in a client–server socket program:","o":["Is a sensor","Always initiates requests","Waits for and handles client communication","Does nothing"],"a":2,"w":"Clients request; the server waits/handles."},{"q":"TCP is:","o":["A modulation","Connectionless","Connection-oriented","A link layer"],"a":2,"w":"TCP is connection-oriented; UDP sends datagrams."}]},{"title":"5. Raspberry Pi basics","summary":"Raspberry Pi is a small single-board computer that runs an OS and general-purpose programs. It provides GPIO pins for electronics. Setup: prepare storage/OS, boot, connect peripherals/network, find IP, optionally access remotely. Raspberry Pi OS is the OS in the guide. Uses: sensors, camera, networking, automation, data processing.","qs":[{"q":"Raspberry Pi is:","o":["A cloud service","A small single-board computer that can run an OS","A microcontroller without OS","A wireless protocol"],"a":1,"w":"It is a single-board computer."},{"q":"GPIO stands for:","o":["Global Packet Interface Option","Generic Peripheral IP Output","General-Purpose Input/Output","General Protocol Input Operator"],"a":2,"w":"GPIO = General-Purpose Input/Output."},{"q":"The Raspberry Pi OS is:","o":["An IDE for Arduino","A sensor","A relay","The operating system setup described in the guide"],"a":3,"w":"The guide uses Raspberry Pi OS."},{"q":"Which is NOT a common Raspberry Pi use listed?","o":["Automation","Fabricating silicon wafers","Camera projects","Sensor acquisition"],"a":1,"w":"Sensor acquisition, camera, networking, automation and data processing are listed."},{"q":"After booting a Raspberry Pi, a user finds its IP address to:","o":["Overclock it","Charge it","Access it over the network/remotely","Format it"],"a":2,"w":"The IP lets you access it remotely."}]},{"title":"6. Arduino versus Raspberry Pi","summary":"Arduino: microcontroller board running a sketch directly, suited to simple real-time control, limited resources. Raspberry Pi: single-board computer running an OS and applications, suited to networking, storage and richer software, with more compute and memory.","qs":[{"q":"Arduino is a:","o":["Cloud service","Single-board computer","Microcontroller-based board","Router"],"a":2,"w":"Arduino = microcontroller board; Pi = single-board computer."},{"q":"Which typically runs an operating system and applications?","o":[ :0,"w":"DHT = sensing."},{"q":"The decision step (threshold comparison) is performed by:","o":["The fan","The program on the Raspberry Pi","The relay","The DHT"],"a":1,"w":"The Pi program compares and decides."},{"q":"The relay in the system:","o":["Is an electrically controlled switch letting a low-power control circuit switch the fan circuit","Measures temperature","Captures images","Stores data"],"a":0,"w":"Relay = low-power control switching another circuit."},{"q":"If temperature rises above the threshold, the program should:","o":["Do nothing forever","Switch the fan ON via the relay","Switch the fan OFF","Shut down the Pi"],"a":1,"w":"Above threshold → cool."},{"q":"Why does the loop repeat?","o":["So the response follows changing temperature","Because of the relay","To fill memory","To waste power"],"a":0,"w":"The loop keeps the response current."},{"q":"Why is a GPIO pin alone not enough to power arbitrary loads?","o":["GPIO pins are not a substitute for a power driver","GPIO never works","GPIO is wireless","GPIO is analogue only"],"a":0,"w":"Hardware wiring and power requirements matter; use a relay/driver."},{"q":"In the system, the three roles are:","o":["Pi = sensing; DHT = decision; fan = relay","DHT = actuation; relay = sensing; Pi = fan","All three are sensors","DHT = sensing; Pi program = decision; relay/fan = actuation"],"a":3,"w":"This is the exam-focus distinction."}]},{"title":"Why Python? (Lecture 26)","summary":"The course uses Python for readable, practical programming and for working with files, networking and Raspberry Pi-based IoT applications.","qs":[{"q":"Why does the course use Python?","o":["It is the only language that runs on Arduino","It replaces the need for any hardware","It is readable and practical for files, networking and Raspberry Pi-based IoT work","It is used only for cloud billing"],"a":2,"w":"The notes cite readability and practicality for files, networking and Raspberry Pi IoT."}]},{"title":"Python Essentials: print(), I el."},{"q":"A variable that belongs to a function's context is:","o":["Local","Global","Static-global","Modular"],"a":0,"w":"Local variables belong to a function/block context."},{"q":"Which keyword imports a reusable module?","o":["include","require","import","load"],"a":2,"w":"Modules are imported with import."},{"q":"Which construct handles runtime errors more gracefully?","o":["try / except","if / else","for / while","def / return"],"a":0,"w":"try/except provides exception handling."},{"q":"What does the prime-number example illustrate?","o":["Socket programming","Cloud elasticity","Loops, conditions and testing divisibility","SDN rule placement"],"a":2,"w":"It illustrates loops, conditions and divisibility tests."}]},{"title":"Python Code-Reading Tips","summary":"Track variable values line by line, check indentation and loop boundaries, distinguish = (assignment) from == (comparison), and check whether a function prints a value or returns it.","qs":[{"q":"In Python, '=' versus '==' means:","o":["Comparison versus assignment","Assignment versus comparison","Both are comparison","Both are assignment"],"a":1,"w":"= assigns; == compares."},{"q":"A function that only prints a value differs from one that returns it because:","o":["They are always identical","Printing stores the value in a variable","Returning displays text on screen","Returning sends the value back to the caller, while printing only displays it"],"a":3,"w":"The notes ask you to check print vs return."},{"q":"A recommended code-reading technique is to:","o":["Skip loop bodies","Ignore indentation","Track variable values line by line","Read only the last line"],"a":2,"w":"Tracking values line by line is the first tip."}]},{"title":"File Operations in Python (Lecture 27)","summary":"open() opens a file in a mode such as read or write; read methods retrieve content, write methods send content to the file; files should be closed when finished. Write may replace or append depending on mode.","qs":[{"q":"Why does mode selection matter when writing a file?","o":["Mode only sets the font","Mode changes the file extension","Mode has no effect","Writing can replace or append content depending on the mode"],"a":3,"w":"The notes state that write may replace or append depending on mode."},{"q":"Good practice after file operations:","o":["Leave all files open","Close files when finished (structured approaches help ensure this)","Never read","Delete the file"],"a":1,"w":"Close files; structured approaches help guarantee closure."}]},{"title":"Images with PIL and Sockets","summary":"The Python Imaging Library/Pillow supports opening, processing and saving images. A socket is an endpoint for network communication, typically using an IP address and port; the client sends/requests data and the server waits for and handles it. TCP is connection-oriented; UDP sends datagrams.","qs":[{"q":"PIL/Pillow in Python is used for:","o":["Cloud billing","Plotting sockets","Opening, processing and saving images","Controlling relays"],"a":2,"w":"PIL/Pillow supports image open/process/save."},{"q":"Socket communication is usually identified by:","o":["A servo angle","An IP address and a port","A CSV header","A DHT library name"],"a":1,"w":"Communication often uses an IP address and port."},{"q":"In client–server communication, the server:","o":["Waits for and handles client communication","Only sends without receiving","Is the one that always connects first","Has no socket"],"a":0,"w":"The server waits for and handles client communication; the client sends/requests."},{"q":"Which protocol is connection-oriented?","o":["UDP","ICMP only","TCP","None"],"a":2,"w":"TCP is connection-oriented; UDP sends datagrams."}]},{"title":"Raspberry Pi Basics (Lecture 28)","summary":"Raspberry Pi is a small single-board computer that runs an operating system and general-purpose programs. It provides GPIO (General-Purpose Input/Output) pins for interfacing with electronics, and Raspberry Pi OS is the OS in the guide.","qs":[{"q":"Raspberry Pi is best described as:","o":["A small single-board computer","A bare microcontroller with no OS","A cloud service","An SDN controller"],"a":0,"w":"It is a compact computer that runs an OS."},{"q":"Which OS setup is described in the guide?","o":["Windows Server 2025","Raspberry Pi OS","OpenStack OS","ONOS OS"],"a":1,"w":"Raspberry Pi OS is the described OS setup."},{"q":"Which is a step in Raspberry Pi setup?","o":["Run ./stack.sh","Write an OpenFlow rule","Install CloudSim","Prepare storage/OS, boot, connect peripherals/network, find IP address and optionally access remotely"],"a":3,"w":"These are the setup steps listed."},{"q":"Which is a common use of Raspberry Pi?","o":["Only printing","Only cloud billing","Sensor acquisition, camera projects, networking, automation and data processing","Only audio mixing"],"a":2,"w":"The notes list these common uses."}]},{"title":"Arduino vs Raspberry Pi","summary":"Arduino is a microcontroller-based board that typically runs a sketch directly and suits simple real-time pin control; Raspberry Pi is a single-board computer running an OS with more compute and memory, handling networking, storage and richer software itself.","qs":[{"q":"What does Arduino typically run?","o":["An operating system and many applications","OpenStack","A hypervisor","A sketch directly"],"a":3,"w":"Arduino typically runs a sketch directly."},{"q":"Which board generally has more compute and memory resources?","o":["Arduino","Raspberry Pi","Both equal","Neither"],"a":1,"w":"Pi has generally more compute/memory resources."},{"q":"Which board is a strong fit for networking, storage and richer software?","o":["Arduino","Raspberry Pi","Servo motor","DHT sensor"],"a":1,"w":"The Pi can handle sensor collection and higher-level processing itself."},{"q":"Arduino is often paired with:","o":["Nothing at all","A cloud-only dashboard","A second Arduino only","An external system for higher-level processing"],"a":3,"w":"Because of limited resources, Arduino is often paired with an external system."}]},{"title":"Raspberry Pi Projects: LED, FileZilla and PiCam (Lecture 29)","summary":"Blinking an LED on the Pi: configure a GPIO pin as output, set high/low with a delay, ensure correct wiring and library. FileZilla/FTP client transfers files; PiCam captures images from an attached camera.","qs":[{"q":"To blink an LED on the Raspberry Pi, you first:","o":["Configure a GPIO pin as output","Configure it as a socket","Open a CSV file","Run unstack.sh"],"a":0,"w":"The first step is setting a GPIO pin as output."},{"q":"Which tool is shown for transferring files in the lecture?","o":["Matplotlib","ONOS","FileZilla / FTP client","Heat"],"a":2,"w":"FileZilla/FTP client is used for file transfer."},{"q":"Broad PiCam workflow:","o":["Create an OpenStack key pair","Connect hardware, configure software/library, run capture command, save the result","Write the OpenFlow table","Parse text with split()"],"a":1,"w":"This is the workflow in the notes."}]},{"title":"IoT Implementation: Auto-Cooling System (Lecture 30)","summary":"A DHT sensor measures temperature; the Raspberry Pi reads it and compares with a threshold; a relay switches the fan/cooling device; the loop repeats so the response tracks changing temperature.","qs":[{"q":"In the auto-cooling system, which component senses temperature?","o":["DHT sensor","Relay","Fan","FileZilla"],"a":0,"w":"The DHT sensor supplies temperature/humidity."},{"q":"Which component makes the decision?","o":["The relay","The fan","The program running on the Raspberry Pi","The DHT sensor"],"a":2,"w":"The Pi's program compares temperature with a threshold."},{"q":"What does the relay do?","o":["It is an electrically controlled switch that lets a low-power control circuit switch another circuit","It measures humidity","It captures images","It stores sensor logs"],"a":0,"w":"The relay switches the fan/cooling device."},{"q":"Why does the program run in a loop?","o":["To reduce threshold","To close the relay permanently","So the response follows changing temperature","To stop reading the sensor"],"a":2,"w":"The loop repeats so the system responds to changes."},{"q":"Which role distinction is correct?","o":["Sensing = relay; decision = fan; actuation = DHT","Sensing = DHT; decision = Pi program; actuation/switching = relay/fan","Sensing = fan; decision = relay; actuation = Pi","All roles are done by the relay"],"a":1,"w":"The notes ask you to separate sensing, decision and actuation."},{"q":"Which hardware caution is given?","o":["GPIO can directly power any load","Wiring never matters","Relays are unnecessary","GPIO pins are not a substitute for a power driver for arbitrary loads"],"a":3,"w":"GPIO pins should not directly drive arbitrary loads."}]}]},{"title":"WEEK 7 — Raspberry Pi Networking and Software-Defined Networking","topics":[{"title":"1. Remote data logging with Raspberry Pi (client–server model)","summary":"A sensor-reading program on a Raspberry Pi collects DHT data; a client sends measurements across the network to a server that receives and displays/stores them. A socket is the communication endpoint; IP address and port identify where communication is directed.","qs":[{"q":"In remote data logging, the Raspberry Pi client:","o":["Only plots graphs","Only stores files","Collects DHT data and sends measurements to a server","Only routes packets"],"a":2,"w":"The client reads the sensor and sends data across the network."},{"q":"The server in the data-logging setup:","o":["Is a relay","Receives and displays/stores the measurements","Controls the DHT sensor","Measures temperature"],"a":1,"w":"The server receives and displays/stores data."},{"q":"What identifies where communication is directed in socket programming?","o":["IP address and port","Colour code","File name","Sensor ID only"],"a":0,"w":"IP address and port identify the destination endpoint."}]},{"title":"2. TCP versus UDP","summary":"TCP: connection-oriented, uses connection establishment and a reliable ordered byte stream; server uses bind(), listen(), accept(); client uses connect(). UDP: connectionless datagrams, no guaranteed delivery/order; uses sendto()/recvfrom(); lightweight and useful when loss is tolerable or handled by the application. The sensor-data example uses UDP datagrams.","qs":[{"q":"TCP is:","o":["Connection-oriented with a reliable, ordered byte stream","Connectionless","A routing protocol","Unreliable by design"],"a":0,"w":"TCP establishes a connection and provides reliable ordered delivery."},{"q":"UDP is:","o":["A security protocol","Connection-oriented","A guarantee of order","Connectionless, sending individual datagrams"],"a":3,"w":"UDP sends datagrams without a connection."},{"q":"Which socket calls are typical for a TCP server?","o":["bind(), listen() and accept()","sendto() and recvfrom() only","setup() and loop()","print() and open()"],"a":0,"w":"TCP server pattern: bind → listen → accept."},{"q":"Which calls are typical in the UDP datagram pattern?","o":["connect() only","close() only","sendto() and recvfrom()","listen() and accept()"],"a":2,"w":"UDP datagram sockets use sendto/recvfrom."},{"q":"A TCP client establishes its connection using:","o":["listen()","connect()","recvfrom()","accept()"],"a":1,"w":"The client calls connect(); the server accept()s."},{"q":"UDP is useful when:","o":["Order must be guaranteed","Reliable ordered delivery is mandatory","A connection must be established first","The application can tolerate loss or handle it itself"],"a":3,"w":"UDP is lightweight; reliability is not provided by UDP itself."},{"q":"The sensor-data example in the guide uses:","o":["TCP streams only","UDP datagrams","NFC","Bluetooth"],"a":1,"w":"The guide's sensor-data example uses UDP."},{"q":"To answer socket questions correctly, you should be able to identify:","o":["The brand of the board","The Pi's RAM","The colour of the cable","Which side sends, which receives, and which operations belong to which protocol"],"a":3,"w":"The notes advise identifying sender/receiver roles and protocol-specific operations."}]},{"title":"3. Data splitting and live plotting","summary":"Text readings may need parsing before plotting. Python's split() separates a string by a delimiter; values must then be converted from strings to numbers. Matplotlib plots readings over time; a monitoring server receives, parses, updates stored series and refreshes a live graph.","qs":[{"q":"Python's split() is used to:","o":["Write a file","Open a socket","Plot a graph","Separate a string into pieces based on a delimiter"],"a":3,"w":"split() separates fields by a delimiter."},{"q":"Why must values be converted after splitting?","o":["It is optional always","Strings plot better","Text such as \"25.4\" is a string until converted to a numeric type","Conversion deletes data"],"a":2,"w":"Plotting needs numeric values."},{"q":"Matplotlib is used to:","o":["Open sockets","Compile C code","Plot temperature/humidity or other readings over time","Switch relays"],"a":2,"w":"Matplotlib creates plots."},{"q":"A delimiter mismatch in split() can cause:","o":["Incorrect fields","Secure transfer","Faster plots","Lower latency"],"a":0,"w":"Wrong delimiters give wrong parsing."},{"q":"Which step order matches a live-monitoring server?","o":["Parse, plot, receive","Refresh, receive, plot","Plot, receive, parse","Receive, parse, update stored series, refresh graph"],"a":3,"w":"Data is received, parsed, stored, then graphed."}]},{"title":"4. Software-Defined Networking (SDN) — core idea and planes","summary":"Traditional networking couples control decisions with forwarding devices. SDN separates the control plane from the data plane, making network behaviour programmable. Data plane: forwards packets per installed rules. Control plane: decides paths/rules. Application plane: network applications express policy via controller-facing interfaces.","qs":[{"q":"SDN separates:","o":["The control plane from the data plane","LAN from WAN","Hardware from software only","Wired from wireless"],"a":0,"w":"This is the core SDN idea."},{"q":"The data plane:","o":["Stores flow statistics only","Makes decisions about paths","Forwards packets according to installed rules","Hosts applications"],"a":2,"w":"Data plane = forwarding."},{"q":"The control plane:","o":["Is an application","Forwards packets","Is hardware only","Makes decisions about paths and forwarding rules"],"a":3,"w":"Control plane = decision-making."},{"q":"The application plane:","o":["Is a physical layer","Stores packets","Forwards packets","Has network applications expressing policy/requirements through controller-facing interfaces"],"a":3,"w":"It expresses policy through APIs."},{"q":"Why does SDN make network behaviour programmable?","o":["IPv6 is used","Control decisions are made in software separate from forwarding devices","Packets are encrypted","Switches are removed"],"a":1,"w":"Software-based control gives programmability."}]},{"title":"5. Controller, OpenFlow and why SDN","summary":"A logically central controller manages forwarding policy (deployment can be distributed). OpenFlow is the protocol enabling communication between controller and switches. A switch matches packet fields against flow-table entries and applies actions. Benefits: programmability, centralised view, flexible traffic management. Challenges: controller placement, scalability, reliability, latency.","qs":[{"q":"OpenFlow is:","o":["A cloud platform","A programming language","A protocol enabling communication between controller and forwarding devices/switches","A wireless modulation"],"a":2,"w":"OpenFlow connects controller and switches."},{"q":"A switch using OpenFlow:","o":["Writes Python code","Routes only IPv6","Matches packet fields against flow-table entries and applies actions","Plots data"],"a":2,"w":"Flow tables hold match-action entries."},{"q":"The SDN controller is described as:","o":["A switch","Physically central only","Logically central, although deployment can be distributed","Absent"],"a":2,"w":"Logically central; physically may be distributed."},{"q":"Which is NOT a listed SDN benefit?","o":["Network experimentation","Eliminating all latency","More flexible traffic management","Programmability and centralised policy view"],"a":1,"w":"Latency is a challenge, not eliminated."},{"q":"Which is a listed SDN challenge?","o":["Controller placement","Scalability","Reliability and latency","All of the above"],"a":3,"w":"All are listed challenges."},{"q":"Exam trap: in SDN,","o":["The data plane still forwards packets; the controller manages policy/rules","All forwarding happens in the controller","Switches are not needed","The controller forwards each packet"],"a":0,"w":"SDN does not move packet forwarding into the controller."},{"q":"Rule placement means:","o":["Naming topics","Choosing sensor positions","Deciding where forwarding/processing rules should be installed","Selecting a file name"],"a":2,"w":"This is the definition in the notes."}]},{"title":"6. SDN Part II: APIs, controller placement and rule placement","summary":"APIs let applications/controllers and devices interact. Controller placement affects latency, resilience, scalability and overhead; controllers may be centralised or distributed (simpler global control vs scalability/fault tolerance). Rules may be placed at access devices (reducing delay near users) or in the backbone (managing large aggregates and inter-network flows).","qs":[{"q":"Controller placement affects:","o":["Latency, resilience, scalability and communication overhead","Only price","Only colour","Nothing"],"a":0,"w":"These are the stated effects."},{"q":"The trade-off between centralised and distributed controllers is:","o":["Simpler global control versus scalability/fault tolerance","Cost versus sound","Colour versus speed","Weight versus size"],"a":0,"w":"Centralised is simpler; distributed scales and tolerates faults better."},{"q":"Rule placement at access devices may:","o":["Reduce delay near users/devices","Increase backbone size","Disable APIs","Remove the controller"],"a":0,"w":"Decisions near the edge cut delay."},{"q":"Backbone rule placement can:","o":["Serve only one device","Stop forwarding","Manage large traffic aggregates and inter-network flows","Remove SDN"],"a":2,"w":"The backbone sees aggregated traffic."},{"q":"Controller placement versus rule placement:","o":["They are the same decision","Both concern sensors","Only one exists","They are distinct design decisions"],"a":3,"w":"The quick-recall list says they are distinct."}]},{"title":"7. SDN applications and tools","summary":"Interference management in software-defined wireless/mobile networks; traffic offloading (shifting traffic to another path); mice flows (small/short) versus elephant flows (large/high-volume); anomaly detection; Mininet-WiFi (wireless SDN emulation); ONOS (SDN controller platform).","qs":[{"q":"Mice flows are:","o":["Encrypted flows","Small/short flows","Large, high-volume flows","Wireless flows"],"a":1,"w":"Mice = small; elephants = large."},{"q":"Elephant flows are:","o":["Small and short","Control messages","Anomalies","Large/high-volume flows"],"a":3,"w":"Elephant flows are large."},{"q":"Traffic offloading means:","o":["Compressing headers","Stopping traffic","Shifting traffic to another access/network path when beneficial","Encrypting traffic"],"a":2,"w":"Offloading moves traffic to another path."},{"q":"Mininet-WiFi is used for:","o":["Cloud billing","Servo control","Experimentation/emulation of wireless SDN","Plotting"],"a":2,"w":"It is the wireless SDN emulator named in the guide."},{"q":"ONOS is:","o":["A wireless standard","A sensor","An SDN controller platform","A cloud simulator"],"a":2,"w":"ONOS is the controller platform mentioned."},{"q":"Anomaly detection in SDN:","o":["Is an application of plots","Observes network behaviour and uses programmable policy to respond","Replaces switches","Increases link loss"],"a":1,"w":"Programmable poli
