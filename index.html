cy lets the network respond to anomalies."},{"q":"Interference management in SDN applies to:","o":["Only cables","Only printers","Only wired LANs","Software-defined wireless/mobile networks"],"a":3,"w":"It is a listed application in wireless/mobile networks."}]},{"title":"8. Week 7 quick recall","summary":"Pi sensor → client/socket → server; TCP reliable stream vs UDP datagram; split() parses text; numeric conversion for plotting; Matplotlib visualises; SDN separates control and data planes; OpenFlow supports controller–switch interaction; mice = small, elephants = large.","qs":[{"q":"Which pairing is correct?","o":["UDP — reliable ordered stream","OpenFlow — controller–switch interaction","Matplotlib — packet forwarding","SDN — merges control and data planes"],"a":1,"w":"OpenFlow handles controller-to-switch communication."},{"q":"Which is correct?","o":["TCP — datagrams; UDP — connection","Both are connectionless","Both are connection-oriented","TCP — reliable stream; UDP — datagrams"],"a":3,"w":"TCP = connection-oriented stream; UDP = datagrams."}]},{"title":"Remote Data Logging with Raspberry Pi: Client–Server Model (Lecture 31)","summary":"A sensor-reading program on the Pi collects DHT data; a client sends measurements across the network to a server that receives and displays/stores them. A socket is the endpoint; IP address and port identify where communication is directed.","qs":[{"q":"In remote data logging, the Pi program typically:","o":["Receives data from the DHT server","Runs OpenFlow","Reads DHT data and sends it via a client to a server","Provides cloud billing"],"a":2,"w":"A client sends measurements to a server that receives and stores/displays them."},{"q":"Where is communication directed in socket programming?","o":["To an IP address and port","To a servo angle","To a CSV column","To a GPIO header"],"a":0,"w":"The IP address and port identify the destination."}]},{"title":"TCP vs UDP (Lecture 31)","summary":"TCP is connection-oriented, uses connection establishment and provides a reliable ordered byte stream. UDP is connectionless; it sends individual datagrams and does not itself guarantee delivery or order.","qs":[{"q":"Which is connection-oriented?","o":["UDP","Both","Neither","TCP"],"a":3,"w":"TCP is connection-oriented."},{"q":"In the notes, which socket calls are associated with the TCP server pattern?","o":["sendto(), recvfrom()","bind(), listen(), accept()","open(), close()","split(), plot()"],"a":1,"w":"TCP servers commonly use bind(), listen(), accept()."},{"q":"Which socket calls are associated with UDP datagram sockets?","o":["listen() / accept()","pinMode() / digitalWrite()","attach() / write()","sendto() / recvfrom()"],"a":3,"w":"UDP uses sendto()/recvfrom() patterns."},{"q":"UDP is useful when the application:","o":["Requires perfectly reliable ordered delivery from the transport","Needs a connection handshake","Can tolerate loss or handle it itself","Cannot lose any packets"],"a":2,"w":"UDP is lightweight; useful where loss is tolerable or handled by the application."},{"q":"Which protocol is useful when reliable stream delivery is required?","o":["UDP","ICMP only","None","TCP"],"a":3,"w":"TCP is useful when reliable stream delivery is required."},{"q":"The guide's first example includes which server/client operations?","o":["setup() and loop()","connect() and accept()","pinMode() and delay()","def and return"],"a":1,"w":"The first example includes operations such as connect() and accept()."}]},{"title":"Data Splitting and Live Plotting (Lecture 32)","summary":"Sensor readings sent as text must be parsed before plotting. Python's split() separates a string by a delimiter; values must be converted from strings to numbers; Matplotlib plots readings over time; a monitoring server receives, parses, updates stored series and refreshes a live graph.","qs":[{"q":"Which Python method separates a string into pieces by a delimiter?","o":["split()","join()","open()","bind()"],"a":0,"w":"split() separates a string based on a delimiter."},{"q":"Before plotting, parsed text values such as '25.4' must be:","o":["Left as strings","Deleted","Converted to numeric types","Converted to GPIO pins"],"a":2,"w":"The text '25.4' is a string until converted to a number."},{"q":"Which library is used to plot temperature/humidity over time?","o":["Matplotlib","PIL","Mininet-WiFi","CloudSim"],"a":0,"w":"Matplotlib is used for plotting."},{"q":"A common error in parsing sensor data is:","o":["Too many colours","Wrong GPIO voltage","Delimiter mismatch producing incorrect fields","Faulty relay"],"a":2,"w":"Delimiter mismatches can produce incorrect fields."},{"q":"What does a monitoring server do?","o":["Only sends data","Receives data, parses it, updates stored series and refreshes a live graph","Only stores images","Only runs OpenFlow"],"a":1,"w":"That is the described monitoring workflow."}]},{"title":"SDN — Core Idea (Lecture 33)","summary":"Traditional networking often couples control decisions with forwarding devices. Software-Defined Networking (SDN) separates the control plane from the data plane, making network behaviour programmable through software.","qs":[{"q":"SDN's central idea is to:","o":["Merge the control and data planes","Remove forwarding entirely","Run all forwarding in the cloud","Separate the control plane from the data plane"],"a":3,"w":"SDN separates control from data plane to make the network programmable."},{"q":"In traditional networking, control decisions are:","o":["Always in a central cloud","Never made","Often coupled with the forwarding devices","Done by humans per packet"],"a":2,"w":"Traditional networking couples control and forwarding."}]},{"title":"SDN Planes: Data, Control and Application","summary":"Data plane: forwards packets according to installed rules. Control plane: makes decisions about paths and forwarding rules. Application plane: network applications express policy/requirements through controller-facing interfaces.","qs":[{"q":"Which plane forwards packets according to installed rules?","o":["Data plane","Control plane","Application plane","Management plane only"],"a":0,"w":"Data plane forwards packets."},{"q":"Which plane decides paths and forwarding rules?","o":["Data plane","Application plane","Physical plane","Control plane"],"a":3,"w":"Control plane makes decisions about paths/rules."},{"q":"Which plane expresses policy/requirements via controller-facing interfaces?","o":["Data plane","Application plane","Control plane","Transport plane"],"a":1,"w":"Network applications live in the application plane."}]},{"title":"SDN Controller, OpenFlow and Flow Tables","summary":"A logically central controller manages forwarding policy (deployment can be distributed). OpenFlow enables communication between controller and forwarding devices; a switch matches packet fields against flow-table entries and applies actions. Rule placement means deciding where rules are installed.","qs":[{"q":"OpenFlow is a protocol for:","o":["Sending e-mail","Communication between the controller and forwarding devices/switches","Physical cabling","Image compression"],"a":1,"w":"OpenFlow lets the controller interact with switches."},{"q":"A switch in SDN:","o":["Computes global routes by itself","Ignores flow tables","Only stores cloud images","Matches packet fields against flow-table entries and applies actions"],"a":3,"w":"Switches use flow-table matching and actions."},{"q":"The SDN controller is:","o":["Logically central, though deployment can be distributed","Always physically one device only","Absent in SDN","Located inside each sensor"],"a":0,"w":"Logically central, possibly distributed."},{"q":"Rule placement refers to:","o":["Choosing the colour of rules","Selecting a TCP port","Deciding where forwarding/processing rules should be installed","Deciding the controller's brand"],"a":2,"w":"Rule placement = where rules are installed."}]},{"title":"Why SDN? and SDN Exam Trap","summary":"SDN offers programmability and a centralised policy view, flexible traffic management and network experimentation, though controller placement, scalability, reliability and latency are challenges. SDN does not mean all forwarding happens in the controller.","qs":[{"q":"Which is a benefit of SDN?","o":["Eliminates all latency","Removes need for switches","Guaranteed zero failure","Programmability and centralised policy view"],"a":3,"w":"SDN gives programmability and a centralised policy view."},{"q":"Which is an SDN challenge?","o":["Choosing LED colours","Controller placement, scalability, reliability and latency","Selecting font families","Python indentation"],"a":1,"w":"These are the challenges listed."},{"q":"Exam trap: In SDN, packet forwarding is performed by:","o":["The data plane (switches), while the controller manages policy/rules","The controller for every single packet","The application plane","The cloud service"],"a":0,"w":"SDN does not mean all forwarding happens in the controller."}]},{"title":"SDN Part II: APIs and Controller Placement (Lectures 34–35)","summary":"APIs allow applications/controllers and network devices to interact. Controller placement affects latency, resilience, scalability and communication overhead; architecture may be centralised or distributed (simpler global control vs scalability/fault tolerance).","qs":[{"q":"APIs in SDN allow:","o":["Only users to log in","Only cabling","Applications/controllers and network devices to interact","Only images to be stored"],"a":2,"w":"APIs provide interaction between components."},{"q":"The trade-off between centralised and distributed controller architecture is:","o":["Cheaper cables versus bigger screens","More LEDs versus fewer pins","Simpler global control versus scalability/fault tolerance","TCP versus UDP"],"a":2,"w":"Centralised = simpler; distributed = more scalable/fault tolerant."}]},{"title":"SDN Rule Placement: Access vs Backbone","summary":"Rules can be placed at access devices (reducing delay near users/devices) or in the backbone (managing large traffic aggregates and inter-network flows). Rule-placement questions are scenario-based.","qs":[{"q":"Where can SDN rules be placed?","o":["Only in the cloud","At access devices or in the backbone","Only inside sensors","Nowhere"],"a":1,"w":"Rules can be placed at the access devices or in the backbone."},{"q":"Access-layer decisions are useful because they:","o":["Manage only inter-continental flows","Remove the data plane","Disable OpenFlow","May reduce delay near users/devices"],"a":3,"w":"Access-layer decisions reduce delay close to users/devices."},{"q":"Backbone placement is suited to:","o":["Single sensor readings","Servo control","Large traffic aggregates and inter-network flows","LED blinking"],"a":2,"w":"Backbone rules handle aggregates and inter-network flows."},{"q":"Rule placement questions are generally:","o":["Scenario-based: identify where a decision can be made effectively and what overhead it creates","Pure memorisation of IP classes","About servo angles","About CSV syntax"],"a":0,"w":"The notes label them scenario-based."}]},{"title":"Week 7 Quick Recall","summary":"Pi sensor → client/socket → server; TCP = reliable stream, UDP = datagrams; split() parses text; numeric conversion needed for plotting; Matplotlib visualises; SDN separates control/data plane; OpenFlow = controller-to-switch; controller placement and rule placement are distinct decisions.","qs":[{"q":"Which data flow is typical for remote logging?","o":["Server → sensor → Pi","Raspberry Pi sensor → client/socket → server","Cloud → DHT → LED","Servo → UDP → relay"],"a":1,"w":"Quick recall: Pi sensor → client/socket → server."}]}]},{"title":"WEEK 8 — Advanced SDN and Cloud Computing","topics":[{"title":"1. Recent advances of SDN in IoT","summary":"SDN is applied to mobile/wireless and IoT networking to make traffic control programmable. Traditional wireless mobile networks face changing topology, interference and shifting traffic demand; SDN can manage interference and offload traffic. Rule placement may be at access devices or in the backbone depending on latency, scale and traffic. Data centres distinguish mice and elephant flows; anomaly detection looks for deviations; Mininet-WiFi and ONOS are named tools.","qs":[{"q":"Challenges of traditional wireless mobile networks include:","o":["Only battery shape","Changing topology, interference and shifting traffic demand","Only licensing","Only physical cable damage"],"a":1,"w":"These are listed challenges SDN helps address."},{"q":"SDN-based control can help with:","o":["Removing wireless links","Replacing sensors","Fixing hardware","Managing interference and offloading traffic based on network conditions"],"a":3,"w":"It enables programmable interference management and offloading."},{"q":"The best location for rule placement depends on:","o":["Brand","Latency, scale and kind of traffic","Colour","Weather"],"a":1,"w":"These factors determine access vs backbone placement."},{"q":"Network anomaly detection looks for:","o":["Cable lengths","Normal traffic only","Sensor drift","Traffic or behaviour deviating from expected patterns"],"a":3,"w":"Deviations signal anomalies."}]},{"title":"2. Cloud computing fundamentals: why cloud for IoT","summary":"IoT generates data from many heterogeneous devices and needs scalable storage, processing and analytics. Cloud computing offers shared resources provisioned as needed rather than requiring every organisation to own all infrastructure.","qs":[{"q":"Why is cloud useful for IoT?","o":["It needs no network","It replaces actuators","It removes all sensors","It offers scalable storage, processing and analytics on shared, on-demand resources"],"a":3,"w":"IoT data volumes need scalable shared resources."},{"q":"Cloud resources are provisioned:","o":["As needed rather than requiring organisations to own all infrastructure","Only physically","Only once per decade","Never"],"a":0,"w":"On-demand provisioning is a key idea."}]},{"title":"3. Five essential NIST characteristics of cloud","summary":"(1) On-demand self-service; (2) broad network access; (3) resource pooling; (4) rapid elasticity; (5) measured service.","qs":[{"q":"Which NIST characteristic means users provision resources when needed?","o":["On-demand self-service","Measured service","Rapid elasticity","Resource pooling"],"a":0,"w":"On-demand self-service = users provision resources themselves when needed."},{"q":"Broad network access means:","o":["Services are accessible over networks through standard mechanisms","Only LAN access","Only wired access","No access"],"a":0,"w":"Standard network mechanisms provide access."},{"q":"Resource pooling means:","o":["Provider resources serve multiple customers using a shared pool","Resources are discarded","Each customer has a separate hardware","Only one customer"],"a":0,"w":"Pooling shares provider resources among customers."},{"q":"Rapid elasticity means:","o":["Capacity is fixed","Services are slow","Only scaling up","Capacity can scale up/down quickly"],"a":3,"w":"Capacity changes quickly with demand."},{"q":"Measured service means:","o":["Resource use is monitored and can be billed/controlled","Resources are free","Only size is measured","There is no billing"],"a":0,"w":"Usage is metered for billing/control."},{"q":"How many essential NIST cloud characteristics are listed?","o":["3","4","5","6"],"a":2,"w":"Five characteristics are listed."}]},{"title":"4. Cloud benefits and deployment models","summary":"Benefits: reduced upfront capital expenditure, usage-based costing, faster deployment/time-to-market, flexible availability, easier scaling. Public cloud: services offered to multiple customers over shared provider infrastructure. Private cloud: infrastructure dedicated to one organisation (greater control).","qs":[{"q":"Which is a benefit of cloud listed in the guide?","o":["No scaling","Reduced upfront capital expenditure","Fixed capacity","Zero running cost always"],"a":1,"w":"Reduced capital expenditure and usage-based costing are listed."},{"q":"A public cloud:","o":["Is on-premises only","Has no provider","Offers services to multiple customers over shared provider infrastructure","Serves one organisation only"],"a":2,"w":"Public clouds are multi-customer shared infrastructure."},{"q":"A private cloud:","o":["Is shared with all","Is open to all","Is infrastructure dedicated to one organisation, with greater control as a motivation","Has no control"],"a":2,"w":"Private = dedicated, control-oriented."}]},{"title":"5. Service models: IaaS, PaaS, SaaS","summary":"IaaS: virtual machines, storage, networking; users manage OS and applications. PaaS: platform/runtime so developers build/deploy apps without managing the OS/infrastructure. SaaS: complete application managed by the provider. Shortcut: IaaS = rent infrastructure; PaaS = managed development platform; SaaS = finished application.","qs":[{"q":"IaaS stands for:","o":["Infrastructure as a Service","Intelligence as a Service","Internet as a Service","Integration as a Service"],"a":0,"w":"IaaS = Infrastructure as a Service."},{"q":"In IaaS, the user manages:","o":["The servers and networking","Only the application","The OS and applications above the infrastructure layer","Nothing"],"a":2,"w":"Provider manages virtualisation/servers/storage/networking."},{"q":"PaaS provides:","o":["Raw hardware only","Only storage","A platform/runtime so developers can build and deploy applications without managing the underlying OS/infrastructure","A complete finished application"],"a":2,"w":"This is the PaaS definition."},{"q":"SaaS provides:","o":["Raw VMs","Only a runtime","A complete application with the provider managing the stack","Only networking"],"a":2,"w":"SaaS = finished application."},{"q":"Shortcut: IaaS = ?","o":["Use a finished application","Rent infrastructure","Buy a server","Use a managed development platform"],"a":1,"w":"IaaS = rent infrastructure."},{"q":"Shortcut: SaaS = ?","o":["Use a development platform","Use a finished application","Own a data centre","Rent infrastructure"],"a":1,"w":"SaaS = use a finished application."},{"q":"Who manages the application and data in IaaS?","o":["Neither","Both fully","Provider","User"],"a":3,"w":"In IaaS the user manages applications, data, runtime, middleware and OS."},{"q":"Who manages the runtime, middleware and OS in PaaS?","o":["User","The end user","Provider","Neither"],"a":2,"w":"PaaS shifts runtime/middleware/OS to the provider; user manages applications and data."},{"q":"In SaaS, who manages the application layer?","o":["A third party","Nobody","The provider","The user"],"a":2,"w":"SaaS is provider-managed end to end."},{"q":"Who manages virtualisation, servers, storage and networking in IaaS?","o":["User","Provider","End user","Developer"],"a":1,"w":"The provider manages these in IaaS, PaaS and SaaS."},{"q":"A customer wanting the most control and administration would choose:","o":["None","SaaS","IaaS","PaaS"],"a":2,"w":"IaaS offers the most customer control."},{"q":"SaaS commonly features:","o":["User-managed OS","No scalability","Single-tenancy only","Scalable service architecture, multi-tenancy and configurability, but less control over underlying implementation"],"a":3,"w":"These are listed SaaS traits."}]},{"title":"6. Cloud service management: SLA, accounting, billing and economics","summary":"Service management delivers customer outcomes while controlling cost and risk. SLA = Service Level Agreement specifying service expectations/quality commitments. Accounting records resource usage; billing combines usage with prices and rules. Cloud is not automatically cheaper for every workload.","qs":[{"q":"SLA stands for:","o":["Security Layer Architecture","Server Logic Application","Service Level Agreement","Scalable Load Allocation"],"a":2,"w":"SLA = Service Level Agreement."},{"q":"An SLA specifies:","o":["Service expectations and quality commitments","Only price","Network cable lengths","Only hardware"],"a":0,"w":"It covers non-functional requirements and quality/utility/warranty."},{"q":"Accounting in cloud service management:","o":["Sets prices","Combines usage with prices","Encrypts data","Records resource usage"],"a":3,"w":"Accounting = recording usage."},{"q":"Billing:","o":["Provides security","Combines usage records with prices and billing rules","Records usage only","Stores images"],"a":1,"w":"Billing applies prices/rules to usage."},{"q":"Which statement about cloud economics is correct?","o":["Economic benefit depends on workload, usage patterns and service arrangement","Cloud is never cheaper","Cloud is always cheaper","Cloud has no cost"],"a":0,"w":"The notes say it's not automatically cheaper for every workload."}]},{"title":"7. Cloud security","summary":"Infrastructure security: network, host and application security. CIA triad: Confidentiality (authorised access only), Integrity (accuracy, no improper alteration), Availability (accessible when needed). Other terms: IAM, encryption, access control, authentication, trust, reputation, risk assessment. Threats: data loss, account hijacking, service-traffic disruption, vulnerable APIs.","qs":[{"q":"The three infrastructure-security levels are:","o":["Public, private, hybrid","Network, host and application security","Physical, logical and cloud","IaaS, PaaS, SaaS"],"a":1,"w":"The guide lists network, host and application security."},{"q":"CIA in the CIA triad stands for:","o":["Cloud, Internet, Application","Control, Identity, Access","Cost, Inventory, Audit","Confidentiality, Integrity, Availability"],"a":3,"w":"CIA = Confidentiality, Integrity, Availability."},{"q":"Confidentiality means:","o":["Only authorised parties can access information","Information is never changed","Information is accessible when needed","Information is public"],"a":0,"w":"Confidentiality restricts access to authorised parties."},{"q":"Integrity means:","o":["Information remains accurate and is not improperly altered","Only authorised access","Systems are accessible","Information is encrypted"],"a":0,"w":"Integrity = accuracy and no improper alteration."},{"q":"Availability means:","o":["Access limited","Data deleted","Systems/data remain accessible when needed","Data accurate"],"a":2,"w":"Availability = accessible when needed."},{"q":"IAM stands for:","o":["Information Assurance Matrix","Internet Access Manager","Integrated Application Module","Identity and Access Management"],"a":3,"w":"IAM manages who may access which resources."},{"q":"Encryption protects data by:","o":["Making it unreadable without the appropriate key","Copying it","Compressing it only","Deleting it"],"a":0,"w":"This is the definition."},{"q":"Authentication:","o":["Measures risk","Records usage","Verifies identity","Limits actions by permissions"],"a":2,"w":"Authentication verifies identity; access control limits actions."},{"q":"Access control:","o":["Limits actions/resources according to permissions","Verifies identity only","Bills users","Encrypts data"],"a":0,"w":"Access control enforces permissions."},{"q":"Risk assessment:","o":["Identifies and categorises risks to support appropriate controls","Is encryption","Is billing","Removes all risks"],"a":0,"w":"It supports choice of controls."},{"q":"Which is a cloud threat mentioned in the guide?","o":["Vulnerable APIs","Account hijacking","Data loss","All of the above"],"a":3,"w":"Data loss, account hijacking, service-traffic disruption and vulnerable APIs are listed."},{"q":"Trust and reputation:","o":["They are the same","Both are protocols","Trust = expectation an entity/service will behave as required; reputation = standing based on past behaviour/others' experience","Trust = billing; reputation = encryption"],"a":2,"w":"These are the stated definitions."}]},{"title":"8. Cloud case studies and simulators","summary":"Simulation enables repeatable, controllable pre-deployment evaluation. CloudSim: Java-based simulation of data centres, VMs, applications, users and network topology. CloudAnalyst: analysis of applications with geographically distributed users. GreenCloud: energy-aware data-centre simulation. Others: iCanCloud, GroudSim, DCSim. Platforms: OpenStack (open-source), Microsoft Azure, Amazon EC2.","qs":[{"q":"Why use cloud simulation?","o":["To evaluate performance and test countermeasures before deployment in a repeatable environment","To avoid all testing","To bill customers","To build physical data centres"],"a":0,"w":"Simulation allows pre-deployment evaluation."},{"q":"CloudSim is described as:","o":["A servo library","A Java-based simulation framework for cloud environments","A sensor","A routing protocol"],"a":1,"w":"CloudSim simulates data centres, VMs, apps and users."},{"q":"CloudAnalyst focuses on:","o":["Energy only","Wireless sensors","Cloud application analysis with geographically distributed users and data-centre performance","Servo control"],"a":2,"w":"This is its stated focus."},{"q":"GreenCloud focuses on:","o":["User geography","Energy-aware cloud/data-centre simulation","Routing","Billing"],"a":1,"w":"GreenCloud = energy-aware."},{"q":"Which are other simulator names listed?","o":["Horizon, Nova","iCanCloud, GroudSim and DCSim","ONOS, Mininet-WiFi","MQTT, CoAP"],"a":1,"w":"These are the other simulators named."},{"q":"OpenStack is:","o":["An open-source cloud platform","A router","A simulator","A commercial-only cloud"],"a":0,"w":"OpenStack is open-source."},{"q":"Microsoft Azure in the guide is discussed in relation to:","o":["Only sensors","Only simulation","Only SaaS","PaaS and IaaS"],"a":3,"w":"The guide ties Azure to PaaS and IaaS."},{"q":"Amazon EC2 is:","o":["An SDN controller","A wireless protocol","Virtual compute infrastructure/service","A sensor"],"a":2,"w":"EC2 provides virtual compute."},{"q":"Open-source versus commercial cloud comparison is framed as:","o":["Cheaper versus expensive only","Wired versus wireless","Customisation/control versus managed services/support and provider-specific features","Blue versus green"],"a":2,"w":"This is the high-level comparison in the guide."}]},{"title":"Recent Advances of SDN in IoT (Lecture 36)","summary":"SDN is applied to mobile/wireless and IoT networking to make traffic control programmable. It helps with changing topology, interference and shifting traffic demand; rule placement can be at access devices or in the backbone depending on latency, scale and traffic type.","qs":[{"q":"Which challenges of traditional wireless mobile networks can SDN-based control help manage?","o":["Changing topology, interference and shifting traffic demand","Only font rendering","Only servo torque","Only CSV delimiters"],"a":0,"w":"The notes list changing topology, interference and shifting traffic demand."},{"q":"The best location for rule placement (access vs backbone) depends on:","o":["Only the logo of the switch","Only the number of LEDs","Latency, scale and the kind of traffic","Only OS version"],"a":2,"w":"The notes say the best location depends on latency, scale and traffic type."},{"q":"In data centres, mice flows and elephant flows are distinguished by:","o":["Size/volume: small, short vs large, high-volume","Colour of cables","Protocol language","Programming language"],"a":0,"w":"Mice = small/short; elephant = large/high-volume."},{"q":"Which tools are named for wireless experimentation and as a controller platform?","o":["Heat and Glance","Mininet-WiFi and ONOS","CloudSim and GreenCloud","FileZilla and PiCam"],"a":1,"w":"Mininet-WiFi for experimentation; ONOS as controller platform."}]},{"title":"Cloud Computing Fundamentals: Why Cloud for IoT? (Lecture 37)","summary":"IoT generates data from many heterogeneous devices and may need scalable storage, processing and analytics. Cloud computing offers shared resources provisioned as needed rather than requiring every organisation to own all infrastructure.","qs":[{"q":"Why is cloud computing attractive for IoT?","o":["It removes all sensors","It makes IoT data smaller","It eliminates networks","It offers scalable storage, processing and analytics on shared, on-demand resources"],"a":3,"w":"Cloud provides shared resources provisioned as needed."},{"q":"Cloud computing avoids the need for each organisation to:","o":["Use any network","Have any data","Own all the infrastructure","Use any software"],"a":2,"w":"Resources are provisioned as needed rather than fully owned."}]},{"title":"Five Essential NIST Characteristics of Cloud","summary":"On-demand self-service, broad network access, resource pooling, rapid elasticity and measured service.","qs":[{"q":"Which characteristic lets users provision resources when needed?","o":["On-demand self-service","Measured service","Resource pooling","Broad network access"],"a":0,"w":"On-demand self-service = users provision resources when needed."},{"q":"Services accessible over networks via standard mechanisms illustrates:","o":["Rapid elasticity","Measured service","Resource pooling","Broad network access"],"a":3,"w":"Broad network access."},{"q":"Provider resources serving multiple customers from a shared pool is:","o":["On-demand self-service","Resource pooling","Measured service","Rapid elasticity"],"a":1,"w":"Resource pooling."},{"q":"Capacity that can scale up/down quickly is:","o":["Resource pooling","Rapid elasticity","Broad network access","Measured service"],"a":1,"w":"Rapid elasticity."},{"q":"Monitoring resource use so that it can be billed/controlled is:","o":["Resource pooling","Rapid elasticity","On-demand self-service","Measured service"],"a":3,"w":"Measured service."},{"q":"How many essential NIST characteristics are listed?","o":["Five","Three","Four","Six"],"a":0,"w":"The guide lists five essential characteristics."}]},{"title":"Benefits of Cloud and Deployment Models","summary":"Benefits: reduced upfront capital expenditure, usage-based costing, faster deployment/time-to-market, flexible resource availability and easier scaling. Public cloud serves multiple customers over shared provider infrastructure; private cloud is dedicated to one organisation, often for greater control.","qs":[{"q":"Which is a benefit of cloud described in the guide?","o":["Guaranteed lower cost for every workload","No need for security","Reduced upfront capital expenditure","No network required"],"a":2,"w":"The notes list reduced upfront capex among the benefits."},{"q":"Usage-based costing means:","o":["A fixed price regardless of use","Free service","Cost based on number of cables","Customers pay according to resource usage"],"a":3,"w":"Costs follow usage."},{"q":"A public cloud is:","o":["Dedicated to a single organisation","Offered to multiple customers over shared provider infrastructure","Only on a home LAN","A private LAN"],"a":1,"w":"Public = shared provider infrastructure for multiple customers."},{"q":"A private cloud is:","o":["Infrastructure dedicated to one organisation, often for greater control","Shared by anyone on the internet","Always cheaper","Only in the fog"],"a":0,"w":"Private = dedicated, greater control as motivation."},{"q":"When comparing deployment models, focus on:","o":["Colour of data centre","Logo of the provider","Who uses/controls the infrastructure and trade-offs in sharing, connectivity and security","Cable lengths"],"a":2,"w":"The notes direct attention to control, sharing, connectivity and security."}]},{"title":"Cloud Service Models: IaaS, PaaS, SaaS (Lecture 38)","summary":"IaaS provides infrastructure (VMs, storage, networking) with users managing OS and applications. PaaS provides a platform/runtime so developers can build/deploy without managing the underlying OS/infrastructure. SaaS provides a complete application managed by the provider.","qs":[{"q":"PaaS stands for:","o":["Package as a Service","Protocol as a Service","Platform as a Service","Process as a Service"],"a":2,"w":"PaaS = Platform as a Service."},{"q":"SaaS stands for:","o":["Storage as a Service","Software as a Service","Sensor as a Switch","Security as a System"],"a":1,"w":"SaaS = Software as a Service."},{"q":"Which model provides VMs, storage and networking, leaving OS and apps to the user?","o":["PaaS","SaaS","None","IaaS"],"a":3,"w":"In IaaS users manage OS and applications above the infrastructure layer."},{"q":"Which model lets developers build/deploy apps without managing the underlying OS/infrastructure?","o":["IaaS","SaaS","PaaS","On-premises"],"a":2,"w":"PaaS provides a managed platform/runtime."},{"q":"Which model provides a complete application to users, managed by the provider?","o":["SaaS","IaaS","PaaS","Private cloud"],"a":0,"w":"SaaS = finished application."},{"q":"Exam shortcut:","o":["IaaS = finished application; SaaS = rent infrastructure","PaaS = rent hardware; SaaS = rent platform","All three are identical","IaaS = rent infrastructure; PaaS = managed development platform; SaaS = finished application"],"a":3,"w":"That is the shortcut given in the notes."}]},{"title":"Who Manages What? (Responsibility Boundary)","summary":"On-premises: user manages everything. IaaS: provider manages virtualisation, servers, storage and networking; user manages OS, middleware, runtime, data and applications. PaaS: provider also manages runtime, middleware and OS; user manages applications and data. SaaS: provider manages the whole stack.","qs":[{"q":"In IaaS, which layers does the provider manage?","o":["Applications and data","Virtualisation, servers, storage and networking","Applications only","Runtime and middleware only"],"a":1,"w":"Users manage OS and above; the provider manages virtualisation, servers, storage and networking."},{"q":"In PaaS, the user still manages:","o":["Operating system","Applications and data","Servers","Networking"],"a":1,"w":"In PaaS the provider takes runtime, middleware and OS; the user keeps applications and data."},{"q":"In SaaS, the provider manages:","o":["Only networking","Only storage","Nothing","Most or all of the stack, including the application"],"a":3,"w":"SaaS: the provider manages the application and underlying stack."},{"q":"In the traditional (on-premises) model, who manages all layers?","o":["The user","The provider","A third party only","The OS vendor"],"a":0,"w":"On-premises, everything is managed by the user."},{"q":"Which model gives the customer MORE control and administration?","o":["SaaS","PaaS","IaaS","They are equal"],"a":2,"w":"In IaaS the customer has more control and more administration than in PaaS/SaaS."},{"q":"Who manages the operating system in PaaS?","o":["The user","Neither","The end user's phone","The provider"],"a":3,"w":"In PaaS the OS is provider-managed."}]},{"title":"Additional Service-Model Concepts","summary":"Administrative services cut across layers: packaging, configuration, deployment, scaling, lifecycle management, utilisation and user management. IaaS uses virtualised infrastructure; PaaS supports application development/integration; SaaS commonly uses scalable architecture, multi-tenancy and configurability.","qs":[{"q":"Administrative services across cloud layers include:","o":["Only paint colour and cabling","Packaging, configuration, deployment, scaling, lifecycle management, utilisation and user management","Only screen refresh","Only code comments"],"a":1,"w":"These are the administrative services listed."},{"q":"IaaS commonly uses:","o":["Virtualised infrastructure","Only physical single-tenant PCs","Finished office applications","Sensor nodes only"],"a":0,"w":"IaaS uses virtualised infrastructure."}]},{"title":"Cloud Service Management: SLA, Accounting and Billing (Lecture 39)","summary":"Service management aims to deliver customer outcomes while controlling cost and risk. An SLA specifies service expectations and quality commitments; accounting records resource usage; billing combines usage records with prices and billing rules.","qs":[{"q":"The goal of service management is to:","o":["Maximise hardware only","Remove all customers","Deliver customer outcomes while controlling cost and risk","Prevent any scaling"],"a":2,"w":"Stated goal in the notes."}]},{"title":"Cloud Economics and Scaling","summary":"Cloud can reduce initial capital costs, support faster deployment and allow capacity scaling, but the economic benefit depends on workload, usage patterns and the service arrangement; cloud is not automatically cheaper for every workload.","qs":[{"q":"Which cost is typically reduced by cloud?","o":["Electricity of the user's phone","Cable cost only","Zero cost always","Initial capital cost"],"a":3,"w":"Cloud can reduce initial capital costs."}]},{"title":"Cloud Security Levels and the CIA Triad","summary":"Infrastructure security has three levels: network security, host security and application security. Data-security goals follow the CIA triad: Confidentiality (only authorised access), Integrity (accurate, not improperly altered) and Availability (accessible when needed).","qs":[{"q":"Which are the three levels of infrastructure security?","o":["Physical, logical and virtual","Network, host and application security","Client, server and cloud","Edge, fog and cloud"],"a":1,"w":"Network security, host security and application security."},{"q":"CIA triad stands for:","o":["Control, Identity, Access","Confidentiality, Integrity, Availability","Cloud, Internet, Application","Cache, Index, Archive"],"a":1,"w":"CIA triad in security."}]},{"title":"Other Cloud Security Terms and Threats","summary":"IAM manages who may access which resources, when and under what conditions; encryption makes data unreadable without a key; access control limits actions by permissions; authentication verifies identity; trust is the expectation of required behaviour; reputation is standing based on past behaviour; risk assessment identifies and categorises risks. Threats: data loss, account hijacking, service-traffic disruption, vulnerable APIs.","qs":[{"q":"Reputation is:","o":["Standing or assessment based on past behaviour/others' experience","Expectation that a service will behave as required","A billing record","A firewall rule"],"a":0,"w":"Reputation is based on past behaviour; trust is the expectation."},{"q":"Trust is:","o":["A past-behaviour score","A VM image","The expectation that an entity/service will behave as required","An API key only"],"a":2,"w":"Trust = expectation of required behaviour."}]},{"title":"Cloud Simulation: Why Simulate? (Lecture 40)","summary":"Cloud simulation enables pre-deployment evaluation in a repeatable, controllable environment without building full infrastructure, helping detect performance issues and test countermeasures before deployment.","qs":[{"q":"Why use a cloud simulator?","o":["To replace the need for any cloud","To store real customer data","To evaluate in a repeatable, controllable environment before building the full infrastructure","To avoid testing"],"a":2,"w":"Pre-deployment evaluation without building full infrastructure."},{"q":"Simulation can help:","o":["Detect performance issues and test countermeasures before deployment","Remove the need for networks","Increase hardware cost","Hide faults"],"a":0,"w":"These are the stated benefits."}]},{"title":"Cloud Simulators: CloudSim, CloudAnalyst, GreenCloud and Others","summary":"CloudSim (Java-based) simulates data centres, VMs, applications, users and network topology and supports dynamic resource addition/removal. CloudAnalyst focuses on geographically distributed users and data-centre performance. GreenCloud focuses on energy-aware simulation. Others: iCanCloud, GroudSim, DCSim.","qs":[{"q":"Which simulator focuses on geographically distributed users and data-centre performance?","o":["GreenCloud","CloudAnalyst","CloudSim","DCSim"],"a":1,"w":"CloudAnalyst targets geographically distributed users and data-centre performance."},{"q":"Which simulator focuses on energy-aware cloud/data-centre simulation?","o":["CloudAnalyst","GreenCloud","iCanCloud","ONOS"],"a":1,"w":"GreenCloud = energy-aware."},{"q":"Which of these is another simulator name in the guide?","o":["Neutron","Keystone","Horizon","iCanCloud"],"a":3,"w":"Other names: iCanCloud, GroudSim and DCSim."},{"q":"CloudSim supports:","o":["Dynamic resource addition/removal","Only static fixed resources","No VMs","No users"],"a":0,"w":"The notes state it supports dynamic addition/removal."}]},{"title":"Cloud Platforms: OpenStack, Microsoft Azure, Amazon EC2","summary":"OpenStack is an open-source cloud platform; Microsoft Azure is discussed with PaaS and IaaS; Amazon EC2 is a virtual compute infrastructure service. Compare open-source (customisation/control) vs commercial (managed services/support, provider-specific features).","qs":[{"q":"Microsoft Azure is discussed in relation to:","o":["Only SaaS","Only fog","Only SDN","PaaS and IaaS"],"a":3,"w":"The guide relates Azure to PaaS and IaaS."},{"q":"Open-source vs commercial clouds trade-off:","o":["Customisation/control vs managed services/support and provider-specific features","Colour vs size","Servo vs relay","UDP vs TCP"],"a":0,"w":"High-level comparison in the notes."}]}]},{"title":"WEEK 9 — OpenStack, Sensor-Cloud and Fog Computing","topics":[{"title":"1. Week 9 at a glance","summary":"OpenStack = how to build and manage cloud infrastructure; sensor-cloud = how to offer sensing resources as a service using virtualization; fog computing = where to process data when decisions must be made close to IoT devices. These ideas are complementary, not interchangeable.","qs":[{"q":"Which technology answers \"how to build and manage cloud infrastructure\"?","o":["Fog computing","OpenStack","RFID","Sensor-cloud"],"a":1,"w":"OpenStack builds and manages cloud infrastructure."},{"q":"Which concept offers sensing resources as a service using virtualization?","o":["OpenStack","NFC","Sensor-cloud","Fog"],"a":2,"w":"Sensor-cloud virtualises sensing resources into services."},{"q":"Which concept addresses where to process data when decisions must be made close to IoT devices?","o":["Fog computing","Heat","OpenStack","Sensor-cloud"],"a":0,"w":"Fog processes data near devices."},{"q":"The basic IoT flow in the notes is:","o":["Application → cloud → sensor","Actuation → sensing → storage","Sensors/devices → communication → data handling/processing → inference or decision → service/actuation","Cloud → network → device only"],"a":2,"w":"This is the flow stated in the notes."}]},{"title":"2. OpenStack: definition and components","summary":"OpenStack is open-source software for creating and managing cloud infrastructure (private or public) using separate services for compute, images, networking, storage, identity, orchestration and metering. Horizon = dashboard/GUI; Keystone = identity (authentication/authorization); Nova = compute; Glance = VM images; Neutron = networking; Swift = object storage; Cinder = block storage; Heat = orchestration; Ceilometer = metering.","qs":[{"q":"Horizon is OpenStack's:","o":["Dashboard / graphical user interface","Compute service","Image service","Identity service"],"a":0,"w":"Horizon = dashboard (human-facing GUI)."},{"q":"Keystone provides:","o":["Identity — authentication and authorization","Block storage","Orchestration","Object storage"],"a":0,"w":"Memory cue: \"Who are you? What may you access?\""},{"q":"Nova is responsible for:","o":["Networking","Images","Metering","Compute — launching and managing instances"],"a":3,"w":"Nova = compute/VM."},{"q":"Glance provides:","o":["Orchestration","Block storage","Networking","VM image service — registering and retrieving images"],"a":3,"w":"Glance = image service."},{"q":"Neutron provides:","o":["Networking — networks, routers, interfaces and connectivity","Identity","Images","Compute"],"a":0,"w":"Neutron = network."},{"q":"Swift is:","o":["Block storage","Object storage","Orchestration","Networking"],"a":1,"w":"Swift = objects/files."},{"q":"Cinder is:","o":["Object storage","Block storage (attachable block volumes)","Metering","Identity"],"a":1,"w":"Cinder = block storage."},{"q":"Heat provides:","o":["Orchestration — coordinates resource deployment","Images","Metering","Identity"],"a":0,"w":"Heat = orchestration."},{"q":"Ceilometer provides:","o":["Metering","Networking","Object storage","Orchestration"],"a":0,"w":"The exam traps list Ceilometer = metering."},{"q":"Which pairing is correct?","o":["Nova — compute; Glance — images","Horizon — identity; Keystone — dashboard","Swift — block storage; Cinder — object storage","Nova — images; Glance — compute"],"a":0,"w":"Nova launches instances; Glance provides images; the other pairs are swapped."},{"q":"Exam trap: Horizon versus Keystone.","o":["Horizon = identity; Keystone = dashboard","Horizon = dashboard GUI; Keystone = identity/authentication","They are the same","Both are storage"],"a":1,"w":"Horizon ≠ Keystone."},{"q":"Why are OpenStack services separated?","o":["Launching a VM needs compute, an image, identity/access control, networking and sometimes storage","Because VMs need no network","To reduce features","To avoid images"],"a":0,"w":"Different functions are modular services."}]},{"title":"3. OpenStack practical workflow and connectivity","summary":"Workflow: create/import an SSH key pair → choose image, flavor, network → launch an instance (Nova) → configure network/router (Neutron) → set security-group rules → associate a floating IP if outside access is needed → test with ping/ICMP or SSH. Router connects networks; IP identifies an endpoint; security group controls allowed traffic; floating IP provides external reachability; key pair supports secure access.","qs":[{"q":"In the workflow, which is created first?","o":["Router","Floating IP","Security group rules","SSH key pair"],"a":3,"w":"The workflow starts with creating/importing an SSH key pair."},{"q":"Which service launches the instance in the workflow?","o":["Nova","Swift","Heat","Cinder"],"a":0,"w":"Nova launches instances."},{"q":"A security group:","o":["Connects networks","Stores images","Controls allowed traffic","Identifies an endpoint"],"a":2,"w":"Security group = traffic rules."},{"q":"A router in OpenStack:","o":["Connects networks","Stores keys","Identifies an interface","Controls allowed traffic"],"a":0,"w":"Router = connects networks."},{"q":"A floating IP:","o":["Is a router","Is a flavor","Is a key pair","Can provide external reachability in the demonstrated configuration"],"a":3,"w":"A floating IP gives outside access."},{"q":"A key pair supports:","o":["Secure instance access","Routing","Image storage","Billing"],"a":0,"w":"SSH key pairs enable secure access."},{"q":"A VM is running but unreachable from outside. Which is a likely cause?","o":["Missing routing, floating IP or security-group rules","Nova is not installed","Too much storage","Too many images"],"a":0,"w":"A running VM is not necessarily reachable from outside."},{"q":"How can connectivity be tested in the demonstration?","o":["Using RFID","Using NFC","Using servos","Using ping/ICMP or SSH with suitable rules and credentials"],"a":3,"w":"Ping or SSH tests reachability."}]},{"title":"4. DevStack — course workflow","summary":"The slides show a historical demonstration: install Git → clone DevStack → enter directory → configure local.conf with passwords and HOST_IP → run ./stack.sh; ./unstack.sh removes. Treat these as course-era commands, not a current installation guide; never put real passwords in shared notes.","qs":[{"q":"Which script starts the DevStack installation in the course demo?","o":["./unstack.sh","./stack.sh","./clone.sh","./run.sh"],"a":1,"w":"./stack.sh runs the install."},{"q":"Which script is named for removal?","o":["./stack.sh","./stop.sh","./unstack.sh","./remove.sh"],"a":2,"w":"./unstack.sh is the removal script."},{"q":"The local.conf file in DevStack configures:","o":["Only icons","Passwords and HOST_IP","Only the dashboard","Only fonts"],"a":1,"w":"It stores passwords and HOST_IP settings."},{"q":"How should the DevStack commands be treated?","o":["As course-era commands, not a current guide","As a current installation guide","As optional","As illegal"],"a":0,"w":"The notes say they are historical demonstration commands."}]},{"title":"5. WSN and cloud basics","summary":"A WSN consists of sensor nodes that observe and communicate; a sink collects data. Cloud computing provides on-demand compute/storage. Virtualization abstracts physical resources so they can be shared or accessed as virtual resources. Traditional WSNs are constrained by energy, processing, storage, range and fixed-purpose deployment.","qs":[{"q":"Virtualization:","o":["Compresses sensor data","Adds antennas","Abstracts physical resources so they can be shared or accessed as virtual resources","Removes resources"],"a":2,"w":"This is the definition given."},{"q":"A sink in a WSN:","o":["Is an actuator","Is a router","Is a central unit that collects data from sensor nodes","Is a sensor"],"a":2,"w":"The sink collects data."},{"q":"Traditional WSN constraints include:","o":["Unlimited storage","Energy, processing, storage, communication range and fixed-purpose deployment","No constraints","Unlimited energy"],"a":1,"w":"These are the listed limitations."}]},{"title":"6. Sensor-cloud","summary":"Sensor-cloud integrates sensor networks with cloud computing and virtualization so sensing can be managed and offered as a service; users consume sensing without owning every physical sensor. Se-aaS = Sensors-as-a-Service / sensing-as-a-service. Actors: sensor owner (owns/deploys sensors) and sensor-cloud service provider (SCSP: manages and offers the service).","qs":[{"q":"Sensor-cloud integrates:","o":["Only RFID tags","Sensor networks with cloud computing and virtualization","Only NFC","Only batteries"],"a":1,"w":"This is the definition."},{"q":"Se-aaS stands for:","o":["Secure Edge as a Service","Server Enhancement as a Service","Software Engineering as a Service","Sensors-as-a-Service"],"a":3,"w":"Se-aaS = sensing-as-a-service."},{"q":"The sensor owner:","o":["Owns/purchases and deploys physical sensor nodes","Manages the sensing service","Consumes the service","Runs the cloud"],"a":0,"w":"Sensor owner owns and deploys sensors."},{"q":"SCSP stands for:","o":["Sensor-Cloud Service Provider","Secure Cloud Sensing Protocol","Sensor Control and Storage Platform","Shared Cloud Server Pool"],"a":0,"w":"SCSP = Sensor-cloud service provider."},{"q":"The SCSP:","o":["Is the end user","Owns all sensors","Is a sensor","Manages the sensing service and offers access to sensor resources"],"a":3,"w":"SCSP manages/offers the service."},{"q":"Exam trap: sensor-cloud is:","o":["Only uploading raw sensor data to a cloud","A type of battery","Not a service","More than uploading raw data; it offers virtualized sensing as a service"],"a":3,"w":"The notes say it is more than uploading raw data."}]},{"title":"7. Physical versus virtual sensors and composition","summary":"A physical sensor is an actual deployed device. A virtual sensor is a service-facing abstraction that can map to one or more physical sensors (not necessarily one-to-one). Composition chooses which physical sensors contribute to a virtual sensing service. CoV-I = homogeneous sensors within the same geographic region; CoV-II = heterogeneous sensors across multiple regions.","qs":[{"q":"A virtual sensor:","o":["Is a service-facing abstraction that can map to one or more physical sensors","Is a device","Cannot map to anything","Always maps one-to-one to a physical sensor"],"a":0,"w":"Virtual sensors need not map one-to-one."},{"q":"A physical sensor is:","o":["A billing term","A cloud region","An actual deployed device that measures a physical quantity","A service abstraction"],"a":2,"w":"This is the definition."},{"q":"CoV-I composition uses:","o":["Only virtual sensors","Homogeneous sensors within the same geographic region","Only actuators","Heterogeneous sensors in multiple regions"],"a":1,"w":"CoV-I = homogeneous/same region."},{"q":"CoV-II composition uses:","o":["Heterogeneous sensors across multiple regions","Only mobile sensors","Homogeneous sensors in one region","No sensors"],"a":0,"w":"CoV-II = heterogeneous/multiple regions."},{"q":"Composition in sensor-cloud:","o":["Chooses which physical sensors contribute to a virtual sensing service","Removes sensors","Compresses the cloud","Encrypts sensors"],"a":0,"w":"It groups sensors into virtual services for applications."}]},{"title":"8. Sensor-cloud caching and pricing","summary":"Caching avoids repeatedly probing sensors when data have not changed enough to justify a fresh reading, reducing communication/energy and improving network lifetime. Internal cache (IC): inside the sensor-cloud, handles end-user requests and decides to serve cached data or re-cache. External cache (EC): separate server/hardware storing readings and refreshing at intervals. Pricing: pH = hardware/sensor-related; pI = infrastructure-related.","qs":[{"q":"The purpose of caching in sensor-cloud is to:","o":["Avoid repeatedly probing sensors, saving communication/energy","Increase probing","Delete data","Lower freshness always"],"a":0,"w":"Caching reduces unnecessary sensor reads."},{"q":"The Internal cache (IC) is:","o":["A router","Inside the sensor-cloud, deciding whether to serve cached data or re-cache","A sensor","A separate server/hardware"],"a":1,"w":"IC is within the sensor-cloud."},{"q":"The External cache (EC) is:","o":["A virtual sensor","A separate server/hardware that stores readings and refreshes at intervals","Inside the cloud only","A pricing model"],"a":1,"w":"EC is external hardware."},{"q":"In sensor-cloud pricing, pH represents:","o":["Power","Hardware/sensor-related pricing component","Infrastructure-related component","Acidity"],"a":1,"w":"pH = hardware."},{"q":"In sensor-cloud pricing, pI represents:","o":["Interference","Hardware component","Infrastructure-related pricing component","Internet protocol"],"a":2,"w":"pI = infrastructure."},{"q":"The pricing proposal balances the interests of:","o":["Only the SCSP","SCSP, sensor owner and end user","Only the user","Only the owner"],"a":1,"w":"All three parties are balanced."},{"q":"The supplied notes provide a complete pricing equation.","o":["True for pH only","True for pI only","False; they do not, so do not invent one","True"],"a":2,"w":"The notes explicitly say no complete equation is provided."}]},{"title":"9. Fog computing — definition, rationale and latency","summary":"Fog computing extends cloud-like processing and temporary storage closer to IoT devices through an intermediate layer, so time-sensitive decisions avoid a distant cloud round trip. Cloud-only processing can cause delay and device energy use. Latency: L = T(device→cloud) + T(analysis) + T(cloud→device).","qs":[{"q":"Fog computing:","o":["Replaces all sensors","Is a modulation","Is an OpenStack service","Extends cloud-like processing and temporary storage closer to IoT devices through an intermediate layer"],"a":3,"w":"This is the definition."},{"q":"Why can sending all raw data to a distant cloud be a problem?","o":["It is faster always","It removes latency","It saves energy","It can cause delay and consume device energy/bandwidth"],"a":3,"w":"Distant round trips and communication energy are costs."},{"q":"The cloud round-trip latency formula is:","o":["L = T(device→cloud) × T(analysis)","L = T(analysis) − T(device→cloud)","L = T(cloud→device) ÷ T(analysis)","L = T(device→cloud) + T(analysis) + T(cloud→device)"],"a":3,"w":"Sum all terms after converting to the same unit."},{"q":"If device→cloud = 0.18 s, analysis = 0.04 s and cloud→device = 0.13 s, the latency is:","o":["0.35 s (350 ms)","3.5 s","0.31 s","0.22 s"],"a":0,"w":"0.18 + 0.04 + 0.13 = 0.35 s = 350 ms."},{"q":"If device→cloud = 120 ms, analysis = 30 ms and cloud→device = 100 ms, latency L is:","o":["150 ms","220 ms","250 ms","2.5 s"],"a":2,"w":"120 + 30 + 100 = 250 ms."},{"q":"Before adding latency terms you must:","o":["Multiply them","Drop the units","Ignore analysis","Convert all terms to the same unit"],"a":3,"w":"The notes say add after converting to the same unit."}]},{"title":"10. Fog processing tiers","summary":"Very time-sensitive data: processed at the nearest fog node (fraction of a second). Less time-sensitive: aggregate fog node (seconds to minutes). Summaries and long-term records go to the cloud.","qs":[{"q":"Very time-sensitive data is processed at:","o":["The cloud only","An external cache","The nearest fog node","The aggregate fog node"],"a":2,"w":"Nearest fog node = fraction of a second."},{"q":"Less time-sensitive data is processed at:","o":["The actuator","Aggregate fog node","The sensor","Nearest fog node"],"a":1,"w":"Aggregate fog node = seconds to minutes."},{"q":"Summaries and long-term records are sent to:","o":["The nearest fog node only","The sensor","The cloud","The relay"],"a":2,"w":"Cloud holds long-term records."},{"q":"The typical fog timing for very time-sensitive decisions is:","o":["Hours","Weeks","Days","A fraction of a second"],"a":3,"w":"Course timing for the nearest fog node."}]},{"title":"11. Fog advantages, challenges and applications","summary":"Advantages: faster response for safety-critical events, reduced bandwidth via local filtering/aggregation, privacy benefits, local security policies, support for mobile/remote/harsh environments. Challenges: distributed security, reliability/fault tolerance, additional power consumption, real-time analysis at scale, programming complexity, nodes moving/joining/leaving. Applications: real-time health/emergency, power-efficient systems, railway-track, oil/gas pipeline, windmill/turbine.","qs":[{"q":"Which is a fog advantage?","o":["No local processing","More raw data to cloud","Faster response for safety-critical events","Higher latency"],"a":2,"w":"Local processing speeds critical responses."},{"q":"Fog can reduce bandwidth use through:","o":["Local filtering and aggregation","Removing devices","Sending everything","Increased polling"],"a":0,"w":"Filtering/aggregation reduces transmission."},{"q":"Which is a fog challenge listed?","o":["Distributed security management","Reliability and fault tolerance","Additional power consumption","All of the above"],"a":3,"w":"All are listed challenges."},{"q":"Which is a fog application listed in the course?","o":["Railway-track monitoring","Windmill/turbine analysis","Oil/gas pipeline monitoring","All of the above"],"a":3,"w":"All are listed applications."},{"q":"A potential privacy benefit of fog is:","o":["Data is public","Sensitive data can remain local","No privacy","All data goes to cloud"],"a":1,"w":"Keeping data local can help privacy."}]},{"title":"12. Fog versus cloud versus sensor-cloud","summary":"Cloud: on-demand compute and long-term storage; sensor-cloud: sensing resources as a service via virtualization; fog: near-device processing for timely response. Benefits: cloud — large-scale processing and history; sensor-cloud — access/composition of sensor resources; fog — low latency and less data transmission.","qs":[{"q":"Main purpose of fog computing:","o":["Near-device processing for timely response","Cloud building","Long-term storage only","Sensing resources as a service"],"a":0,"w":"Fog = near-device processing."},{"q":"Main purpose of sensor-cloud:","o":["Image storage","Large-scale history","Sensing resources as a service","Low latency"],"a":2,"w":"Sensor-cloud virtualizes/manages sensing."},{"q":"Typical benefit of fog:","o":["Low latency and less data transmission","Billing","Large-scale history","Composition of sensors"],"a":0,"w":"This is fog's listed benefit."},{"q":"Typical benefit of cloud:","o":["Low latency","Sensor virtualization","Local control","Large-scale processing and history"],"a":3,"w":"Cloud offers large-scale processing and history."}]},{"title":"Week 9 at a Glance and the Basic IoT Flow","summary":"OpenStack: how to build and manage cloud infrastructure. Sensor-cloud: how to offer sensing resources as a service using virtualization. Fog computing: where to process data when decisions must be close to IoT devices. They are complementary, not interchangeable. Basic IoT flow: sensors/devices → communication → data handling/processing → inference or decision → service/actuation.","qs":[{"q":"Which answers 'how to offer sensing resources as a service using virtualization'?","o":["Sensor-cloud","OpenStack","Fog computing","Arduino"],"a":0,"w":"Sensor-cloud virtualizes sensing resources."},{"q":"Which answers 'where to process data when decisions must be close to IoT devices'?","o":["Sensor-cloud","OpenStack","Fog computing","SaaS"],"a":2,"w":"Fog computing."},{"q":"OpenStack, sensor-cloud and fog computing are:","o":["Identical","Complementary, not interchangeable","Competing synonyms","All fog tiers"],"a":1,"w":"The notes say they are complementary."},{"q":"Which is the correct basic IoT flow?","o":["Actuation → sensors → billing","Cloud → sensors → network","Decision → communication → sensors","Sensors/devices → communication → processing → inference/decision → service/actuation"],"a":3,"w":"Basic IoT flow as given."}]},{"title":"OpenStack — Definition","summary":"OpenStack is open-source software for creating and managing cloud infrastructure (private or public clouds), using separate services for compute, images, networking, storage, identity, orchestration and metering.","qs":[{"q":"OpenStack is used to:","o":["Plot Python graphs","Control a servo","Create and manage private or public cloud infrastructure","Parse CSV"],"a":2,"w":"It is open-source software for cloud infrastructure."},{"q":"OpenStack's architecture is built from:","o":["Separate services for compute, images, networking, storage, identity, orchestration and metering","One monolithic program","Only a dashboard","Only an image store"],"a":0,"w":"It uses separate services."}]},{"title":"OpenStack Components: Horizon, Keystone, Nova, Glance","summary":"Horizon = dashboard/GUI; Keystone = identity (authentication and authorization); Nova = compute (launches/manages instances); Glance = VM image service.","qs":[{"q":"Which OpenStack component provides the dashboard/GUI?","o":["Keystone","Nova","Glance","Horizon"],"a":3,"w":"Horizon is the human-facing dashboard."},{"q":"Which component handles identity, authentication and authorization?","o":["Horizon","Keystone","Neutron","Heat"],"a":1,"w":"Keystone = who are you, what may you access."},{"q":"Which component launches and manages compute instances?","o":["Glance","Nova","Cinder","Swift"],"a":1,"w":"Nova = compute/VM."},{"q":"Which component registers and retrieves VM images?","o":["Nova","Neutron","Horizon","Glance"],"a":3,"w":"Glance = image service."}]},{"title":"OpenStack Components: Neutron, Swift, Cinder, Heat (and Ceilometer)","summary":"Neutron = networking (networks, routers, interfaces, connectivity); Swift = object storage; Cinder = block storage (attachable volumes); Heat = orchestration. Ceilometer = metering.","qs":[{"q":"Which component manages networks, routers and interfaces?","o":["Neutron","Nova","Swift","Heat"],"a":0,"w":"Neutron = networking."},{"q":"Which component provides object storage?","o":["Cinder","Neutron","Swift","Glance"],"a":2,"w":"Swift = object storage."},{"q":"Which component provides block storage (attachable volumes)?","o":["Swift","Glance","Keystone","Cinder"],"a":3,"w":"Cinder = block storage."},{"q":"Which component handles orchestration?","o":["Keystone","Heat","Ceilometer","Horizon"],"a":1,"w":"Heat coordinates resource deployment."},{"q":"Which component is associated with metering?","o":["Ceilometer","Heat","Nova","Swift"],"a":0,"w":"Exam trap: Heat = orchestration; Ceilometer = metering."},{"q":"Memory cue: 'Image' maps to:","o":["Nova","Horizon","Glance","Swift"],"a":2,"w":"Glance = Image."}]},{"title":"OpenStack — Why Services Are Separated and Exam Traps","summary":"Launching a VM needs compute, an image, identity/access control, networking and sometimes storage; a VM can be running but unreachable if routing, a floating IP or security-group rules are missing. Traps: Horizon ≠ Keystone; Nova launches instances while Glance provides images; Swift = object, Cinder = block.","qs":[{"q":"A VM can be running yet unreachable from outside. A likely reason is:","o":["Missing routing, floating IP or security-group rules","Nova is not installed","Horizon shows blue colours","Swift has no objects"],"a":0,"w":"The notes: a running VM is not necessarily reachable from outside."},{"q":"Which statement about Horizon and Keystone is correct?","o":["Horizon and Keystone are the same service","Horizon handles identity and Keystone is the dashboard","Horizon is the dashboard and Keystone handles identity; they are different services","Keystone provides block storage and Horizon provides images"],"a":2,"w":"Exam trap: Horizon ≠ Keystone."}]},{"title":"OpenStack Practical Workflow","summary":"(1) Create/import an SSH key pair; (2) choose image, flavor and network; (3) launch instance (Nova); (4) configure network/router connectivity (Neutron); (5) set security-group rules; (6) associate a floating IP if outside access is needed; (7) test connectivity with ping/ICMP or SSH.","qs":[{"q":"What is the first step in the OpenStack practical workflow?","o":["Associate floating IP","Delete the image","Create/import an SSH key pair","Run ping"],"a":2,"w":"Step 1: create/import an SSH key pair."},{"q":"Which three choices are made when launching an instance?","o":["Image, flavor and network","Servo, relay and LED","TCP, UDP and ICMP","Horizon, Heat and Swift"],"a":0,"w":"Step 2: choose an image, flavor and network."},{"q":"Which service launches the instance?","o":["Neutron","Glance","Keystone","Nova"],"a":3,"w":"Nova launches instances."},{"q":"Which service configures network/router connectivity?","o":["Nova","Neutron","Cinder","Heat"],"a":1,"w":"Neutron handles networks/routers."},{"q":"A floating IP is associated to:","o":["Encrypt the key pair","Provide external reachability in the demonstrated configuration","Create a new image","Increase RAM
