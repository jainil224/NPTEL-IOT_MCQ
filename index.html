ng/storage; virtualization abstracts physical resources so they can be shared as virtual resources. Traditional WSNs are constrained by energy, processing, storage, range and fixed-purpose deployment.","qs":[{"q":"A sink in a WSN is:","o":["A Python function","A servo","A central unit that collects data from sensor nodes","A cloud image"],"a":2,"w":"The sink collects data from nodes."},{"q":"Which are constraints of traditional WSNs?","o":["Unlimited energy","Unlimited storage","No range limits","Energy, processing, storage, communication range and fixed-purpose deployment"],"a":3,"w":"Traditional WSN constraints."}]},{"title":"Sensor-Cloud and Se-aaS","summary":"Sensor-cloud integrates sensor networks with cloud computing and virtualization so sensing capability can be managed and offered as a service, without the user owning or managing every physical sensor. Se-aaS = Sensors-as-a-Service / sensing-as-a-service.","qs":[{"q":"A user of sensor-cloud may:","o":["Need to own every sensor","Cannot use virtual sensors","Only access raw packets","Consume sensing services without owning every physical sensor"],"a":3,"w":"Users consume sensing as a service."}]},{"title":"Sensor-Cloud Actors","summary":"Sensor owner owns/purchases and deploys physical nodes; Sensor-Cloud Service Provider (SCSP) manages the sensing service and offers access to sensor resources; the end user consumes the service.","qs":[{"q":"Who owns/purchases and deploys physical sensor nodes?","o":["SCSP","Sensor owner","End user","Gateway"],"a":1,"w":"Sensor owner."},{"q":"Who manages the sensing service and offers access to sensor resources?","o":["SCSP","Sensor owner","End user","Mule"],"a":0,"w":"SCSP manages/offers the service."},{"q":"Who consumes the sensing service?","o":["Sensor owner","SCSP","End user","Router"],"a":2,"w":"End user consumes the service."}]},{"title":"Physical vs Virtual Sensor and Virtual-Sensor Composition (CoV-I)","summary":"A physical sensor is an actual deployed device; a virtual sensor is a service-facing abstraction that can map to one or more physical sensors (not necessarily one-to-one). Composition chooses which physical sensors contribute to a virtual sensing service. CoV-I: homogeneous sensors in the same geographic region; CoV-II: heterogeneous / multiple regions.","qs":[{"q":"Is one-to-one mapping from virtual to physical sensor required?","o":["Yes, always","No","Only in fog","Only in SDN"],"a":1,"w":"The notes state mapping need not be one-to-one."},{"q":"Virtual-sensor composition decides:","o":["Which physical sensors contribute to a virtual sensing service and how services are grouped","The colour of nodes","The Python version","The SDN controller"],"a":0,"w":"That is composition."},{"q":"CoV-I is characterised by:","o":["Heterogeneous sensors across regions","Only actuators","Homogeneous sensors within the same geographic region","Only gateways"],"a":2,"w":"CoV-I = same type, same region."},{"q":"CoV-II is characterised by:","o":["Heterogeneous sensors / multiple regions","Homogeneous sensors in one region","Only servos","Only fog nodes"],"a":0,"w":"CoV-II = heterogeneous/multiple regions."}]},{"title":"Sensor-Cloud Caching: Internal vs External Cache","summary":"Caching avoids repeatedly probing sensors when data have not changed enough to justify a fresh reading, reducing communication and energy use and improving network lifetime. Internal cache (IC) is inside sensor-cloud and handles end-user requests (serve cached data or re-cache). External cache (EC) is a separate server/hardware storing readings and refreshing them at intervals.","qs":[{"q":"Caching helps improve:","o":["Screen brightness","Network lifetime","Servo torque","TCP port count"],"a":1,"w":"Reduced probing = longer network lifetime."},{"q":"Internal cache (IC) is:","o":["A separate external server refreshing at intervals","A GPIO pin","A CSV file","Inside sensor-cloud, handling end-user requests and deciding to serve cached data or re-cache"],"a":3,"w":"That defines IC."},{"q":"External cache (EC) is:","o":["Inside sensor-cloud handling requests","A router","A separate server/hardware storing readings and refreshing them at intervals","A relay"],"a":2,"w":"That defines EC."},{"q":"Acceptable data freshness in caching depends on:","o":["The application","The brand of sensor","The wire colour","The OS name"],"a":0,"w":"Freshness requirements depend on the application."}]},{"title":"Sensor-Cloud Pricing (pH and pI) and Exam Traps","summary":"Pricing separates pH (hardware/sensor-related component) and pI (infrastructure-related component) and balances SCSP, sensor owner and end-user interests. The material does not give a complete pricing equation, so none should be invented. Traps: SCSP manages the service, owner owns sensors, user consumes; IC and EC differ in location/role.","qs":[{"q":"Does the supplied material provide a complete pricing equation?","o":["Yes, a full formula is given","Yes, only for pH","Yes, only for pI","No; do not invent one"],"a":3,"w":"The notes say no complete equation is provided."}]},{"title":"Fog Computing — Definition and the Cloud-Only Problem","summary":"Fog computing extends cloud-like processing and temporary storage closer to IoT devices via an intermediate layer, helping time-sensitive decisions avoid a distant cloud round trip. Cloud-only processing can cause delay; IoT devices have limited bandwidth, processing, memory and energy; communication can consume a significant share of device energy; some applications need responses within a fraction of a second.","qs":[{"q":"Fog computing is:","o":["Cloud-like processing and temporary storage extended closer to IoT devices via an intermediate layer","A type of servo","A DTN protocol","A billing method"],"a":0,"w":"This is the definition."},{"q":"Why can cloud-only processing be a problem for IoT?","o":["Clouds cannot store data","Clouds have no CPUs","Sending all raw data to a distant cloud can cause delay","Devices have infinite bandwidth"],"a":2,"w":"Delay and bandwidth constraints arise."},{"q":"Which is a device-side limitation noted for IoT devices?","o":["Infinite memory","Unlimited battery","No radio","Limited bandwidth, processing, memory and energy"],"a":3,"w":"Devices are constrained."},{"q":"Some IoT applications need a response within:","o":["Several hours","A fraction of a second","One day","One week"],"a":1,"w":"Time-critical applications need sub-second responses."}]},{"title":"Cloud Round-Trip Latency Formula","summary":"L = T(device → cloud) + T(analysis) + T(cloud → device). Convert all terms to the same unit before adding. Example: 0.18 s + 0.04 s + 0.13 s = 0.35 s = 350 ms.","qs":[{"q":"Which formula gives the cloud round-trip latency?","o":["L = T(device→cloud) + T(analysis) + T(cloud→device)","L = T(device→cloud) − T(analysis)","L = T(analysis) only","L = T(device→cloud) × T(cloud→device)"],"a":0,"w":"L is the sum of upload, analysis and download times."},{"q":"In the notes' example, 0.18 s + 0.04 s + 0.13 s equals:","o":["0.35 ms","3.5 s","0.35 s (350 ms)","35 ms"],"a":2,"w":"0.18 + 0.04 + 0.13 = 0.35 s = 350 ms."},{"q":"Compute L: device→cloud = 120 ms, analysis = 30 ms, cloud→device = 100 ms.","o":["250 ms","150 ms","220 ms","300 ms"],"a":0,"w":"120 + 30 + 100 = 250 ms."},{"q":"Compute L: 0.2 s up, 50 ms analysis, 0.1 s down.","o":["0.35 ms","2.6 s","350 ms","250 ms"],"a":2,"w":"Convert to ms: 200 + 50 + 100 = 350 ms."},{"q":"Before adding the terms in the latency formula you must:","o":["Multiply each term by 2","Convert them to the same unit","Delete the analysis term","Leave them in mixed units"],"a":1,"w":"The notes: add all terms after converting to the same unit."}]},{"title":"Fog Processing Tiers","summary":"Very time-sensitive data are processed at the nearest fog node (fraction of a second). Less time-sensitive data go to an aggregate fog node (seconds to minutes). Flow: device → nearest fog node → immediate action back to the device; less urgent data → aggregate fog node → summaries/long-term records → cloud.","qs":[{"q":"Where is very time-sensitive data processed?","o":["Aggregate fog node","Cloud only","Sink","Nearest fog node"],"a":3,"w":"Nearest fog node handles very time-sensitive data."},{"q":"Typical timing for the nearest fog node:","o":["Seconds to minutes","Hours","Fraction of a second","Days"],"a":2,"w":"Per the tier table."},{"q":"Where is less time-sensitive data processed?","o":["Aggregate fog node","Nearest fog node","Device only","Relay"],"a":0,"w":"Aggregate fog node."},{"q":"Typical timing for the aggregate fog node:","o":["Fraction of a second","Milliseconds only","Hours only","Seconds to minutes"],"a":3,"w":"Per the tier table."},{"q":"Where do summaries and long-term records go?","o":["Nearest fog node only","Cloud","Servo","Sensor"],"a":1,"w":"Summaries/long-term records go to cloud."}]},{"title":"Fog Advantages, Challenges and Applications","summary":"Advantages: faster response for safety-critical events, reduced bandwidth, potential privacy benefits, security policies applied near devices, support for mobile/remote/harsh deployments, applications deployed near the service. Challenges: distributed security management, reliability/fault tolerance, additional power consumption, real-time analysis at scale, programming/framework complexity, nodes moving/joining/leaving. Applications: real-time health/emergency monitoring, power-efficient systems, railway-track monitoring, oil/gas pipeline monitoring, windmill/turbine analysis.","qs":[{"q":"Which is an advantage of fog computing?","o":["Always lower power than the cloud","Faster response for safety-critical events","Removes all security needs","Eliminates all latency"],"a":1,"w":"Faster response is the first listed advantage."},{"q":"Local filtering/aggregation in the fog leads to:","o":["Increased bandwidth use","Slower alarms","No privacy","Reduced bandwidth use"],"a":3,"w":"Reduced bandwidth."},{"q":"Which is a potential privacy benefit of fog?","o":["Sensitive data can remain local","All data must go to the cloud","No encryption allowed","Data is public"],"a":0,"w":"Sensitive data may remain local."},{"q":"Which is a challenge for fog computing?","o":["Unlimited reliability","No power consumption","Distributed security management","Zero programming complexity"],"a":2,"w":"Distributed security is a listed challenge."},{"q":"Fog nodes introduce which energy-related challenge?","o":["Zero power","Infinite battery","No heat","Additional power consumption"],"a":3,"w":"Additional power consumption is listed."},{"q":"Which is a fog challenge related to node dynamics?","o":["Nodes never change","Nodes may move, join or leave the system","Only one node exists","Nodes are always cloud VMs"],"a":1,"w":"That is one of the listed challenges."},{"q":"Which is a fog application in the course?","o":["Railway-track monitoring","Image printing","Text editing","Audio mixing"],"a":0,"w":"Listed with health monitoring, pipelines and windmill/turbine analysis."},{"q":"Which is also listed as a fog application?","o":["Typing tutor","Video editing","Oil/gas pipeline monitoring and optimization","Spreadsheet design"],"a":2,"w":"Pipeline monitoring is listed."}]},{"title":"Fog vs Cloud vs Sensor-Cloud","summary":"Cloud: on-demand compute and long-term storage; large-scale processing and history. Sensor-cloud: sensing resources as a service; virtualize and manage sensing; access/composition of sensor resources. Fog: near-device processing for timely response; process selected data closer to devices; low latency and less data transmission.","qs":[{"q":"Main purpose of cloud:","o":["On-demand compute and long-term storage","Near-device processing","Sensing as a service","Servo control"],"a":0,"w":"Cloud = on-demand compute/storage."},{"q":"Main purpose of fog:","o":["Sensing as a service","Near-device processing for timely response","Large history store","Billing"],"a":1,"w":"Fog = timely, near-device processing."},{"q":"Typical benefit of sensor-cloud:","o":["Low latency only","Large history only","Access/composition of sensor resources","Servo positioning"],"a":2,"w":"Sensor-cloud offers access/composition."}]}]},{"title":"WEEK 10 — Smart Cities, Data Fusion, Smart Homes and Connected Vehicles","topics":[{"title":"1. Smart cities: definition and need","summary":"A smart city uses Information and Communication Technology (ICT) to make urban infrastructure more interactive, accessible and efficient; value comes from integrated services, not merely many devices. Needed because of rapid urban population growth, depletion of natural resources, and environmental/climate change.","qs":[{"q":"A smart city uses:","o":["Only cameras","ICT to make urban infrastructure more interactive, accessible and efficient","Only more roads","Only buildings"],"a":1,"w":"This is the definition."},{"q":"ICT stands for:","o":["Integrated Circuit Technology","Information and Communication Technology","Internet and Cable Technology","Internal Control Terminal"],"a":1,"w":"ICT = Information and Communication Technology."},{"q":"A smart city's value comes from:","o":["Only energy use","The number of devices alone","Only taxes","Integrated services, not simply from having many devices"],"a":3,"w":"The notes emphasise integrated services."},{"q":"Which is NOT listed as a reason smart cities are needed?","o":["Environmental and climate change","Depletion of natural resources","Decrease in internet usage","Rapid urban population growth"],"a":2,"w":"The three reasons are population growth, resource depletion and environmental changes."}]},{"title":"2. Human-body analogy","summary":"Skeleton = buildings, industries, people; skin = transportation and logistics; organs = hospitals, police, banks, schools; brain = embedded intelligence; nerves = digital telecommunication networks; sensory organs = sensors and tags; cognition = software.","qs":[{"q":"In the body analogy, the \"brain\" of a smart city is:","o":["Telecom networks","Transport","Buildings","Embedded intelligence"],"a":3,"w":"Brain = embedded intelligence."},{"q":"In the body analogy, \"nerves\" correspond to:","o":["Sensors","Digital telecommunication networks","Hospitals","Software"],"a":1,"w":"Nerves = digital telecom networks."},{"q":"\"Sensory organs\" correspond to:","o":["Sensors and tags","Roads","Software","Banks"],"a":0,"w":"Sensors and tags sense the environment."},{"q":"\"Skin\" corresponds to:","o":["Transportation and logistics","Schools","Buildings","Software"],"a":0,"w":"Skin = transportation and logistics."},{"q":"\"Skeleton\" corresponds to:","o":["Hospitals","Sensors","Software","Buildings, industries, people"],"a":3,"w":"Skeleton = buildings, industries, people."},{"q":"\"Organs\" correspond to:","o":["Tags","Telecom","Embedded intelligence","Hospitals, police, banks, schools"],"a":3,"w":"Organs = key institutions."},{"q":"\"Cognition\" corresponds to:","o":["Brain","Software","Skin","Nerves"],"a":1,"w":"Cognition = software."}]},{"title":"3. Six smart-city focus areas and applications","summary":"Smart Economy (competitiveness), Smart Governance (citizen participation), Smart People (social and human capital), Smart Mobility (transport and ICT), Smart Environment (natural resources), Smart Living (quality of life). Applications: smart homes/health monitoring, smart parking, connected vehicles, pollution/calamity monitoring, smart energy, smart agriculture.","qs":[{"q":"Smart Economy emphasises:","o":["Natural resources","Competitiveness","Citizen participation","Quality of life"],"a":1,"w":"Smart Economy → competitiveness."},{"q":"Smart Governance emphasises:","o":["Transport","Quality of life","Competitiveness","Citizen participation"],"a":3,"w":"Governance → citizen participation."},{"q":"Smart People emphasises:","o":["Competitiveness","Resources","Transport","Social and human capital"],"a":3,"w":"People → social/human capital."},{"q":"Smart Mobility emphasises:","o":["Quality of life","Transport and ICT","Governance","Natural resources"],"a":1,"w":"Mobility → transport and ICT."},{"q":"Smart Environment emphasises:","o":["Natural resources","Social capital","Citizen participation","Competitiveness"],"a":0,"w":"Environment → natural resources."},{"q":"Smart Living emphasises:","o":["Transport","Competitiveness","Governance","Quality of life"],"a":3,"w":"Living → quality of life."},{"q":"How many smart-city focus areas are listed?","o":["4","5","6","7"],"a":2,"w":"Economy, Governance, People, Mobility, Environment, Living = 6."},{"q":"Which is a smart-city application listed?","o":["Smart parking","Pollution/calamity monitoring","Smart agriculture","All of the above"],"a":3,"w":"All are listed applications."}]},{"title":"4. Smart-city data pipeline and challenges","summary":"Pipeline: Collection → Transmission → Storage → Processing. Collection: sensors/mobile devices observe events; transmission: networks move observations; storage: local/remote/warehouse/cloud; processing: cleaning, analytics, prediction. Challenges: security/privacy, heterogeneity/interoperability, reliability, scale and mobility, legal/consent, big data, sensor choice/placement/energy/network architecture. Exam trap: collecting data ≠ fusing it; a sensor network is an enabling technology, not the service itself.","qs":[{"q":"The correct order of the smart-city data pipeline is:","o":["Transmission → Collection → Processing → Storage","Collection → Transmission → Storage → Processing","Storage → Collection → Processing → Transmission","Processing → Storage → Transmission → Collection"],"a":1,"w":"This is the pipeline order in the notes."},{"q":"Processing in the pipeline includes:","o":["Cleaning, analytics and prediction","Only transmission","Only storing","Only sensing"],"a":0,"w":"Processing turns data into useful results."},{"q":"Storage in the pipeline can be:","o":["None","Only local","Local, remote, warehouse or cloud","Only cloud"],"a":2,"w":"All are listed."},{"q":"Which is a smart-city challenge listed?","o":["Security and privacy","Heterogeneity and interoperability","Legal issues and informed consent","All of the above"],"a":3,"w":"All are listed."},{"q":"Exam trap: a sensor network is:","o":["An enabling technology, not the service itself","Not needed","The smart-city service itself","Always sufficient"],"a":0,"w":"The notes say it's an enabling technology."}]},{"title":"5. Data fusion: definition and motivation","summary":"Data fusion combines information from multiple sources/sensors to produce a richer, more useful understanding, estimate or decision than isolated streams. Reasons: complementary sensors; improved basis for decisions; low-power/low-precision sensors can collectively help; fusion across platforms.","qs":[{"q":"Data fusion is:","o":["Combining information from multiple sources/sensors to produce richer understanding or decisions","Encrypting data","Storing data","Deleting duplicate data only"],"a":0,"w":"This is the definition."},{"q":"Why use data fusion?","o":["Different sensors provide complementary information","Combined data can improve the basis for decisions","Low-power/low-precision sensors may collectively give useful information","All of the above"],"a":3,"w":"All are listed reasons."}]},{"title":"6. Data-fusion challenges","summary":"Imperfection: inaccurate or uncertain measurements. Ambiguity: outliers or missing data. Conflict: sources disagree. Alignment: convert data into a common frame/representation. Trivial features: distinguish useful information from features adding little value.","qs":[{"q":"Imperfection in data fusion means:","o":["Common frame conversion","Sources disagree","Inaccurate or uncertain measurements","Missing frames"],"a":2,"w":"Imperfection = inaccurate/uncertain data."},{"q":"Ambiguity (as categorised in the guide) refers to:","o":["Common-frame conversion","Sources disagreeing","Outliers or missing data","Trivial features"],"a":2,"w":"Ambiguity = outliers/missing data."},{"q":"Conflict means:","o":["Data are aligned","Measurements are noisy","Data are missing","Different sources disagree"],"a":3,"w":"Conflict = disagreement among sources."},{"q":"Alignment involves:","o":["Encrypting data","Converting data into a common frame or representation","Deleting data","Adding sensors"],"a":1,"w":"Data from different sources must be put on a common basis."},{"q":"Trivial features:","o":["Distinguishing useful information from features that add little value","Aligning frames","Combining decisions","Fusing images only"],"a":0,"w":"This is the stated challenge."}]},{"title":"7. Fusion levels and method families","summary":"Decision level: combine an ensemble of decisions. Feature level: combine extracted features before decision-making. Pixel level: combine information at the imaging-device/pixel level. Method families: probability-based (Bayesian, statistics, recursive), AI-based (ANN, ML, deep learning, CNN), evidence-based (belief functions, transferable belief models).","qs":[{"q":"Decision-level fusion combines:","o":["Only features","Raw pixels","An ensemble of decisions","Only sensors"],"a":2,"w":"Memory cue: combine decisions."},{"q":"Feature-level fusion combines:","o":["Pixels","Final decisions","Packets","Extracted features before decision-making"],"a":3,"w":"Memory cue: combine features."},{"q":"Pixel-level fusion combines:","o":["Sensors","Features","Decisions","Information at the imaging-device/pixel level (image representations)"],"a":3,"w":"Memory cue: combine image representations."},{"q":"Which is a probability-based fusion method?","o":["CNN","Transferable belief models","Belief functions","Bayesian analysis"],"a":3,"w":"Probability-based: Bayesian analysis, statistics, recursive methods."},{"q":"Which is an AI-based fusion method?","o":["Convolutional neural networks (CNN)","Belief functions","Recursive statistics","Bayesian analysis"],"a":0,"w":"AI-based: ANN, ML, deep learning, CNN."},{"q":"Evidence-based fusion uses:","o":["Bayesian only","Pixels","Belief functions and transferable belief models","Neural networks"],"a":2,"w":"These are the evidence-based methods."},{"q":"In an autonomous-vehicle example, fusion may combine:","o":["Only GPS","Only a camera","Only ultrasonic","LiDAR, ultrasonic sensors, cameras and GPS/satellite information"],"a":3,"w":"The course mentions these sources for environmental awareness."},{"q":"Why use AI in sensor-to-actuator systems?","o":["To avoid actuators","To avoid data","To remove sensors","To combine information from multiple sources rather than act directly on one or two raw sensor values"],"a":3,"w":"Intelligence fuses multiple sources before acting."}]},{"title":"8. Smart parking","summary":"Smart parking detects vacant spaces, guides drivers and potentially supports automatic charging, reducing search time, traffic, pollution, fuel use and cost. Functional stages: information collection → system deployment → service dissemination. Stationary sensing uses many fixed sensors; mobile sensing uses fewer sensors carried along routes.","qs":[{"q":"The purpose of smart parking is to:","o":["Remove roads","Block cars","Detect vacant spaces and guide drivers","Increase traffic"],"a":2,"w":"Also reduces search time, traffic, pollution and fuel use."},{"q":"The functional stages of smart parking are:","o":["Information collection → system deployment → service dissemination","Service dissemination → collection → deployment","Collection → dissemination → deployment","Deployment → dissemination → collection"],"a":0,"w":"This is the stated order."},{"q":"Stationary sensing in smart parking uses:","o":["Only RFID","Many fixed sensors detecting occupancy","Only drones","Few mobile sensors"],"a":1,"w":"Stationary = many fixed sensors."},{"q":"Mobile sensing in smart parking uses:","o":["Only cameras","Many fixed sensors","Fewer sensors carried along routes","No sensors"],"a":2,"w":"Mobile sensing uses fewer, moving sensors."}]},{"title":"9. Energy management and energy harvesting","summary":"Energy-efficiency approaches: lightweight communication protocols, scheduling, predictive models, cloud-based approaches, low-power transceivers, cognitive management. Ambient harvesting collects energy available in the environment (RF, wind, sunlight, heat, vibration); dedicated harvesting uses an intentionally placed source (e.g. a nearby solar panel).","qs":[{"q":"Which is an energy-efficiency approach listed?","o":["Lightweight communication protocols","Scheduling","Low-power transceivers","All of the above"],"a":3,"w":"All are in the list."},{"q":"Ambient energy harvesting:","o":["Uses cables","Uses an intentionally placed source","Collects energy already available in the surroundings (RF, wind, sunlight, heat, vibration)","Uses a battery only"],"a":2,"w":"Ambient = environmental energy."},{"q":"Dedicated energy harvesting:","o":["Is wasteful","Uses energy from the surroundings only","Intentionally places an energy source near the IoT device (e.g. a nearby solar panel)","Uses cables"],"a":2,"w":"Dedicated = intentionally deployed source."},{"q":"Exam trap: ambient versus dedicated?","o":["Both use cables","Ambient = already available in surroundings; dedicated = intentionally deployed for the device","They are the same","Ambient = intentionally deployed; dedicated = already available"],"a":1,"w":"This is the stated distinction."}]},{"title":"10. Smart homes and Home Area Networks (HAN)","summary":"A smart home integrates household devices and services for automation, security, safety, media, communication and remote access/control. A HAN is a network bounded to the home that connects household devices. Wired HAN can reuse existing wiring and may be low cost; wireless HAN is easier to install and supports mobility/flexible placement.","qs":[{"q":"A HAN is:","o":["A network bounded to the home that connects household devices and systems","A satellite link","A city-wide backbone","A cellular network"],"a":0,"w":"This is the definition."},{"q":"Wired HAN advantage:","o":["Mobility","Flexible placement","Easiest installation","Can reuse existing wiring/infrastructure and may be low cost"],"a":3,"w":"Wired HAN reuses wiring."},{"q":"Wireless HAN advantage:","o":["Usually easier to install and supports mobility/flexible placement","Reuses wiring","Requires cables","Uses power lines"],"a":0,"w":"Wireless HAN is flexible."},{"q":"A smart home integrates:","o":["Only fans","Household devices and services for automation, security, safety, media, communication and remote access/control","Only doors","Only lights"],"a":1,"w":"This is the definition."}]},{"title":"11. HAN standards","summary":"UPnP: application-layer/web-based discovery, zero configuration. DLNA: domestic media sharing. KNX: multiple media/technologies for home and building automation. LonWorks: associated with the Neuron chip. ZigBee: four layers; IEEE 802.15.4 provides PHY and MAC; ZigBee provides network and application layers. X-10: low-speed power-line control.","qs":[{"q":"UPnP is associated with:","o":["Power-line","Neuron chip","Application-layer/web-based discovery and zero configuration","Media sharing"],"a":2,"w":"UPnP = discovery/zero-config."},{"q":"DLNA is associated with:","o":["Neuron chip","Power-line control","Zero configuration","Domestic media sharing"],"a":3,"w":"DLNA = media sharing."},{"q":"KNX is associated with:","o":["Power-line only","Neuron chip","Media sharing","Multiple media/technologies for home and building automation"],"a":3,"w":"KNX supports multiple media."},{"q":"LonWorks is associated with:","o":["UPnP","X-10","The Neuron chip","DLNA"],"a":2,"w":"LonWorks ↔ Neuron chip."},{"q":"X-10 is:","o":["Low-speed power-line control","Media sharing","Wireless audio","High-speed fibre"],"a":0,"w":"X-10 uses power lines at low speed."},{"q":"In the ZigBee HAN stack, IEEE 802.15.4 provides:","o":["Only security","Network and application layers","PHY and MAC","Only application"],"a":2,"w":"ZigBee supplies network and application layers."},{"q":"Exam trap: UPnP versus DLNA.","o":["UPnP = discovery/zero-config; DLNA = media","Both = media","Both = power-line","UPnP = media; DLNA = discovery"],"a":0,"w":"This is the stated distinction."}]},{"title":"12. HAN architectures and initiatives","summary":"DomoNet: central gateway, XML/web services, service-oriented architecture (SOA). Jini: Java/JVM-based distributed resource sharing, without a central node. HYDRA: middleware with device client/proxy. Amigo: ambient intelligence, interoperability, user-friendly interfaces and discovery.","qs":[{"q":"DomoNet uses:","o":["A central gateway with XML/web services and SOA","Ambient intelligence","Neuron chip","Java/JVM without a central node"],"a":0,"w":"DomoNet = central gateway/SOA."},{"q":"Jini is:","o":["Power-line","XML only","Central gateway","Java/JVM-based distributed resource sharing, described as having no central node"],"a":3,"w":"Jini = distributed Java architecture."},{"q":"HYDRA is:","o":["Middleware with device client/proxy","Neuron chip","SOA","Media sharing"],"a":0,"w":"HYDRA = middleware with device client/proxy."},{"q":"Amigo focuses on:","o":["Central gateway","Power lines","Neuron chips","Ambient intelligence, interoperability, user-friendly interfaces and discovery"],"a":3,"w":"These are Amigo's stated aims."},{"q":"Exam trap: DomoNet versus Jini.","o":["Both = central gateway","DomoNet = central gateway/SOA; Jini = Java/JVM distributed architecture","DomoNet = Java/JVM distributed; Jini = central gateway/SOA","Both = JVM"],"a":1,"w":"This is the stated distinction."}]},{"title":"13. Connected vehicles: communication types and vehicular cloud","summary":"A stand-alone vehicle has sensors and embedded systems; a connected vehicle also exchanges information with other devices, vehicles, infrastructure or people. In-vehicle: devices within one vehicle; V2V: vehicle-to-vehicle; V2I: vehicle-to-infrastructure (e.g. roadside unit); V2P: vehicle-to-pedestrian/person. The vehicular cloud shares data with stakeholders.","qs":[{"q":"V2V stands for:","o":["Vision-to-Vehicle","Value-to-Vehicle","Vehicle-to-Voice","Vehicle-to-Vehicle"],"a":3,"w":"V2V = vehicle-to-vehicle."},{"q":"V2I refers to:","o":["Vehicle-to-Item","Vehicle-to-Input","Vehicle-to-Infrastructure (e.g. a roadside unit)","Vehicle-to-Internet only"],"a":2,"w":"V2I = vehicle-to-infrastructure."},{"q":"V2P refers to:","o":["Vehicle-to-Port","Vehicle-to-Power","Vehicle-to-Protocol","Vehicle-to-Pedestrian/person"],"a":3,"w":"V2P = pedestrian/person."},{"q":"In-vehicle communication is:","o":["Between vehicles","With infrastructure","Communication among devices within one vehicle","With pedestrians"],"a":2,"w":"In-vehicle = inside a single vehicle."},{"q":"A connected vehicle differs from a stand-alone vehicle because it:","o":["Has no sensors","Exchanges information with other devices, vehicles, infrastructure or people","Has no embedded systems","Cannot move"],"a":1,"w":"Connectivity is the difference."},{"q":"Which is a vehicular-cloud stakeholder named in the course?","o":["Law enforcement","Automobile companies","Cloud-service providers","All of the above"],"a":3,"w":"Academia, law enforcement, automobile companies, government, standardization groups and cloud providers are listed."}]},{"title":"14. Connected-vehicle challenges and VANETs","summary":"Challenges: security, privacy, scalability, reliability/QoS, global standards/interoperability. A VANET (Vehicular Ad-hoc Network) supports communication among vehicles and related roadside/network entities. Properties: highly dynamic topology, appearing/disappearing links, road-constrained mobility, large and changing numbers of vehicles, powerful vehicle devices but unstable links.","qs":[{"q":"VANET stands for:","o":["Vehicle Access Node","Visual Ad-hoc Net","Vehicular Ad-hoc Network","Variable Area Network"],"a":2,"w":"VANET = Vehicular Ad-hoc Network."},{"q":"A key VANET property is:","o":["Static topology","Only wired links","Highly dynamic topology because vehicles move","No mobility"],"a":2,"w":"Moving vehicles change the topology."},{"q":"Mobility in VANETs is:","o":["Absent","Constrained by roads","Unconstrained","Random in all directions"],"a":1,"w":"Mobility is constrained by roads."},{"q":"The privacy challenge in connected vehicles arises because:","o":["Roads are public","There is no data","Vehicles are silent","Movement/location data can be exposed"],"a":3,"w":"Location data exposure threatens privacy."},{"q":"The security challenge in connected vehicles is that:","o":["There is no wireless","Wireless messages may be attacked or altered","No sensors","Messages are perfect"],"a":1,"w":"This is the stated security issue."},{"q":"The scalability challenge arises because:","o":["Topology is fixed","There are few vehicles","Vehicles never move","Vehicles continually enter/leave areas and traffic loads change"],"a":3,"w":"Dynamic vehicle populations stress scalability."}]},{"title":"15. Content-Centric Networking (CCN)","summary":"CCN is a content-oriented alternative to endpoint/location-oriented communication; content is requested by a unique content name. FIB (Forwarding Information Base) forwards by content-name prefixes; CS (Content Store) caches content chunks. In VANET + CCN, caching helps dissemination but dynamic topology and unstable links remain challenges.","qs":[{"q":"In CCN, content is requested by:","o":["Port number","A unique content name","IP address","MAC address"],"a":1,"w":"CCN is content-oriented."},{"q":"FIB stands for:","o":["Forwarding Information Base","File Interchange Block","Fixed Interface Buffer","Fast Internet Backbone"],"a":0,"w":"FIB = Forwarding Information Base."},{"q":"The FIB:","o":["Encrypts data","Caches content","Supports forwarding based on content-name prefixes","Stores sensors"],"a":2,"w":"FIB forwards using name prefixes."},{"q":"The Content Store (CS):","o":["Encrypts traffic","Names content","Caches content chunks/data","Forwards by prefix"],"a":2,"w":"CS = cache."},{"q":"Exam trap: FIB versus CS.","o":["Both cache","FIB forwards; CS caches","Both forward","FIB caches; CS forwards"],"a":1,"w":"The notes say FIB forwards; Content Store caches."}]},{"title":"16. Connected-vehicle body-and-brain architecture","summary":"Three layers in order: (1) Sense/execution layer — senses the environment and performs actions; (2) Network/transmission layer — communication bridge between sensing/execution and decision-making; (3) Decision layer — processes information and selects decisions/actions.","qs":[{"q":"The first layer of the body-and-brain architecture is:","o":["Decision layer","Sense/execution layer","Application layer","Network/transmission layer"],"a":1,"w":"Order: sense/execution → network/transmission → decision."},{"q":"The network/transmission layer is:","o":["Where sensing occurs","Where decisions are made","The communication bridge between sensing/execution and decision-making","Where actions are executed"],"a":2,"w":"It links the body (sensing/execution) with the brain (decision)."},{"q":"The decision layer:","o":["Executes only","Transmits only","Senses","Processes information and selects decisions/actions"],"a":3,"w":"It is the \"brain\"."}]},{"title":"17. Intelligent Connected Vehicles (ICVs)","summary":"An ICV combines vehicle connectivity with intelligent processing and safety/transport applications. Course-slide facts: 75 MHz spectrum at 5850–5925 MHz, DSRC, IEEE 802.11p, IEEE 1609 family, SAE J2735/J2945 (not verified current regulatory guidance). IEEE 1609.4 is associated with WAVE multichannel operations. Phase 1: 2G/3G, infotainment, remote processing; Phase 2: 4G LTE/DSRC and ITS; Phase 3: cloud-connected vehicles.","qs":[{"q":"The ICV spectrum allocation mentioned in the slides is:","o":["865.2 MHz","75 MHz at 5850–5925 MHz","20 MHz at 2.4 GHz","13.56 MHz"],"a":1,"w":"5925 − 5850 = 75 MHz (course-slide fact)."},{"q":"IEEE 1609.4 is associated with:","o":["Bluetooth","WAVE multichannel operations","Z-Wave","NFC"],"a":1,"w":"The course links 1609.4 to WAVE multichannel operations."},{"q":"The ICV communication stack in the slides includes:","o":["Only NFC","DSRC and IEEE 802.11p","Only Z-Wave","Only Bluetooth"],"a":1,"w":"DSRC/WAVE is presented as the stack, with 802.11p."},{"q":"Which standards are mentioned for connected vehicles in the slides?","o":["ISO 9000","USB 3.0","HDMI","SAE J2735 and J2945"],"a":3,"w":"SAE J2735/J2945 are named."},{"q":"ICV Phase 1 is:","o":["Cloud-connected vehicles","2G/3G, infotainment and remote processing","5G","4G LTE/DSRC"],"a":1,"w":"Phase 1 = 2G/3G, infotainment."},{"q":"ICV Phase 2 is:","o":["Infotainment only","Cloud-connected vehicles","2G/3G","4G LTE/DSRC and intelligent transport systems"],"a":3,"w":"Phase 2 = 4G LTE/DSRC and ITS."},{"q":"ICV Phase 3 is:","o":["Cloud-connected vehicles","Infotainment","2G/3G","DSRC"],"a":0,"w":"Phase 3 = cloud-connected vehicles."},{"q":"Which is a listed V2X advantage?","o":["Reduced travel time","Improved driver safety","Assistance in low visibility/bad weather","All of the above"],"a":3,"w":"All three are listed."},{"q":"The listed V2X disadvantage is:","o":["More accidents","Tracking of vehicle movements, raising privacy concerns","Slower cars","Higher fuel use"],"a":1,"w":"Privacy is the stated disadvantage."}]},{"title":"Smart City — Definition and Why It Is Needed","summary":"A smart city uses Information and Communication Technology (ICT) to make urban infrastructure more interactive, accessible and efficient; its value comes from integrated services, not simply from having many devices. Needed due to rapid urban population growth, depletion of natural resources, and environmental/climate changes.","qs":[{"q":"ICT in 'smart city' stands for:","o":["Information and Communication Technology","Internet Control Terminal","Integrated Cloud Technology","Intelligent Circuit Theory"],"a":0,"w":"A smart city uses ICT."},{"q":"The value of a smart city comes mainly from:","o":["Merely having many devices","Only having many cameras","Only fast cars","Integrated services"],"a":3,"w":"The notes: value comes from integrated services, not simply many devices."},{"q":"Which is NOT listed as a reason for smart cities?","o":["Rapid urban population growth","Decline in urban population","Depletion of natural resources","Environmental and climate changes"],"a":1,"w":"The three reasons are growth, depletion and environmental change."},{"q":"How many reasons for needing smart cities are listed?","o":["Two","Three","Four","Six"],"a":1,"w":"Population growth, resource depletion, environment/climate."}]},{"title":"Smart City — Human-Body Analogy","summary":"Skeleton = buildings, industries, people; Skin = transportation and logistics; Organs = hospitals, police, banks, schools; Brain = embedded intelligence; Nerves = digital telecommunication networks; Sensory organs = sensors and tags; Cognition = software.","qs":[{"q":"In the human-body analogy, nerves correspond to:","o":["Sensors and tags","Software","Hospitals","Digital telecommunication networks"],"a":3,"w":"Nerves = digital telecom networks."},{"q":"The brain corresponds to:","o":["Transportation","Schools","Embedded intelligence","Buildings"],"a":2,"w":"Brain = embedded intelligence."},{"q":"The skin corresponds to:","o":["Software","Police","Industries","Transportation and logistics"],"a":3,"w":"Skin = transportation and logistics."},{"q":"The skeleton corresponds to:","o":["Buildings, industries and people","Hospitals","Networks","Software"],"a":0,"w":"Skeleton = buildings, industries, people."}]},{"title":"Six Smart-City Focus Areas and Applications","summary":"Smart Economy (competitiveness), Smart Governance (citizen participation), Smart People (social and human capital), Smart Mobility (transport and ICT), Smart Environment (natural resources), Smart Living (quality of life). Applications: smart homes and health monitoring, smart parking, connected vehicles, pollution/calamity monitoring, smart energy, smart agriculture.","qs":[{"q":"Which area emphasises competitiveness?","o":["Smart Economy","Smart Living","Smart People","Smart Mobility"],"a":0,"w":"Smart Economy = competitiveness."},{"q":"Which area emphasises citizen participation?","o":["Smart Economy","Smart Environment","Smart Governance","Smart Mobility"],"a":2,"w":"Smart Governance = citizen participation."},{"q":"Which area emphasises social and human capital?","o":["Smart Governance","Smart People","Smart Living","Smart Economy"],"a":1,"w":"Smart People = social and human capital."},{"q":"Which area emphasises transport and ICT?","o":["Smart Environment","Smart People","Smart Economy","Smart Mobility"],"a":3,"w":"Smart Mobility = transport and ICT."},{"q":"Which area emphasises natural resources?","o":["Smart Living","Smart Governance","Smart Environment","Smart Mobility"],"a":2,"w":"Smart Environment = natural resources."},{"q":"Which area emphasises quality of life?","o":["Smart Living","Smart Economy","Smart People","Smart Environment"],"a":0,"w":"Smart Living = quality of life."},{"q":"Which is a smart-city application listed in the notes?","o":["Retail coupon printing","Video game rendering","Photo filters","Smart agriculture"],"a":3,"w":"Applications include smart agriculture."},{"q":"Which is also a listed application?","o":["Social media sharing only","Pollution/calamity monitoring","Typing tests","Wallpaper design"],"a":1,"w":"Listed among smart-city applications."}]},{"title":"Smart-City Data Pipeline","summary":"Collection → Transmission → Storage → Processing. Collection: sensors/mobile devices observe events; Transmission: networks move observations; Storage: local, remote, warehouse or cloud; Processing: cleaning, analytics and prediction turn data into useful results.","qs":[{"q":"Which is the correct order of the smart-city data pipeline?","o":["Processing → Storage → Transmission → Collection","Collection → Transmission → Storage → Processing","Storage → Collection → Processing → Transmission","Transmission → Collection → Processing → Storage"],"a":1,"w":"The pipeline order given in the notes."},{"q":"Which stage includes cleaning, analytics and prediction?","o":["Collection","Transmission","Storage","Processing"],"a":3,"w":"Processing includes cleaning, analytics and prediction."},{"q":"Which stage uses sensors and mobile devices to observe events?","o":["Collection","Storage","Processing","Transmission"],"a":0,"w":"Collection."},{"q":"Which stage moves observations to the relevant system?","o":["Collection","Storage","Transmission","Processing"],"a":2,"w":"Transmission via networks."},{"q":"Storage options include:","o":["Only RAM","Only paper","Only sensors","Local, remote, warehouse or cloud storage"],"a":3,"w":"Storage may be local, remote, warehouse or cloud."}]},{"title":"Smart-City Challenges and Exam Trap","summary":"Challenges: security/privacy; heterogeneity and interoperability; reliability and failure; large-scale deployment and mobility; legal issues and informed consent; big-data transfer/storage/cleaning/processing; sensor choice, placement, energy planning and network architecture. Trap: collecting data is not fusing it; a sensor network is an enabling technology, not the smart-city service itself.","qs":[{"q":"Which is a smart-city challenge?","o":["Excess of free energy","Security and privacy","Absence of data","Too few cables"],"a":1,"w":"Security and privacy is the first listed challenge."},{"q":"'Informed consent' relates to which challenge?","o":["Legal issues","Servo torque","Interrupt latency","CSV delimiters"],"a":0,"w":"Legal issues and informed consent."},{"q":"Heterogeneous hardware/software leads to which challenge?","o":["Fog tiering","Rapid elasticity","Interoperability","Mice flows"],"a":2,"w":"Heterogeneity creates interoperability challenges."},{"q":"Exam trap: a sensor network in a smart city is:","o":["An enabling technology, not the smart-city service itself","The entire smart-city service","A synonym for fusion","A billing model"],"a":0,"w":"The notes state this."},{"q":"Collecting data is:","o":["The same as fusing it","Always fusion","Not the same as fusing it","A form of billing"],"a":2,"w":"Collection ≠ fusion."}]},{"title":"Data Fusion — Definition and Why Use It","summary":"Data fusion combines information from multiple sources/sensors to produce a richer, more useful understanding, estimate or decision than isolated streams. Reasons: different sensors give complementary information; combined data improves decisions; low-power/low-precision sensors may collectively provide useful information; fusion can combine sources across platforms.","qs":[{"q":"Why are different sensors fused?","o":["They always give identical data","They never conflict","They have infinite precision","They provide complementary information"],"a":3,"w":"Complementary information is a reason."},{"q":"Low-power/low-precision sensors in fusion:","o":["Are always useless","Must be removed","May collectively provide useful information","Cannot be combined"],"a":2,"w":"The notes state this."}]},{"title":"Data-Fusion Challenges","summary":"Imperfection (inaccurate/uncertain measurements); ambiguity (outliers or missing data as categorized in the guide); conflict (sources disagree); alignment (convert to a common frame/representation); trivial features (distinguish useful from low-value features).","qs":[{"q":"Inaccurate or uncertain measurements are an example of:","o":["Imperfection","Conflict","Alignment","Trivial features"],"a":0,"w":"Imperfection."},{"q":"Outliers or missing data are categorized in the guide as:","o":["Conflict","Alignment","Imperfection","Ambiguity"],"a":3,"w":"Ambiguity as categorized in the supplied guide."},{"q":"When different sources disagree, the challenge is:","o":["Alignment","Conflict","Imperfection","Ambiguity"],"a":1,"w":"Conflict."},{"q":"Converting data into a common frame or representation is:","o":["Conflict","Alignment","Imperfection","Trivial features"],"a":1,"w":"Alignment."},{"q":"Distinguishing useful information from features that add little value addresses:","o":["Alignment","Conflict","Imperfection","Trivial features"],"a":3,"w":"Trivial features."}]},{"title":"Data-Fusion Levels","summary":"The notes' table (headed 'Four fusion levels') lists three rows: Decision level (combine an ensemble of decisions), Feature level (combine extracted features before decision-making) and Pixel level (combine information at imaging-device/pixel level, i.e., image representations). A fourth level is not given in the supplied notes, so none is invented here.","qs":[{"q":"Which fusion level combines an ensemble of decisions?","o":["Decision level","Feature level","Pixel level","Cache level"],"a":0,"w":"Decision level = combine decisions."},{"q":"Which fusion level combines extracted features before decision-making?","o":["Decision level","Pixel level","Feature level","Packet level"],"a":2,"w":"Feature level."},{"q":"Which fusion level works at the imaging-device/pixel level (image representations)?","o":["Feature level","Decision level","Plane level","Pixel level"],"a":3,"w":"Pixel level = combine image representations."}]},{"title":"Data-Fusion Method Families and AI in Sensor-to-Actuator Systems","summary":"Probability-based: Bayesian analysis, statistics, recursive methods. AI-based: ANN, machine learning, deep learning, CNN. Evidence-based: belief functions, transferable belief models. AI can combine multiple sources instead of acting on one or two raw values; the autonomous-vehicle example uses LiDAR, ultrasonic sensors, cameras and GPS/satellite information.","qs":[{"q":"Bayesian analysis belongs to which fusion family?","o":["AI-based","Probability-based","Evidence-based","Rule-based"],"a":1,"w":"Probability-based: Bayesian, statistics, recursive."},{"q":"ANN and CNN belong to which fusion family?","o":["AI-based","Probability-based","Evidence-based","Statistics-based"],"a":0,"w":"AI-based: ANN, ML, DL, CNN."},{"q":"Belief functions and transferable belief models belong to:","o":["AI-based","Probability-based","Evidence-based methods","Hardware-based"],"a":2,"w":"Evidence-based."},{"q":"CNN stands for:","o":["Convolutional Neural Network","Cloud Node Network","Central Network Node","Cached Neural Network"],"a":0,"w":"CNN = convolutional neural network."},{"q":"Which sources are mentioned for autonomous-vehicle environmental awareness?","o":["Only a DHT sensor","Only RFID","LiDAR, ultrasonic sensors, cameras and GPS/satellite information","Only a servo"],"a":2,"w":"The course example lists these."}]},{"title":"Smart Parking — Purpose and Functional Stages","summary":"Smart parking detects vacant spaces, guides drivers, and can support automatic charging, reducing search time, traffic, pollution, fuel use and search cost. Stages: Information collection → System deployment → Service dissemination. Stationary sensing uses many fixed sensors for occupancy; mobile sensing uses fewer sensors carried along routes.","qs":[{"q":"Which is NOT a benefit of smart parking?","o":["Reduced parking-search time","Increased fuel use","Reduced pollution","Reduced traffic"],"a":1,"w":"Smart parking reduces search time, traffic, pollution and fuel."}]},{"title":"Energy Management in Smart Cities — Efficiency Approaches","summary":"The course lists lightweight communication protocols, scheduling, predictive models, cloud-based approaches, low-power transceivers and cognitive management.","qs":[{"q":"Which is an energy-efficiency approach listed in the course?","o":["High-power transmitters only","Unscheduled constant transmission","Heavy protocols","Low-power transceivers"],"a":3,"w":"Low-power transceivers are listed."},{"q":"Which communication protocols are favoured for energy efficiency?","o":["Heavyweight protocols","Lightweight protocols","No protocols","Only proprietary heavy stacks"],"a":1,"w":"Lightweight communication protocols are listed."},{"q":"Which is also an energy-efficiency approach?","o":["Always-on transmission","Scheduling","Random wake-ups only","Maximising idle power"],"a":1,"w":"Scheduling is listed."}]},{"title":"Energy Harvesting: Ambient vs Dedicated","summary":"Ambient harvesting collects energy already available in the environment (RF, wind, sunlight, heat, vibration). Dedicated harvesting intentionally places an energy source near the IoT device; the example is a nearby solar panel.","qs":[{"q":"Ambient energy harvesting collects:","o":["Energy from a purpose-built source only","Only battery energy","Only mains power","Energy already available in the surroundings (RF, wind, sunlight, heat, vibration)"],"a":3,"w":"Ambient = already available energy."},{"q":"The course example of dedicated harvesting is:","o":["RF from existing towers","Ambient vibration","A nearby solar panel","Wind in the air"],"a":2,"w":"A nearby solar panel."}]},{"title":"Smart Homes and Home Area Networks (HAN)","summary":"A smart home integrates household devices and services for automation, security, safety, media, communication and remote access/control. A HAN is a network bounded to the home that connects household devices and systems.","qs":[{"q":"A smart home integrates household devices for:","o":["Only lighting","Automation, security, safety, media, communication and remote access/control","Only internet browsing","Only cooking"],"a":1,"w":"Per the notes."}]},{"title":"Wired vs Wireless HAN","summary":"Wired HAN: can reuse existing wiring/infrastructure and may be low cost. Wireless HAN: usually easier to install and supports mobility/flexible placement.","qs":[{"q":"Which HAN can reuse existing wiring and may be low cost?","o":["Wired HAN","Wireless HAN","Neither","Both identically"],"a":0,"w":"Wired HAN reuses wiring."},{"q":"Which HAN is usually easier to install and supports flexible placement?","o":["Wired HAN","Neither","Wireless HAN","Fibre only"],"a":2,"w":"Wireless HAN."}]},{"title":"HAN Standards: UPnP, DLNA, KNX, LonWorks, ZigBee, X-10","summary":"UPnP: application-layer/web-based discovery with zero configuration. DLNA: domestic media sharing. KNX: multiple media/technologies for home and building automation. LonWorks: associated with the Neuron chip. ZigBee: four layers; IEEE 802.15.4 provides PHY and MAC while ZigBee provides network and application layers. X-10: low-speed power-line control.","qs":[{"q":"ZigBee has how many layers?","o":["Two","Three","Four","Seven"],"a":2,"w":"ZigBee: four layers."},{"q":"Which standard provides ZigBee's PHY and MAC layers?","o":["IEEE 802.15.4","IEEE 802.11p","IEEE 1609.4","IEEE 802.3"],"a":0,"w":"IEEE 802.15.4 provides PHY and MAC."},{"q":"ZigBee itself provides which layers?","o":["PHY and MAC","Only PHY","Only transport","Network and application layers"],"a":3,"w":"ZigBee provides network and application layers."}]},{"title":"HAN Architectures and Initiatives: DomoNet, Jini, HYDRA, Amigo","summary":"DomoNet: central gateway, XML/web services, service-oriented architecture (SOA). Jini: Java/JVM-based distributed resource sharing, described as distributed without a central node. HYDRA: middleware with device client/proxy. Amigo: ambient intelligence, interoperability, user-friendly interfaces and discovery.","qs":[{"q":"Amigo emphasises:","o":["Only low-speed power lines","Only central gateway","Ambient intelligence, interoperability, user-friendly interfaces and discovery","Only the Neuron chip"],"a":2,"w":"Amigo."},{"q":"Exam trap: DomoNet vs Jini —","o":["DomoNet = JVM; Jini = central gateway","Both are central gateways","Both are power-line standards","DomoNet = central gateway/SOA; Jini = Java/JVM distributed architecture"],"a":3,"w":"The trap in the notes."},{"q":"Exam trap: UPnP vs DLNA —","o":["UPnP = media; DLNA = discovery","UPnP = discovery/zero-config; DLNA = media","Both are media only","Both are power-line"],"a":1,"w":"The trap in the notes."}]},{"title":"Connected Vehicles: Stand-Alone vs Connected and Communication Types","summary":"A stand-alone vehicle may contain sensors and embedded systems; a connected vehicle additionally exchanges information with other devices, vehicles, infrastructure or people. In-vehicle: within one vehicle; V2V: vehicle-to-vehicle; V2I: vehicle-to-infrastructure (e.g., roadside unit); V2P: vehicle-to-pedestrian/person.","qs":[{"q":"What distinguishes a connected vehicle from a stand-alone one?","o":["It also exchanges information with other devices, vehicles, infrastructure or people","It has no sensors","It has no embedded systems","It cannot move"],"a":0,"w":"Connected vehicles exchange information externally."},{"q":"V2V means:","o":["Vehicle-to-infrastructure","Vehicle-to-pedestrian","Vehicle-to-vehicle","In-vehicle"],"a":2,"w":"V2V."},{"q":"V2I means:","o":["Vehicle-to-infrastructure, e.g. roadside unit","Vehicle-to-vehicle","Vehicle-to-person","In-vehicle"],"a":0,"w":"V2I."},{"q":"V2P means:","o":["Vehicle-to-infrastructure","Vehicle-to-vehicle","Vehicle-to-pedestrian/person","Vehicle-to-platform"],"a":2,"w":"V2P."},{"q":"In-vehicle communication is communication:","o":["Between two vehicles","Among devices within one vehicle","With a roadside unit","With pedestrians"],"a":1,"w":"In-vehicle."}]},{"title":"Vehicular Cloud and Connected-Vehicle Challenges","summary":"Connected vehicles send data to cloud systems for analytics and sharing with stakeholders (academia, law enforcement, automobile companies, government agencies, standardization groups, cloud-service providers). Challenges: security, privacy, scalability, reliability/QoS, global standards/interoperability.","qs":[{"q":"In the vehicular cloud, connected vehicles send data to cloud systems for:","o":["Only entertainment","Only charging","Only parking","Analytics and sharing with stakeholders"],"a":3,"w":"Per the notes."},{"q":"Which is a named stakeholder of the vehicular cloud?","o":["Only drivers","Only mechanics","Law enforcement","Only fuel stations"],"a":2,"w":"Stakeholders include academia, law enforcement, automobile companies, government agencies, standardization groups and cloud-service providers."},{"q":"Which is a connected-vehicle challenge?","o":["Security: wireless messages may be attacked or altered","Guaranteed safety of all messages","No privacy issues","Fixed vehicle count"],"a":0,"w":"Security is a challenge."},{"q":"Privacy challenge arises because:","o":["Cars have no data","Roads are secret","Vehicles do not move","Movement/location data can be exposed"],"a":3,"w":"Location data can be exposed."},{"q":"Scalability challenge arises because:","o":["Vehicles never move","Vehicles continually enter/leave areas and traffic loads change","No traffic exists","Only one car exists"],"a":1,"w":"Per the notes."},{"q":"Reliability and QoS means:","o":["Messages can be lost freely","Communication must work well enough for the application","No requirements exist","Only price matters"],"a":1,"w":"Per the notes."},{"q":"Global standards/interoperability means:","o":["Only one country uses it","Standards are unnecessary","Only one brand exists","Systems must coordinate across different settings"],"a":3,"w":"Per the notes."}]},{"title":"VANET — Vehicular Ad-hoc Network","summary":"A VANET supports communication among vehicles and related roadside/network entities. Properties: highly dynamic topology, links appear/disappear, partitions change, mobility constrained by roads, large and changing numbers of vehicles create scalability demands, vehicle devices may have substantial computing capability but links can still be unstable.","qs":[{"q":"The topology of a VANET is:","o":["Completely static","Fixed by cables","Highly dynamic because vehicles move","Identical to a HAN"],"a":2,"w":"Highly dynamic topology."},{"q":"Vehicle devices in VANETs may have:","o":["No computing capability","Substantial computing capability, yet links can be unstable","Unlimited stable links","Only analogue circuits"],"a":1,"w":"Per the notes."},{"q":"A VANET scalability demand arises from:","o":["Large and changing numbers of vehicles","Fixed small number of vehicles","No vehicles","Only one RSU"],"a":0,"w":"Per the notes."}]},{"title":"Content-Centric Networking (CCN) and VANET + CCN","summary":"CCN is a content-oriented alternative to endpoint/location-oriented communication; content is requested by a unique content name. FIB (Forwarding Information Base) forwards based on content-name prefixes; CS (Content Store) caches content chunks. VANET + CCN: caching helps dissemination but dynamic topology and unstable links remain challenges.","qs":[{"q":"What does the FIB do in CCN?","o":["Caches content chunks","Encrypts content","Supports forwarding based on content-name prefixes","Bills users"],"a":2,"w":"FIB forwards."},{"q":"CS stands for:","o":["Cache Server","Content Store","Control Switch","Cloud Storage"],"a":1,"w":"CS = Content Store."},{"q":"What does the Content Store do?","o":["Forwards by name prefix","Assigns IP addresses","Routes packets","Caches content chunks/data"],"a":3,"w":"CS caches."},{"q":"Exam trap in CCN:","o":["FIB caches; Content Store forwards","Both only forward","FIB forwards; Content Store caches","Both only cache"],"a":2,"w":"Per the notes."},{"q":"In VANET + CCN, caching:","o":["Helps disseminate content, but dynamic topology and unstable links remain challenges","Removes all challenges","Makes topology static","Forbids caching"],"a":0,"w":"Per the notes."}]},{"title":"Connected-Vehicle Body-and-Brain Architecture","summary":"Three layers in order: (1) Sense/execution layer: senses the environment and performs actions; (2) Network/transmission layer: communication bridge between sensing/execution and decision-making; (3) Decision layer: processes information and selects decisions/actions.","qs":[{"q":"Which layer senses the environment and performs actions?","o":["Network/transmission layer","Decision layer","Application layer","Sense/execution layer"],"a":3,"w":"Layer 1."},{"q":"Which layer is the communication bridge between sensing/execution and decision-making?","o":["Sense/execution layer","Network/transmission layer","Decision layer","Physical layer only"],"a":1,"w":"Layer 2."},{"q":"Which layer processes information and selects decisions/actions?","o":["Sense/execution layer","Decision layer","Network/transmission layer","Billing layer"],"a":1,"w":"Layer 3."},{"q":"The correct order of the layers is:","o":["Decision → Network → Sense","Network → Decision → Sense","Sense → Decision → Network","Sense/execution → Network/transmission → Decision"],"a":3,"w":"As given in the notes."}]},{"title":"Intelligent Connected Vehicles (ICVs) — Core Idea and Course-Slide Facts","summary":"An ICV combines vehicle connectivity with intelligent processing and safety/transport applications. The slides mention a 75 MHz spectrum allocation at 5850–5925 MHz, DSRC, IEEE 802.11p, the IEEE 1609 family and SAE J2735/J2945 — reproduced as course-slide facts, not verified current regulatory guidance.","qs":[{"q":"An ICV combines:","o":["Vehicle connectivity with intelligent processing and safety/transport applications","Only sensors","Only a cloud login","Only infotainment"],"a":0,"w":"Core idea."},{"q":"The spectrum allocation mentioned in the slides is:","o":["50 MHz at 2400–2450 MHz","100 MHz at 900–1000 MHz","75 MHz at 5850–5925 MHz","20 MHz at 5150–5170 MHz"],"a":2,"w":"Slides mention 75 MHz at 5850–5925 MHz."},{"q":"Check: 5925 − 5850 equals:","o":["50 MHz","100 MHz","25 MHz","75 MHz"],"a":3,"w":"5925 − 5850 = 75 MHz, matching the slide fact."},{"q":"Which IEEE standard is mentioned for vehicular wireless access in the slides?","o":["IEEE 802.15.4","IEEE 802.11p","IEEE 802.3","IEEE 802.1Q"],"a":1,"w":"Slides mention IEEE 802.11p."},{"q":"Which SAE standards are mentioned?","o":["SAE J2735 / J2945","SAE J1939 only","ISO 9001","SAE J1850 only"],"a":0,"w":"Slides mention SAE J2735/J2945."},{"q":"These ICV technical facts should be treated as:","o":["Current legal rules","Universal global law","Course-slide facts, not verified current regulatory guidance","Hardware specs of all cars"],"a":2,"w":"The notes caution this explicitly."}]},{"title":"IEEE 1609 / WAVE / DSRC Recall","summary":"The course associates IEEE 1609.4 with WAVE multichannel operations. DSRC/WAVE is presented as a connected-vehicle communication stack in the slides.","qs":[{"q":"DSRC/WAVE is presented as:","o":["A cloud billing system","A HAN standard","A connected-vehicle communication stack","A simulator"],"a":2,"w":"Per the notes."}]},{"title":"Three ICV Development Phases","summary":"Phase 1: 2G/3G, infotainment and remote processing. Phase 2: 4G LTE/DSRC and intelligent transport systems. Phase 3: cloud-connected vehicles.","qs":[{"q":"Phase 1 of ICV development is:","o":["4G LTE/DSRC and ITS","2G/3G, infotainment and remote processing","Cloud-connected vehicles","Autonomous fog"],"a":1,"w":"Phase 1."},{"q":"Phase 2 of ICV development is:","o":["2G/3G infotainment","Cloud-connected vehicles","Sensor-cloud","4G LTE/DSRC and intelligent transport systems"],"a":3,"w":"Phase 2."},{"q":"Phase 3 of ICV development is:","o":["2G/3G infotainment","4G LTE/DSRC","Cloud-connected vehicles","Stand-alone vehicles"],"a":2,"w":"Phase 3."}]},{"title":"V2X Advantages and Disadvantage","summary":"Advantages: reduced travel time, improved driver safety, and assistance in low visibility/bad weather. Disadvantage: tracking of vehicle movements, raising privacy concerns.","qs":[{"q":"Which is an advantage of V2X?","o":["Reduced travel time","Increased privacy","Fewer sensors","Lower safety"],"a":0,"w":"Per the notes."},{"q":"V2X can assist drivers in:","o":["Only sunny weather","Only indoor driving","Only parking","Low visibility or bad weather"],"a":3,"w":"Per the notes."},{"q":"The disadvantage listed for V2X is:","o":["Increased driver safety","Tracking of vehicle movements, raising privacy concerns","Reduced travel time","Better visibility"],"a":1,"w":"Per the notes."}]}]}];
